function reducedMotion(){
  return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
}
let threeReady = null;
function loadScript(src){
  return new Promise((res, rej)=>{
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = res; s.onerror = ()=>rej(new Error("script " + src));
    document.head.appendChild(s);
  });
}
function ensureThree(){
  if(threeReady) return threeReady;
  threeReady = (async ()=>{
    if(!window.THREE) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js");
    if(!window.THREE.GLTFLoader) await loadScript("https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js");
    return window.THREE;
  })().catch(e=>{ threeReady = null; throw e; });
  return threeReady;
}
function b64ToBuffer(b64){
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}
const easeOutCubic = t=>1 - Math.pow(1-t, 3);
const easeInOut = t=>t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

/* précharge discrète pour que la première ouverture soit fluide */
setTimeout(()=>{ if(!reducedMotion()) ensureThree().catch(()=>{}); }, 4000);

async function playBoosterIntro(kind){
  if(reducedMotion()) return;
  let THREE;
  try{
    THREE = await Promise.race([ensureThree(), new Promise((_,r)=>setTimeout(()=>r(new Error("délai")), 2600))]);
  }catch(e){ return; }                       // pas de réseau ou pas de WebGL : on ouvre sans intro

  const tint = B3D_TINT[kind] || B3D_TINT.normal;
  const wrap = document.createElement("div");
  wrap.className = "b3d";
  wrap.style.setProperty("--b3dglow", tint.glow);
  wrap.innerHTML = `<div class="b3dbg"></div><div class="b3dflash"></div>`;
  document.body.appendChild(wrap);

  let renderer;
  try{
    renderer = new THREE.WebGLRenderer({alpha:true, antialias:true});
  }catch(e){ wrap.remove(); return; }
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setSize(W, H);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.domElement.className = "b3dcanvas";
  wrap.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, W/H, 0.1, 100);
  // sur écran étroit on recule un peu pour que le paquet tienne en largeur
  camera.position.set(0, 0, W/H < 0.62 ? 16.5 : 13.5);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xFFF1D6, 1.1); key.position.set(-4, 5, 8); scene.add(key);
  const rim = new THREE.DirectionalLight(tint.rim, 1.6);  rim.position.set(3, 2, -6);  scene.add(rim);
  const sweep = new THREE.PointLight(0xffffff, 0, 14);   sweep.position.set(-5, 1, 5); scene.add(sweep);

  const loadTex = url=>{ const t = new THREE.TextureLoader().load(url); t.flipY = false; return t; };
  const map = loadTex(BOOSTER3D.base); map.encoding = THREE.sRGBEncoding;
  map.anisotropy = renderer.capabilities.getMaxAnisotropy ? Math.min(8, renderer.capabilities.getMaxAnisotropy()) : 1;
  const mat = new THREE.MeshStandardMaterial({
    map, normalMap:loadTex(BOOSTER3D.normal), roughnessMap:loadTex(BOOSTER3D.rough),
    metalnessMap:loadTex(BOOSTER3D.metal), metalness:0.55, roughness:0.6,
    color:tint.color, emissive:tint.emissive, side:THREE.DoubleSide
  });

  let gltf;
  try{
    gltf = await new Promise((res, rej)=>new THREE.GLTFLoader().parse(b64ToBuffer(BOOSTER3D.glb), "", res, rej));
  }catch(e){ renderer.dispose(); wrap.remove(); return; }
  gltf.scene.traverse(o=>{ if(o.isMesh){ o.material = mat; } });

  // le recto du modèle regarde +X : un quart de tour l'amène face à la caméra
  const inner = new THREE.Group();
  inner.add(gltf.scene);
  inner.rotation.y = -Math.PI/2;
  const pack = new THREE.Group();
  pack.add(inner);
  scene.add(pack);

  requestAnimationFrame(()=>wrap.classList.add("on"));
  sfx.open();

  const T0 = performance.now();
  const D_IN = 1150, D_HOLD = 650, D_SHAKE = 450, D_OUT = 520;
  const TOTAL = D_IN + D_HOLD + D_SHAKE + D_OUT;
  let burst = false;

  await new Promise(resolve=>{
    function frame(){
      const t = performance.now() - T0;
      if(t < D_IN){
        // arrivée : il jaillit du fond en tournoyant
        const k = easeOutCubic(t / D_IN);
        pack.position.set(0, -5.5*(1-k), -14*(1-k));
        pack.rotation.set(-0.7*(1-k), Math.PI*2*3*(1-k), 0.35*(1-k));
        const sc = 0.25 + 0.75*k;
        pack.scale.set(sc, sc, sc);
      } else if(t < D_IN + D_HOLD){
        // présentation : léger flottement et reflet qui balaie le papier
        const k = (t - D_IN) / D_HOLD;
        pack.position.set(0, Math.sin(k*Math.PI)*0.18, 0);
        pack.rotation.set(Math.sin(k*Math.PI*2)*0.05, Math.sin(k*Math.PI)*0.22, 0);
        pack.scale.set(1,1,1);
        sweep.intensity = 1.25 * Math.sin(k*Math.PI);
        sweep.position.x = -5 + 10*k;
      } else if(t < D_IN + D_HOLD + D_SHAKE){
        // tension : le paquet tremble de plus en plus fort
        const k = (t - D_IN - D_HOLD) / D_SHAKE;
        const a = 0.02 + 0.09*k;
        pack.position.set((Math.random()-.5)*a*4, (Math.random()-.5)*a*4, 0);
        pack.rotation.set((Math.random()-.5)*a, (Math.random()-.5)*a, (Math.random()-.5)*a*1.5);
        const sc = 1 + 0.07*k; pack.scale.set(sc, sc, sc);
        rim.intensity = 1.6 + 3*k;
      } else if(t < TOTAL){
        // éclatement : il grandit, s'illumine et s'efface dans un flash
        if(!burst){ burst = true; wrap.classList.add("burst"); try{ sfx.epic(); }catch(e){} }
        const k = easeInOut((t - D_IN - D_HOLD - D_SHAKE) / D_OUT);
        const sc = 1.07 + 0.55*k; pack.scale.set(sc, sc, sc);
        pack.rotation.set(0, 0.18*k, 0);
        pack.position.set(0, 0, 1.6*k);
        mat.emissive.setHex(tint.rim); mat.emissiveIntensity = 0.55*k;
        renderer.domElement.style.opacity = String(1 - k);
      } else {
        return resolve();
      }
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });

  wrap.classList.add("off");
  setTimeout(()=>{
    [map, mat.normalMap, mat.roughnessMap, mat.metalnessMap].forEach(t=>t && t.dispose());
    mat.dispose();
    gltf.scene.traverse(o=>{ if(o.isMesh && o.geometry) o.geometry.dispose(); });
    renderer.dispose();
    wrap.remove();
  }, 420);
}

/* Le marchand renard : cinq bricoles, ou une pièce de choix. */
function repeatOpen(kind, n){
  if(!canRepeat(kind, n)) return go("hub");
  if(kind === "fox") return openFox();
  playBoosterIntro(kind);
  return openPack(n, kind);
}

async function openFox(){
  if(state.busy || !(state.profile.fox||0)) return;
  state.busy = true;
  state.profile.fox--;
  playBoosterIntro("fox");
  startShaking();
  state.reveal = {loading:true, kind:"fox", count:1, msg:"le marchand fouille son sac…", cards:[], flipped:[]};
  renderStage();
  try{
    const pool = await ensurePool();
    if(!pool.length) throw new Error("aucun univers joignable");
    const jackpot = Math.random() < 0.3;
    const queue = shuffled(pool);
    let cards = [];
    if(jackpot){
      const rar = Math.random() < 0.25 ? "Légendaire" : "Ultra rare";
      for(let t=0;t<3 && !cards.length;t++){
        const c = await drawForRarity(queue[t % queue.length], rar).catch(()=>null);
        if(c) cards = [c];
      }
    } else {
      const got = await Promise.all([0,1,2,3,4].map(i=>drawForRarity(queue[i % queue.length], "Commun").catch(()=>null)));
      cards = got.filter(Boolean);
    }
    if(!cards.length) throw new Error("le marchand n'a rien trouvé");
    state.profile.packs = (state.profile.packs||0) + 1;
    await saveAll();
    state.busy = false;
    stopShaking();
    state.reveal = {loading:false, kind:"fox", count:1, cards, flipped:cards.map(()=>false), jackpot,
      note: jackpot ? "Le marchand a l'œil brillant." : "Le marchand hausse les épaules."};
    renderStage();
    setTimeout(()=>{ if(jackpot) sfx.fanfare(); else sfx.hurt(); }, 300);
  }catch(e){
    state.busy = false; stopShaking();
    state.profile.fox++;
    state.reveal = null; renderStage();
    const m = view.querySelector("#packmsg");
    if(m) m.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

async function openPack(n, kind){
  if(state.busy) return;
  n = n || 1; kind = kind || "normal";
  if(kind === "fox") return openFox();
  syncFree();

  if(kind === "mythic"){
    if((state.profile.mythic||0) < n) return;
  } else if(kind === "demon"){
    if((state.profile.demon||0) < n) return;
  } else if(!state.profile.freeShot && !canAfford(n)){
    state.reveal = null; renderStage(); return;
  }

  flushReveal();
  const token = (state.openToken||0) + 1;
  state.openToken = token;
  state.busy = true;
  if(kind === "demon") sfx.demonOpen(); else sfx.open();
  startShaking();
  state.reveal = {loading:true, kind, count:n, msg:state.pool.length?"ouverture…":"repérage des univers…", cards:[], flipped:[]};
  renderStage();

  try{
    const pool = await ensurePool();
    if(!pool.length) throw new Error("aucun univers joignable");

    let all = [];
    for(let k=0;k<n;k++){
      if(n > 1){
        state.reveal.msg = `paquet ${k+1} sur ${n}…`;
        renderStage();
      }
      const cards = await drawPack(pool, kind);
      if(state.openToken !== token){ state.busy = false; return; }   // le joueur a quitté : rien n'est débité
      all = all.concat(cards);
    }
    if(!all.length) throw new Error("aucun wiki n'a répondu");
    if(state.openToken !== token){ state.busy = false; return; }

    // paiement une fois les cartes en main
    let paid = {free:0, coins:0};
    if(kind === "mythic"){
      state.profile.mythic -= n;
    } else if(kind === "demon"){
      state.profile.demon -= n;
    } else if(state.profile.freeShot){
      state.profile.freeShot = false;          // booster déjà payé au comptoir
    } else {
      paid = costFor(n);
      if(paid.free){
        if(state.profile.free >= FREE_MAX) state.profile.freeAt = Date.now();
        state.profile.free -= paid.free;
      }
      state.profile.coins -= paid.coins;
    }
    state.profile.packs = (state.profile.packs||0) + n;

    const found = [];
    for(let k=0;k<n;k++){
      const key = rollItem(kind);
      if(!key) continue;
      if(invFreeSpace(key) < 1){ found.push("plein"); continue; }
      addItem(key, 1);
      found.push(key);
      state.profile.items = (state.profile.items||0) + 1;
    }
    if(found.length){
      const full = found.filter(f=>f==="plein").length;
      const real = found.filter(f=>f!=="plein");
      real.forEach((k,i)=>setTimeout(()=>{
        toast(item(k).name, "Objet trouvé", "ach"); sfx.ach();
      }, 700 + i*1300));
      if(full) setTimeout(()=>toast("Sacoche pleine", `${full} objet(s) perdu(s)`, "lose"), 700 + real.length*1300);
    }
    if(kind === "mythic") state.profile.mythOpened = (state.profile.mythOpened||0) + n;
    if(kind === "demon")  state.profile.demonOpened = (state.profile.demonOpened||0) + n;
    if(n >= 10) state.profile.tens = (state.profile.tens||0) + 1;

    state.forcedUniv = null;
    const missing = n*5 - all.length;
    if(n === 1){
      state.reveal = {loading:false, kind, count:1, cost:paid, cards:all, flipped:all.map(()=>false),
        note: missing ? `${missing} tirage(s) sans réponse du wiki — paquet livré à ${all.length} cartes.` : ""};
    } else {
      all.forEach(addCard);
      all.sort((a,b)=>RARITIES.indexOf(b.rarity)-RARITIES.indexOf(a.rarity));
      state.reveal = {loading:false, bulk:true, kind, count:n, cost:paid, cards:all};
      const best = all[0];
      if(best) sfxForRarity(best.rarity);
      if(best && RARITIES.indexOf(best.rarity) >= 2) celebrate(best.rarity);
    }
    await saveAll();
    state.busy = false;
    stopShaking();
    document.getElementById("coins").textContent = short(state.profile.coins);
    tick();
    renderStage();
    checkAch();
  }catch(e){
    state.busy = false;
    stopShaking();
    state.reveal = null;
    renderStage();
    const m = view.querySelector("#packmsg");
    if(m) m.innerHTML = `<div class="err">Tirage impossible : ${esc(e.message)}.${SANDBOX?" Le réseau externe est bloqué dans les artefacts Claude — ouvrez le fichier hors de Claude.":""}</div>`;
  }
}

function albumMatches(){
  const q = (state.q||"").trim().toLowerCase();
  return state.collection.filter(c=>
    (state.fRar==="Tous"||c.rarity===state.fRar) &&
    (state.fUniv==="Tous"||c.univ===state.fUniv) &&
    (!q || (c.title+" "+c.univ+" "+(c.desc||"")).toLowerCase().includes(q)) &&
    (!state.fDup || state.fDup==="Tous"
      || (state.fDup==="Doublons" && c.count>1)
      || (state.fDup==="Uniques" && c.count===1)
      || (state.fDup==="Fusionnables" && c.count>=5))
  ).sort((a,b)=>RARITIES.indexOf(b.rarity)-RARITIES.indexOf(a.rarity)||a.title.localeCompare(b.title));
}

const PAGE_SIZE = 24;
function renderAlbumGrid(reset){
  const box = view.querySelector("#albumgrid");
  if(!box) return;
  const list = albumMatches();
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(reset !== false) state.page = Math.min(state.page||1, pages);
  if(!state.page || state.page < 1) state.page = 1;
  const p = state.page;
  const slice = list.slice((p-1)*PAGE_SIZE, p*PAGE_SIZE);

  const count = view.querySelector("#albumcount");
  if(count) count.textContent = list.length ? `${list.length} carte${list.length>1?"s":""} · page ${p} sur ${pages}` : "";

  const pager = pages > 1 ? `<div class="pager">
      <button class="btn small ghost" data-pg="1" ${p===1?"disabled":""}>«</button>
      <button class="btn small ghost" data-pg="${p-1}" ${p===1?"disabled":""}>Précédent</button>
      <span class="pgnum">${p} / ${pages}</span>
      <button class="btn small ghost" data-pg="${p+1}" ${p===pages?"disabled":""}>Suivant</button>
      <button class="btn small ghost" data-pg="${pages}" ${p===pages?"disabled":""}>»</button>
    </div>` : "";

  box.innerHTML = list.length
    ? `<div class="grid">${slice.map(c=>cardHTML(c,{click:true})).join("")}</div>${pager}`
    : (state.collection.length
        ? `<div class="panel">Aucune carte ne correspond à cette recherche.</div>`
        : `<div class="panel">Rien ici pour l'instant. <button class="btn small" data-go="pack" style="margin-left:.4rem">Ouvrir un paquet</button></div>`);

  box.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  box.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{
    state.page = +b.dataset.pg;
    sfx.tick();
    renderAlbumGrid(false);
    const top = view.querySelector("#albumgrid");
    if(top && top.scrollIntoView) top.scrollIntoView({block:"start", behavior:"smooth"});
  });
  box.querySelectorAll(".card[data-id]").forEach(el=>{
    const open = ()=>showCard(state.collection.find(c=>c.id===el.dataset.id));
    el.onclick = open;
    el.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } };
  });
}

function viewAlbum(){

  const total = state.collection.reduce((n,c)=>n+c.count,0);
  view.innerHTML = `
    <h2 style="font-size:1.6rem">Album</h2>
    <p class="sub">${state.collection.length} carte${state.collection.length>1?"s":""} distincte${state.collection.length>1?"s":""} — ${total} exemplaire${total>1?"s":""}, ${worlds.length} univers.</p>
    <div class="filters">
      <input id="q" placeholder="Rechercher un nom, un univers…" value="${esc(state.q||"")}" autocomplete="off">
      <select id="fr" aria-label="Rareté">
        ${["Tous",...RARITIES].map(r=>`<option value="${esc(r)}" ${r===state.fRar?"selected":""}>${r==="Tous"?"Toutes raretés":esc(r)}</option>`).join("")}
      </select>
      <select id="fd" aria-label="Doublons">
        <option value="Tous" ${(state.fDup||"Tous")==="Tous"?"selected":""}>Toutes les cartes</option>
        <option value="Doublons" ${state.fDup==="Doublons"?"selected":""}>Doublons seulement</option>
        <option value="Uniques" ${state.fDup==="Uniques"?"selected":""}>Exemplaires uniques</option>
        <option value="Fusionnables" ${state.fDup==="Fusionnables"?"selected":""}>Fusionnables (5+)</option>
      </select>
      <select id="fu" aria-label="Univers">
        ${["Tous",...worlds].map(u=>`<option value="${esc(u)}" ${u===state.fUniv?"selected":""}>${u==="Tous"?"Tous univers":esc(u)}</option>`).join("")}
      </select>
      <span class="sub" id="albumcount"></span>
    </div>
    <div id="albumgrid"></div>`;

  const q = view.querySelector("#q");
  q.oninput = ()=>{ state.q = q.value; state.page = 1; renderAlbumGrid(); };

  view.querySelector("#fu").onchange = e=>{ state.fUniv = e.target.value; state.page = 1; renderAlbumGrid(); };
  view.querySelector("#fd").onchange = e=>{ state.fDup = e.target.value; state.page = 1; renderAlbumGrid(); };
  renderAlbumGrid();
}

function showCard(c){
  if(!c) return;
  const busy = engagedIds().has(c.id);
  const unit = SELL[c.rarity];
  const m = document.createElement("div");
  m.className="modal";
  let qty = 1;

  const draw = ()=>{
    m.innerHTML = `<div class="inner">
      <div style="max-width:230px;margin:0 auto">${cardHTML(c)}</div>
      <p class="sub" style="margin:.8rem 0 .2rem">${c.count>1?`${c.count} exemplaires · `:""}notoriété ${c.note||0} dans ${esc(c.univ||"")}</p>
      <p class="sub" style="margin:.2rem 0 .6rem">${esc(c.text||c.desc||"")}</p>

      ${c.count>=5 && (c.stars||0)<3 ? `<div class="sellbox" style="margin-bottom:.5rem">
        <div class="row" style="justify-content:space-between;align-items:center">
          <span class="sub">Fusionner 5 exemplaires en une carte ${"★".repeat((c.stars||0)+1)}</span>
          <button class="btn small" id="fuse">Fusionner</button>
        </div>
        <p class="sub" style="margin:.35rem 0 0;font-size:.8rem">+6 % d'attaque et de défense par étoile, et une aura qui s'intensifie.</p>
      </div>`:""}
      ${(()=>{ const m = battleCard(c); return `<div class="duelbox">
        <div class="row" style="align-items:center;gap:.6rem">
          <span class="dcost">${m.cost}</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700">${ROLES[m.role].emoji} ${ROLES[m.role].name} — <b style="color:var(--brass)">${m.atk}/${m.hp}</b> en donjon</div>
            <div class="sub" style="font-size:.82rem">${esc(keywordText(m) || "Serviteur sans mot-clé")}</div>
          </div>
        </div>
      </div>`; })()}
      <div class="sellbox">
        ${busy ? `<p class="sub" style="margin:0">Carte engagée en campagne : impossible de la renvoyer pour l'instant.</p>`
        : `<div class="row" style="justify-content:space-between;align-items:center">
            <span class="sub">Renvoyer contre ${unit} ◆ l'unité</span>
            ${c.count>1? `<span class="qty">
              <button class="btn small ghost" id="less">−</button>
              <b id="qn">${qty}</b>
              <button class="btn small ghost" id="more">+</button>
              <button class="btn small ghost" id="allq">tout</button>
            </span>`:""}
          </div>
          <button class="btn" id="sell" style="width:100%;margin-top:.6rem">Renvoyer ${c.count>1?`${qty} carte${qty>1?"s":""}`:"la carte"} · ${qty*unit} ◆</button>`}
      </div>

      <div class="row" style="margin-top:.7rem">
        <a class="btn small ghost" href="${esc(c.url)}" target="_blank" rel="noopener">Lire l'article</a>
        <button class="btn small ghost" id="close">Fermer</button>
      </div>
    </div>`;

    m.querySelector("#close").onclick = ()=>m.remove();
    const fuse = m.querySelector("#fuse");
    if(fuse) fuse.onclick = async ()=>{
      if(c.count < 5 || (c.stars||0) >= 3) return;
      c.count -= 4;
      c.stars = (c.stars||0) + 1;
      c.atk = Math.round(c.atk * 1.06);
      c.def = Math.round(c.def * 1.06);
      await sset("fm:col", state.collection);
      sfx.legendary();
      logEvent(`${c.title} fusionnée en ${"★".repeat(c.stars)}`, "gold");
      toast(`${c.title} · ${"★".repeat(c.stars)}`);
      m.remove();
      if(state.view === "album") viewAlbum(); else render();
    };
    const less = m.querySelector("#less"), more = m.querySelector("#more"), allq = m.querySelector("#allq");
    if(less) less.onclick = ()=>{ qty = Math.max(1, qty-1); draw(); };
    if(more) more.onclick = ()=>{ qty = Math.min(c.count, qty+1); draw(); };
    if(allq) allq.onclick = ()=>{ qty = c.count; draw(); };
    const sell = m.querySelector("#sell");
    if(sell) sell.onclick = async ()=>{
      const n = Math.min(qty, c.count);
      state.profile.coins += n*unit;
      state.profile.sold = (state.profile.sold||0) + n;
      c.count -= n;
      if(c.count <= 0){
        state.collection = state.collection.filter(x=>x.id !== c.id);
        state.profile.slots = (state.profile.slots||[]).filter(id=>id !== c.id);
        if(state.profile.avatar === c.id) state.profile.avatar = null;
      }
      await saveAll();
      document.getElementById("coins").textContent = short(state.profile.coins);
      sfx.coin();
      toast(`${n} carte${n>1?"s":""} renvoyée${n>1?"s":""} · +${n*unit} ◆`);
      m.remove();
      if(state.view === "album") viewAlbum(); else render();
    };
  };

  m.onclick = e=>{ if(e.target===m) m.remove(); };
  draw();
  document.body.appendChild(m);
}

/* ---------- rythme quotidien ---------- */
function today(){ return Math.floor(Date.now()/86400000); }
function dayRnd(salt){ return mulberry32((today()*2654435761 + salt*97) % 2147483647); }

function featuredUniverse(){
  if(!state.pool.length) return null;
  const r = dayRnd(7)();
  return state.pool[Math.floor(r*state.pool.length)];
}

function dailyState(){
  const p = state.profile;
  const d = today();
  if(!p.daily || p.daily.day !== d){
    const rnd = dayRnd(3);
    const pool = MISSIONS.slice().sort(()=>rnd()-0.5).slice(0,4);
    p.daily = {
      day:d,
      list: pool.map(m=>({id:m.id, goal:m.goals[Math.floor(rnd()*m.goals.length)]})),
      base: Object.fromEntries(MISSIONS.map(m=>[m.id, m.stat(p)])),
      claimed: [],
      chUniv: null, chDone:false, chClaimed:false
    };
    sset("fm:profile", p);
  }
  return p.daily;
}
function missionProgress(entry){
  const m = MISSIONS.find(x=>x.id === entry.id);
  const d = dailyState();
  return Math.max(0, m.stat(state.profile) - (d.base[entry.id]||0));
}
function challengeUniverse(){
  const d = dailyState();
  if(!d.chUniv && state.pool.length){
    const r = dayRnd(11)();
    d.chUniv = state.pool[Math.floor(r*state.pool.length)].label;
    sset("fm:profile", state.profile);
  }
  return d.chUniv;
}

function paintDaily(){
  const box = document.getElementById("dailybox");
  if(!box) return;
  const d = dailyState();
  const done = d.list.filter((e,i)=>missionProgress(e) >= e.goal).length;
  const ch = challengeUniverse();
  box.innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <h3 style="font-size:1.05rem">Missions du jour</h3>
      <span class="sub">${done} / ${d.list.length}</span>
    </div>
    ${d.list.map((e,i)=>{
      const m = MISSIONS.find(x=>x.id===e.id);
      const v = Math.min(missionProgress(e), e.goal);
      const ok = v >= e.goal, got = d.claimed.includes(e.id);
      return `<div class="mission ${got?"got":ok?"ready":""}">
        <div style="flex:1;min-width:0">
          <div class="t">${esc(m.txt(e.goal))}</div>
          <div class="bar"><i style="width:${Math.round(v/e.goal*100)}%"></i></div>
          <div class="sub" style="font-size:.76rem">${v} / ${e.goal} · +${m.gold} ◆</div>
        </div>
        ${got? `<span class="tag ok">reçu</span>`
             : ok? `<button class="btn small" data-claim="${e.id}">Encaisser</button>`
                 : `<span class="tag">en cours</span>`}
      </div>`;
    }).join("")}
    <div class="challenge">
      <div style="flex:1;min-width:0">
        <div class="t">Défi du jour ${ch?`· ${esc(ch)}`:""}</div>
        <div class="sub" style="font-size:.8rem">${ch? `Trouver une carte de ${esc(ch)} — récompense : un booster garanti de cet univers.` : "Repérage des univers en cours…"}</div>
      </div>
      ${d.chClaimed? `<span class="tag ok">reçu</span>`
        : d.chDone? `<button class="btn small" id="chclaim">Encaisser</button>`
                  : `<span class="tag">en cours</span>`}
    </div>`;

  box.querySelectorAll("[data-claim]").forEach(b=>b.onclick = async ()=>{
    const id = b.dataset.claim;
    const m = MISSIONS.find(x=>x.id===id);
    if(d.claimed.includes(id)) return;
    d.claimed.push(id);
    state.profile.coins += m.gold;
    sfx.coin();
    logEvent(`Mission du jour accomplie · +${m.gold} ◆`, "gold");
    await sset("fm:profile", state.profile);
    document.getElementById("coins").textContent = short(state.profile.coins);
    paintDaily();
  });
  const cc = box.querySelector("#chclaim");
  if(cc) cc.onclick = async ()=>{
    d.chClaimed = true;
    state.profile.univBoosters = (state.profile.univBoosters||[]).concat(d.chUniv);
    sfx.fanfare();
    logEvent(`Défi du jour relevé · booster ${d.chUniv} obtenu`, "gold");
    await sset("fm:profile", state.profile);
    toast(`Booster ${d.chUniv} ajouté à vos ouvertures`);
    paintDaily();
  };
}

const LOG_MAX = 50;
function logEvent(text, kind){
  const l = state.profile.log || (state.profile.log = []);
  l.unshift({t:Date.now(), text, kind:kind||"info"});
  if(l.length > LOG_MAX) l.length = LOG_MAX;
  sset("fm:profile", state.profile);
  if(state.view === "hub") paintLog();
}
function ago(t){
  const m = Math.floor((Date.now()-t)/60000);
  if(m < 1) return "à l'instant";
  if(m < 60) return `il y a ${m} min`;
  const h = Math.floor(m/60);
  if(h < 24) return `il y a ${h} h`;
  return `il y a ${Math.floor(h/24)} j`;
}
function paintLog(){
  const box = document.getElementById("logbox");
  if(!box) return;
  const l = state.profile.log || [];
  box.innerHTML = l.length
    ? l.map((e,i)=>`<div class="logline ${esc(e.kind)}" style="opacity:${Math.max(.18, 1 - i*0.028).toFixed(2)}">
        <span class="dot"></span><span class="tx">${esc(e.text)}</span><span class="ag">${ago(e.t)}</span>
      </div>`).join("")

}

async function buyFrom(shopKey, itemKey){
  const sh = SHOPS.find(x=>x.key === shopKey);
  const line = sh && sh.stock.find(x=>x.key === itemKey);
  if(!line) return;
  const p = state.profile;
  if(p.coins < line.price) return;

  if(SHOP_LABEL[itemKey]){
    p.coins -= line.price;
    if(itemKey === "pack") p.shopPacks = (p.shopPacks||0) + 1;
    if(itemKey === "pack5") p.shopPacks = (p.shopPacks||0) + 5;
    if(itemKey === "mythic") p.mythic = (p.mythic||0) + 1;
    if(itemKey === "demon") p.demon = (p.demon||0) + 1;
    sfx.coin();
    toast(SHOP_LABEL[itemKey].name, "Rangé dans vos ouvertures", "ach");
  } else {
    if(invFreeSpace(itemKey) < 1) return toast("Sacoche pleine", "Videz un emplacement", "lose");
    p.coins -= line.price;
    addItem(itemKey, 1);
    sfx.coin();
    toast(item(itemKey).name, "Acheté au village", "ach");
  }
  await saveAll();
  document.getElementById("coins").textContent = short(p.coins);
  viewVillage();
}

  arm2:`<rect x="29" y="6" width="6" height="52" rx="3"/><path d="M35 10c12 0 20 7 22 16-8-3-15-2-22 3z"/><path class="fl" d="M29 10C17 10 9 17 7 26c8-3 15-2 22 3z"/>`,
  arm3:`<rect x="6" y="26" width="44" height="9" rx="3"/><rect x="44" y="28" width="16" height="5" rx="2"/><path d="M18 35h10l-3 14a4 4 0 0 1-8 0z"/><rect x="28" y="18" width="10" height="9" rx="3"/><circle class="fl" cx="53" cy="30" r="4"/>`,
  arm4:`<circle class="bg" cx="32" cy="32" r="26"/><circle cx="32" cy="32" r="6"/><path d="M32 6a26 26 0 0 1 22 13l-13 7a11 11 0 0 0-9-5z"/><path d="M10 19a26 26 0 0 0 0 26l13-8a11 11 0 0 1 0-10z"/><path d="M54 45a26 26 0 0 1-44 0l13-8a11 11 0 0 0 18 0z" transform="rotate(120 32 32)"/>`
};

function item(key){ return ITEMS.find(i=>i.key===key); }
function itemFam(key){ return FAM[item(key).fam]; }
function itemSVGMini(key){ return `<span class="isvgmini">${itemSVG(key)}</span>`; }
function itemShort(key){ return item(key).name.replace(/^Potion de (vie|dégât) /,"").replace(/^Armement /,""); }

function inv(){ return state.profile.inv || (state.profile.inv = []); }
function invSlots(){ return INV_BASE + INV_STEP*(state.profile.invUp||0); }
function countItem(key){ return inv().filter(s=>s.key===key).reduce((n,s)=>n+s.n, 0); }
function invFreeSpace(key){
  const open = inv().filter(s=>s.key===key).reduce((n,s)=>n+(STACK-s.n), 0);
  return open + (invSlots() - inv().length)*STACK;
}
function addItem(key, n=1){
  let left = n;
  inv().filter(s=>s.key===key && s.n<STACK).forEach(s=>{
    const take = Math.min(STACK-s.n, left); s.n += take; left -= take;
  });
  while(left > 0 && inv().length < invSlots()){
    const take = Math.min(STACK, left);
    inv().push({key, n:take}); left -= take;
  }
  return n - left;
}
function useItem(key, n=1){
  let left = n;
  for(let i=inv().length-1; i>=0 && left>0; i--){
    const s = inv()[i];
    if(s.key !== key) continue;
    const take = Math.min(s.n, left); s.n -= take; left -= take;
    if(s.n <= 0) inv().splice(i,1);
  }
  state.profile.hotbar = (state.profile.hotbar||[]).map(k=>k && countItem(k) ? k : null);
  return n - left;
}

function itemSVG(key){
  const d = item(key);
  return `<svg viewBox="0 0 64 64" class="isvg" aria-hidden="true">
    <defs><linearGradient id="g${key}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${FAM[d.fam].a}"/><stop offset="1" stop-color="${RANK_TINT[d.rank]}"/>
    </linearGradient></defs>
    <g fill="url(#g${key})" stroke="none">${ICONS[key]}</g>
  </svg>`;
}

function itemTile(key, n, opts={}){
  const d = item(key), f = itemFam(key);
  return `<div class="item r${d.rank} ${opts.sel?"sel":""}" style="--ia:${f.a};--ib:${f.b};--rk:${RANK_TINT[d.rank]}"
      ${opts.click?`data-item="${key}"`:""} title="${esc(d.name)}">
    <span class="grid4"></span>
    <span class="pic">${itemSVG(key)}</span>
    <span class="rk">${Array.from({length:d.rank},()=>"<i></i>").join("")}</span>
    ${n!=null?`<span class="n">${n}</span>`:""}
  </div>`;
}

  const d = state.deckEdit;
  const size = DECK_SIZES[d.kind];

  view.innerHTML = `
    <h2 style="font-size:1.6rem">${d.kind==="bataille"?"Deck de donjon":"Deck de campagne"}</h2>
    ${deckHTML(d)}

      <div class="sub" style="margin:.9rem 0 .35rem">Couleur</div>
      <div class="row">${DECK_COLORS.map(c=>`<button class="swatch" data-col="${esc(c.a)}|${esc(c.b)}"
        aria-pressed="${c.a===d.a}" title="${esc(c.n)}" style="background:linear-gradient(135deg,${c.a},${c.b})"></button>`).join("")}</div>
      <div class="sub" style="margin:.9rem 0 .35rem">Emblème</div>
      <div class="row">${DECK_GLYPHS.map(g=>`<button class="embtn" data-gl="${esc(g)}" aria-pressed="${g===d.glyph}">${esc(g)}</button>`).join("")}</div>
      <div class="sub" style="margin:.9rem 0 .35rem">Illustration de la boîte</div>
      <div class="row">
        <button class="btn small ghost" id="pickcover">Choisir une carte</button>
        ${d.cover? `<button class="btn small ghost" id="nocover">Retirer</button>`:""}
        <span class="sub" style="font-size:.82rem">${d.cover? "Illustration choisie." : "Par défaut, la première carte illustrée du deck."}</span>
      </div>
    </div>

    <div class="row" style="justify-content:space-between;align-items:center">
      <h3 style="font-size:1.1rem">Cartes · ${cards.length} / ${size}</h3>
      <button class="btn small" id="pickc">Choisir les cartes</button>
    </div>
    ${cards.length? `<div class="grid" style="margin-top:.6rem">${cards.map(c=>cardHTML(c,{compact:true})).join("")}</div>`
      : `<div class="panel" style="margin-top:.6rem">Aucune carte dans ce deck.</div>`}

    <div class="row" style="margin-top:1.2rem">
      <button class="btn" id="save">Enregistrer</button>
      <button class="btn ghost" id="cancel">Annuler</button>
      <span class="sub">${cards.length===size?"Deck complet.":`Il manque ${size-cards.length} carte(s) pour l'utiliser.`}</span>
    </div>`;

  view.querySelector("#dname").oninput = e=>{ d.name = e.target.value.slice(0,26); };
  view.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{
    const [a,bb] = b.dataset.col.split("|"); d.a=a; d.b=bb; renderDeckEditor();
  });
  view.querySelectorAll("[data-gl]").forEach(b=>b.onclick=()=>{ d.glyph = b.dataset.gl; renderDeckEditor(); });
  view.querySelector("#pickc").onclick = ()=>pickCard({
    title:`Cartes du deck (${size})`,
    multi:size,
    pre:d.cards.slice(),
    filter:c=>d.kind==="campagne" ? (c.rarity==="Légendaire"||c.rarity==="Ultra rare"||c.rarity==="Relique") : true,
    onPick:cs=>{ d.cards = cs.map(c=>c.id); renderDeckEditor(); }
  });
  view.querySelector("#pickcover").onclick = ()=>{
    const inDeck = deckCards(d).filter(c=>c.img);
    pickCard({
      title:"Illustration de la boîte",
      filter: inDeck.length ? c=>d.cards.includes(c.id) && !!c.img : c=>!!c.img,
      onPick:c=>{ d.cover = c.id; renderDeckEditor(); }
    });
  };
  const nc = view.querySelector("#nocover");
  if(nc) nc.onclick = ()=>{ d.cover = null; renderDeckEditor(); };
  view.querySelector("#cancel").onclick = ()=>{ state.deckEdit = null; viewDecks(); };
  view.querySelector("#save").onclick = async ()=>{
    const all = decks();
    const i = all.findIndex(x=>x.id === d.id);
    if(i>=0) all[i] = d; else all.push(d);
    await sset("fm:profile", state.profile);
    state.deckEdit = null;
    toast("Deck enregistré");
    viewDecks();
  };
}

/* ========================================================================
   DONJON — exploration sur grille et combat au tour par tour
   ======================================================================== */
const DJ_W = 21, DJ_H = 17;          // taille de la grille
const PARTY = 5;                     // cartes engagées
const VIEW_R = 3;                    // rayon de découverte
const EXIT_GOLD = 120;               // prime de sortie, une fois dehors
const FLOORS = 3;                    // étages à traverser
const POTION_CAP = {heal:4, dmg:4};  // flacons autorisés par expédition
const CAM_W = 11, CAM_H = 9;         // fenêtre de caméra sur petit écran

/* ---------- génération ---------- */
function rnd(n){ return Math.floor(Math.random()*n); }
function emptyGrid(){
  return Array.from({length:DJ_H}, ()=>Array.from({length:DJ_W}, ()=>0));
}
function carveRoom(g, r){
  for(let y=r.y; y<r.y+r.h; y++) for(let x=r.x; x<r.x+r.w; x++) g[y][x] = 1;
}
function carveCorridor(g, a, b){
  let x = a.x, y = a.y;
  while(x !== b.x){ g[y][x] = g[y][x] || 2; x += b.x > x ? 1 : -1; }
  while(y !== b.y){ g[y][x] = g[y][x] || 2; y += b.y > y ? 1 : -1; }
  g[y][x] = g[y][x] || 2;
}
function genDungeon(floor){
  const g = emptyGrid();
  const rooms = [];
  const cols = 4, rows = 3;
  const cw = Math.floor(DJ_W/cols), ch = Math.floor(DJ_H/rows);
  for(let ry=0; ry<rows; ry++) for(let rx=0; rx<cols; rx++){
    if(Math.random() < 0.12 && rooms.length > 3) continue;      // quelques secteurs vides
    const w = 3 + rnd(Math.max(1, cw-3)), h = 3 + rnd(Math.max(1, ch-3));
    const x = rx*cw + 1 + rnd(Math.max(1, cw-w-1));
    const y = ry*ch + 1 + rnd(Math.max(1, ch-h-1));
    const r = {x:Math.min(x, DJ_W-w-1), y:Math.min(y, DJ_H-h-1), w, h};
    r.cx = r.x + (r.w>>1); r.cy = r.y + (r.h>>1);
    carveRoom(g, r);
    rooms.push(r);
  }
  const order = shuffled(rooms);
  for(let i=1;i<order.length;i++) carveCorridor(g, {x:order[i-1].cx,y:order[i-1].cy}, {x:order[i].cx,y:order[i].cy});
  for(let k=0;k<2;k++){
    const a = rooms[rnd(rooms.length)], b = rooms[rnd(rooms.length)];
    if(a !== b) carveCorridor(g, {x:a.cx,y:a.cy}, {x:b.cx,y:b.cy});
  }

  // entrée et sortie : les deux salles les plus éloignées
  let start = rooms[0], exit = rooms[0], best = -1;
  rooms.forEach(a=>rooms.forEach(b=>{
    const d = Math.abs(a.cx-b.cx) + Math.abs(a.cy-b.cy);
    if(d > best){ best = d; start = a; exit = b; }
  }));

  // coffres dans les salles annexes
  const chests = [];
  rooms.forEach(r=>{
    if(r === start || r === exit) return;
    if(Math.random() < 0.72){
      chests.push({x:r.x + rnd(r.w), y:r.y + rnd(r.h), open:false});
    }
  });

  // une clé ouvre l'escalier : elle dort dans un coffre ou sur un gardien
  const keyInChest = chests.length && Math.random() < 0.55;
  if(keyInChest) chests[rnd(chests.length)].key = true;

  // feu de camp, autel et pièges
  const rest = [];
  const shrines = [];
  const wantFire = Math.random() < 0.5;
  rooms.forEach(r=>{
    if(r === start) return;
    if(wantFire && !rest.length && Math.random() < 0.55) rest.push({x:r.x + rnd(r.w), y:r.y + rnd(r.h), used:false});
    else if(!shrines.length && Math.random() < 0.3) shrines.push({x:r.x + rnd(r.w), y:r.y + rnd(r.h), used:false});
  });
  const traps = [];

  // gardiens : sur les chemins et aux entrées de salles
  const spots = [];
  for(let y=0;y<DJ_H;y++) for(let x=0;x<DJ_W;x++){
    if(!g[y][x]) continue;
    if(x === start.cx && y === start.cy) continue;
    const inStart = x>=start.x && x<start.x+start.w && y>=start.y && y<start.y+start.h;
    if(inStart) continue;
    const corridor = g[y][x] === 2;
    const doorway = rooms.some(r=>{
      const on = x>=r.x-1 && x<=r.x+r.w && y>=r.y-1 && y<=r.y+r.h;
      const inside = x>=r.x && x<r.x+r.w && y>=r.y && y<r.y+r.h;
      return on && !inside;
    });
    if(corridor || doorway) spots.push({x,y});
  }
  const foes = [];
  const nFoes = 8 + floor*2 + rnd(4);
  const picked = shuffled(spots);
  picked.slice(0, nFoes).forEach(p=>foes.push({x:p.x, y:p.y, card:null, dead:false}));

  // pièges dans les couloirs, à l'écart des gardiens
  const busy = new Set(foes.map(f=>f.x+","+f.y));
  picked.slice(nFoes).forEach(p=>{
    if(traps.length >= 3 + floor) return;
    if(busy.has(p.x+","+p.y)) return;
    if(g[p.y][p.x] !== 2) return;
    if(Math.random() < 0.28) traps.push({x:p.x, y:p.y, seen:false, sprung:false});
  });

  // le gardien de l'escalier : plus coriace, et porteur de la clé si aucun coffre ne l'a
  const guard = foes.reduce((best,f)=>{
    const d = Math.abs(f.x-exit.cx) + Math.abs(f.y-exit.cy);
    return (!best || d < best.d) ? {f, d} : best;
  }, null);
  if(guard){ guard.f.elite = true; if(!keyInChest) guard.f.key = true; }

  return {g, rooms, start, exit, chests, foes, traps, rest, shrines, locked:true};
}

/* ---------- adversaires ---------- */
function foePool(){
  const mine = state.collection.filter(c=>RARITIES.indexOf(c.rarity) >= 3);
  return mine.length >= 3 ? mine : state.collection;
}
const FOE_ROLES = [
  {key:"brute",  name:"Brute",     hp:1.25, atk:1.35, guard:1.0,  txt:"frappe fort"},
  {key:"rodeur", name:"Rôdeur",    hp:0.80, atk:0.85, guard:0.8,  twice:true, txt:"agit deux fois"},
  {key:"mage",   name:"Sorcier",   hp:0.75, atk:1.05, guard:0.6,  aoe:true,  txt:"frappe toute l'escouade"},
  {key:"garde",  name:"Sentinelle",hp:1.45, atk:0.9,  guard:2.2,  txt:"encaisse les coups"},
  {key:"venim",  name:"Venimeux",  hp:0.9,  atk:0.9,  guard:0.9,  dot:true,  txt:"empoisonne"}
];
function makeFoe(floor, elite){
  const pool = foePool();
  if(!pool.length) return null;
  const c = pool[rnd(pool.length)];
  const role = FOE_ROLES[rnd(FOE_ROLES.length)];
  const lvl = 1 + (floor-1)*0.35 + (elite?0.75:0);
  const boost = (1 + RARITIES.indexOf(c.rarity)*0.12) * lvl;
  const hp = Math.round((c.def/14.5) * boost * role.hp) + 100;
  return {
    id:"f"+Math.random().toString(36).slice(2,8),
    title:(elite?"⚑ ":"") + c.title, univ:c.univ, img:c.img, rarity:c.rarity, variant:c.variant,
    role, elite:!!elite,
    hp, max:hp,
    atk: Math.round(c.atk/88 * boost * role.atk) + 14,
    guard: Math.round(c.def/700 * role.guard),
    stun:0, dot:0, wind:0
  };
}

function of(u){
  const t = (u||"").trim();
  if(!t) return "ancestrale";
  return /^[AEIOUYÉÈÊÂÎÔÛ]/i.test(t) ? "d'"+t : "de "+t;
}
function short2(t){
  const s = (t||"").split(" — ")[0];
  return s.length > 16 ? s.slice(0,15)+"…" : s;
}
function hashStr(s){
  let h = 0;
  for(let i=0;i<(s||"").length;i++) h = (h*31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
/* deux cartes du même personnage ne peuvent pas partir ensemble */
function baseName(c){ return (c.title||"").split(" — ")[0].trim().toLowerCase() + "|" + (c.univ||""); }
function alreadyPicked(c){ return state.picked.some(p=>p !== c && baseName(p) === baseName(c)); }

/* chaque rôle puise dans son propre répertoire */
const ROLE_POOL = {
  soigneur: ["aura","regain","purge","barriere","ralliement","transfusion"],
  tank:     ["rempart","epines","faille","provocation","givre","choc"],
  ninja:    ["lame","salve","saignee","execution","marque","drain","enchainement"],
  magicien: ["fureur","brasier","gel","malefice","cecite","chaine","siphon","poison","detonation"]
};
const SKILL_COST = {
  frappe:0, lame:2, salve:2, choc:2, drain:2, brise:2, givre:2, fureur:3, aura:2, rempart:2,
  poison:2, brasier:2, saignee:2, gel:3, cecite:2, malefice:2, marque:1, ralliement:3,
  regain:3, barriere:2, purge:2, execution:2, chaine:3, epines:2, faille:2, siphon:3,
  provocation:2, enchainement:1, detonation:2, transfusion:2
};

function heroFrom(c){
  const h = hashStr(c.id);
  const role = roleOf(c);
  const pool = ROLE_POOL[role];
  const a = pool[h % pool.length];
  const b = pool[(h + 3 + (h % 5)) % pool.length];
  const keys = a === b ? [a, pool[(pool.indexOf(a)+1) % pool.length]] : [a, b];
  const mk = k=>{
    const base = SKILL_KINDS.find(x=>x.key === k) || SKILL_KINDS[0];
    return {...base, label:base.name(c), ready:0, cost:SKILL_COST[k] != null ? SKILL_COST[k] : 2};
  };
  const power = Math.round(c.atk/80) + 8;
  const bonus = role === "ninja" ? 1.12 : role === "tank" ? 0.88 : 1;
  return {
    id:c.id, title:c.title, univ:c.univ, img:c.img, rarity:c.rarity, variant:c.variant, stars:c.stars,
    role,
    power: Math.round(power*bonus),
    guard: Math.round(c.def/1000) + (role === "tank" ? 3 : 0),
    heal: role === "soigneur" ? 1.3 : 1,
    hex:  role === "magicien" ? 1.2 : 1,
    skills:[ {...SKILL_KINDS[0], label:SKILL_KINDS[0].name(c), ready:0, cost:0}, mk(keys[0]), mk(keys[1]) ]
  };
}

/* ---------- vue : engagement ---------- */
function viewDuel(){
  if(state.dj) return state.dj.fight ? renderFight() : renderDungeon();
  const pool = [...state.collection].sort((a,b)=>RARITIES.indexOf(b.rarity)-RARITIES.indexOf(a.rarity)||b.atk-a.atk);
  state.picked = (state.picked||[]).filter(c=>state.collection.includes(c)).slice(0,PARTY);

  view.innerHTML = `
    <h2 style="font-size:1.6rem">Donjon</h2>
    ${info("Comment ça marche ?", "<p class='sub' style='margin:0'>Engagez "+PARTY+" cartes : elles forment un deck de 25 cartes, dont 6 en main d'ouverture. Explorez le donjon salle après salle, ouvrez les coffres et gagnez la sortie. Les gardiens croisés en chemin déclenchent un combat au tour par tour : votre héros et le gardien disposent chacun de 30 points de vie, d'un pouvoir héroïque et d'une réserve de mana qui grandit chaque tour. Sortir vivant rapporte "+EXIT_GOLD+" ◆.</p>")}
    ${pool.length < PARTY
      ? `<div class="panel">Il vous faut ${PARTY} cartes distinctes pour entrer. Vous en avez ${pool.length}.
         <button class="btn small" data-go="pack" style="margin-left:.4rem">Ouvrir un paquet</button></div>`
      : `<div class="actions">
          <button class="btn wide" id="enter" ${state.picked.length===PARTY?"":"disabled"}>Entrer dans le donjon</button>
          <div class="row">
            <button class="btn ghost" id="openpick">${state.pickOpen? "Masquer les cartes":"Choisir mes cartes"}</button>
            <button class="btn ghost" id="auto">Escouade au mieux</button>
            <button class="btn ghost" id="clear">Tout retirer</button>
          </div>
          <div class="powpick">
            <span class="sub">Pouvoir héroïque :</span>
            ${POWERS.map(p=>`<button class="powbtn ${(state.profile.power||"feu")===p.key?"on":""}" data-pow="${p.key}"
               title="${esc(p.txt)}"><span>${p.icon}</span><small>${esc(p.name)}</small></button>`).join("")}
          </div>
          ${decks("bataille").filter(deckFull).length? `<div class="row">
            <span class="sub">Vos decks :</span>
            ${decks("bataille").filter(deckFull).map(dk=>`<button class="btn ghost small" data-deck="${esc(dk.id)}">${esc(dk.glyph)} ${esc(dk.name)}</button>`).join("")}
          </div>`:""}
          <span class="sub" id="pick">${state.picked.length} / ${PARTY} engagées</span>
        </div>
        ${state.picked.length? `<div class="grid" style="grid-template-columns:repeat(5,1fr);max-width:520px;margin-bottom:1rem">
          ${state.picked.map(c=>cardHTML(c,{compact:true})).join("")}</div>`:""}
        ${state.pickOpen? `<input id="dq" placeholder="Rechercher une carte…" value="${esc(state.dq||"")}" style="margin-bottom:.7rem">`:""}
        <div id="deckgrid"></div>`}`;

  view.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  if(pool.length < PARTY) return;

  view.querySelector("#openpick").onclick = ()=>{ state.pickOpen = !state.pickOpen; sfx.tick(); viewDuel(); };
  view.querySelector("#clear").onclick = ()=>{ state.picked = []; viewDuel(); };
  view.querySelector("#auto").onclick = ()=>{
    const out = [];
    const seen = new Set();
    for(const c of pool){
      if(out.length >= PARTY) break;
      const k = baseName(c);
      if(seen.has(k)) continue;
      seen.add(k);
      out.push(c);
    }
    state.picked = out;
    sfx.tick(); viewDuel();
  };
  view.querySelectorAll("[data-pow]").forEach(b=>b.onclick = async ()=>{
    state.profile.power = b.dataset.pow;
    sfx.tick();
    await sset("fm:profile", state.profile);
    viewDuel();
  });
  view.querySelectorAll("[data-deck]").forEach(b=>b.onclick = ()=>{
    const dk = decks().find(x=>x.id === b.dataset.deck);
    const seen = new Set();
    state.picked = deckCards(dk).filter(c=>{
      const k = baseName(c);
      if(seen.has(k)) return false;
      seen.add(k); return true;
    }).slice(0, PARTY);
    sfx.tick();
    viewDuel();
  });
  view.querySelector("#enter").onclick = ()=>enterDungeon();
  const dq = view.querySelector("#dq");
  if(dq) dq.oninput = ()=>{ state.dq = dq.value; renderDeckGrid(); };
  renderDeckGrid();
}

function renderDeckGrid(){
  const box = view.querySelector("#deckgrid");
  if(!box) return;
  if(!state.pickOpen){ box.innerHTML = ""; return; }
  const q = (state.dq||"").trim().toLowerCase();
  const list = state.collection
    .filter(c=>!q || (c.title+" "+c.univ).toLowerCase().includes(q))
    .sort((a,b)=>RARITIES.indexOf(b.rarity)-RARITIES.indexOf(a.rarity)||a.title.localeCompare(b.title));
  box.innerHTML = `<div class="grid">${list.slice(0,120).map(c=>{
    const on = state.picked.includes(c);
    const dup = !on && alreadyPicked(c);
    return `<div class="pickwrap ${on?"on":""} ${dup?"off":""}" data-id="${esc(c.id)}">${cardHTML(c,{compact:true})}</div>`;
  }).join("")}</div>`;
  box.querySelectorAll(".pickwrap").forEach(el=>el.onclick = ()=>{
    const c = state.collection.find(x=>x.id === el.dataset.id);
    const i = state.picked.indexOf(c);
    if(i>=0) state.picked.splice(i,1);
    else if(alreadyPicked(c)) return toast("Déjà dans l'escouade", short2(c.title)+" ne peut y figurer qu'une fois", "info");
    else if(state.picked.length < PARTY) state.picked.push(c);
    else return toast("Escouade complète", PARTY+" cartes au maximum", "info");
    sfx.tick();
    viewDuel();
  });
}

/* ---------- entrée dans le donjon ---------- */
function enterDungeon(){
  const party = state.picked.map(heroFrom);
  const maxhp = HERO_HP;
  state.dj = {
    party, hp:maxhp, maxhp, floor:1,
    gold:0, chestsOpen:0, kills:0, turns:0, keys:0, boon:0,
    potions:{heal:POTION_CAP.heal, dmg:POTION_CAP.dmg},
    fight:null
  };
  loadFloor(1);
  sfx.trumpet();
  logEvent("Entrée dans le donjon", "info");
  renderDungeon();
}

function loadFloor(n){
  const d = state.dj;
  const g = genDungeon(n);
  g.foes.forEach(f=>f.card = makeFoe(n, f.elite));
  d.deepest = Math.max(d.deepest||1, n);
  Object.assign(d, g, {
    floor:n,
    pos:{x:g.start.cx, y:g.start.cy},
    seen:new Set(),
    hasKey:false
  });
  reveal();
}
function reveal(){
  const d = state.dj;
  for(let y=d.pos.y-VIEW_R; y<=d.pos.y+VIEW_R; y++)
    for(let x=d.pos.x-VIEW_R; x<=d.pos.x+VIEW_R; x++){
      if(x<0||y<0||x>=DJ_W||y>=DJ_H) continue;
      if(Math.abs(x-d.pos.x) + Math.abs(y-d.pos.y) <= VIEW_R+1) d.seen.add(x+","+y);
    }
}

const ICON_FIRE = `<svg class="m fire" viewBox="0 0 24 24"><path d="M12 2c3 5-2 6-2 9a2 2 0 0 0 4 0c0-1 1-2 1-2 3 3 4 5 4 8a7 7 0 0 1-14 0c0-6 6-9 7-15z" fill="#E8894C"/><path d="M12 12c1.6 2 2.4 3 2.4 4.6a2.4 2.4 0 0 1-4.8 0c0-1.6.8-2.6 2.4-4.6z" fill="#FFD36A"/></svg>`;
const ICON_SHRINE = `<svg class="m shrine" viewBox="0 0 24 24"><path d="M6 20h12l-2-9H8z" fill="#7A6A9A"/><circle cx="12" cy="7" r="3.4" fill="#C9A2E8"/><path d="M12 2v2M9 4l1 1M15 4l-1 1" stroke="#E8D8FF" stroke-width="1.4"/></svg>`;
const ICON_ELITE = `<svg class="m foe elite" viewBox="0 0 24 24"><path d="M12 2c5 0 8 3.4 8 8 0 3-1.6 4.6-1.6 6.4V19H5.6v-2.6C5.6 14.6 4 13 4 10c0-4.6 3-8 8-8z" fill="#E8B44C"/><circle cx="9" cy="10" r="2" fill="#2A1A08"/><circle cx="15" cy="10" r="2" fill="#2A1A08"/><path d="M10.4 15h3.2l-1.6 3z" fill="#2A1A08"/><path d="M4 4l2 3M20 4l-2 3" stroke="#FFE39A" stroke-width="1.6"/></svg>`;
const ICON_YOU = `<svg class="m you" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6" fill="#2A1E08"/><path d="M5.5 20c0-3.6 3-6.4 6.5-6.4s6.5 2.8 6.5 6.4z" fill="#2A1E08"/></svg>`;

/* ---------- carte du donjon ---------- */
function renderDungeon(){
  const d = state.dj;
  const small = window.innerWidth < 760;
  const x0 = small ? Math.max(0, Math.min(DJ_W-CAM_W, d.pos.x - (CAM_W>>1))) : 0;
  const y0 = small ? Math.max(0, Math.min(DJ_H-CAM_H, d.pos.y - (CAM_H>>1))) : 0;
  const cw = small ? CAM_W : DJ_W, chh = small ? CAM_H : DJ_H;

  const cells = [];
  for(let yy=0; yy<chh; yy++) for(let xx=0; xx<cw; xx++){
    const x = x0+xx, y = y0+yy;
    const k = x+","+y;
    const seen = d.seen.has(k);
    const floor = d.g[y][x] > 0;
    const here = d.pos.x===x && d.pos.y===y;
    const foe = d.foes.find(f=>!f.dead && f.x===x && f.y===y);
    const chest = d.chests.find(c=>c.x===x && c.y===y);
    const fire = d.rest.find(r=>r.x===x && r.y===y);
    const shr = d.shrines.find(r=>r.x===x && r.y===y);
    const trapAny = d.traps.find(t=>t.x===x && t.y===y);
    const trap = trapAny && trapAny.sprung ? trapAny : null;
    const lurking = trapAny && !trapAny.sprung;
    const isExit = d.exit.cx===x && d.exit.cy===y;
    const near = Math.abs(x-d.pos.x) + Math.abs(y-d.pos.y) === 1 && floor;
    const doorway = floor && d.g[y][x] === 2 && d.rooms.some(r=>
      x>=r.x-1 && x<=r.x+r.w && y>=r.y-1 && y<=r.y+r.h &&
      !(x>=r.x && x<r.x+r.w && y>=r.y && y<r.y+r.h));
    let cls = floor ? (doorway ? "door" : (d.g[y][x]===2 ? "cor" : "room")) : "wall";
    if(!seen) cls += " dark";
    if(floor) cls += " v" + ((x*7 + y*13) % 4);
    if(lurking && seen) cls += " rigged";
    if(!floor && y+1 < DJ_H && d.g[y+1][x] > 0 && d.seen.has(x+","+(y+1))) cls += " face";
    let mark = "";
    if(seen){
      if(isExit) mark = d.hasKey ? ICON_EXIT : ICON_LOCK;
      if(trap) mark = ICON_TRAP;
      if(fire && !fire.used) mark = ICON_FIRE;
      if(shr && !shr.used) mark = ICON_SHRINE;
      if(chest) mark = chest.open ? ICON_CHEST_OPEN : ICON_CHEST;
      if(foe) mark = foe.elite ? ICON_ELITE : ICON_FOE;
    }
    if(here) mark = ICON_YOU;
    if(seen){
      if(isExit) cls += " tok tok-exit";
      if(chest && !chest.open) cls += " tok tok-chest";
      if(foe) cls += foe.elite ? " tok tok-elite" : " tok tok-foe";
    }
    if(here) cls += " tok tok-you";
    cells.push(`<div class="dc ${cls} ${near?"near":""}" ${near?`data-go="${x},${y}"`:""}>${mark}</div>`);
  }

  const pots = d.potions;
  view.innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <h2 style="font-size:1.3rem">Donjon · étage ${d.floor} / ${FLOORS}</h2>
      <span class="sub">${d.gold} ◆ · ${d.kills} vaincu(s)</span>
    </div>
    <div class="hpwrap">
      <div class="row" style="justify-content:space-between">
        <span>Escouade ${d.hasKey?'<span class="keytag">clé</span>':""}${d.boon?` <span class="keytag boon">bénédiction ×${d.boon}</span>`:""}</span>
        <b>${Math.max(0,d.hp)} / ${d.maxhp} HP</b>
      </div>
      <div class="hpbar" id="hp-me"><i style="width:${Math.max(0,d.hp)/d.maxhp*100}%"></i><span class="embers"></span></div>
      <div class="sub" style="font-size:.78rem;margin-top:.2rem">Flacons restants — soin ${pots.heal} / ${POTION_CAP.heal} · dégâts ${pots.dmg} / ${POTION_CAP.dmg}</div>
    </div>
    <div class="isowrap" id="iso"><div class="djgrid" style="grid-template-columns:repeat(${cw},1fr)">${cells.join("")}</div></div>

    <div class="dpad">
      <button class="dk up" data-dir="0,-1">▲</button>
      <button class="dk left" data-dir="-1,0">◀</button>
      <button class="dk right" data-dir="1,0">▶</button>
      <button class="dk down" data-dir="0,1">▼</button>
    </div>

    <div class="grid" style="grid-template-columns:repeat(5,1fr);max-width:520px;margin:.6rem auto 0">
      ${d.party.map(h=>heroTile(h)).join("")}
    </div>
    <div class="row" style="justify-content:center;margin-top:.8rem">
      <button class="btn ghost" id="flee">Abandonner le donjon</button>
    </div>`;

  view.querySelectorAll("[data-go]").forEach(el=>el.onclick = ()=>{
    const [x,y] = el.dataset.go.split(",").map(Number);
    step(x,y);
  });
  view.querySelectorAll("[data-dir]").forEach(el=>el.onclick = ()=>{
    const [dx,dy] = el.dataset.dir.split(",").map(Number);
    moveBy(dx,dy);
  });
  view.querySelector("#flee").onclick = ()=>endDungeon(false, "Vous rebroussez chemin", true);
  paintHp();
}

function moveBy(dx, dy){
  const d = state.dj;
  if(!d || d.fight) return;
  const x = d.pos.x + dx, y = d.pos.y + dy;
  if(x<0||y<0||x>=DJ_W||y>=DJ_H || !d.g[y][x]) return;
  step(x,y);
}

function heroTile(h){
  return `<div class="hero">
    <div class="ha" ${h.img?`style="background-image:url('${esc(h.img)}')"`:""}></div>
    <div class="hn">${esc(short2(h.title))}</div>
    <div class="hs">${h.power} ATQ</div>
  </div>`;
}

function step(x, y){
  const d = state.dj;
  if(!d || d.fight) return;
  d.pos = {x,y};
  d.turns++;
  reveal();

  const foe = d.foes.find(f=>!f.dead && f.x===x && f.y===y);
  if(foe) return startFight(foe);

  // piège
  const trap = d.traps.find(t=>t.x===x && t.y===y && !t.sprung);
  if(trap){
    trap.sprung = true;
    const dmg = 40 + rnd(40) + d.floor*15;
    d.hp -= dmg;
    sfx.hurt();
    flashScreen("hurt");
    toast("Piège !", `${dmg} points de vie perdus`, "lose");
    if(d.hp <= 0) return endDungeon(false, "Un piège a eu raison de l'escouade");
  }

  // coffre
  const chest = d.chests.find(c=>c.x===x && c.y===y && !c.open);
  if(chest){
    chest.open = true;
    // butin volontairement maigre : souvent une poignée de pièces
    const gain = Math.round(4 + Math.pow(Math.random(), 2.8) * 26);
    d.gold += gain;
    d.chestsOpen++;
    sfx.coin();
    if(chest.key){
      d.hasKey = true;
      toast("Clé de l'escalier", `${gain} ◆ et la voie s'ouvre`, "gold");
    } else toast("Coffre ouvert", `${gain} Fandominus`, "gold");
  }

  // feu de camp
  const fire = d.rest.find(r=>r.x===x && r.y===y && !r.used);
  if(fire){
    fire.used = true;
    const heal = Math.round(d.maxhp*0.28);
    d.hp = Math.min(d.maxhp, d.hp + heal);
    sfx.ach();
    toast("Feu de camp", `L'escouade récupère ${heal} HP`, "win");
  }

  // autel : bénédiction ou malédiction
  const shrine = d.shrines.find(r=>r.x===x && r.y===y && !r.used);
  if(shrine){
    shrine.used = true;
    if(Math.random() < 0.65){
      d.boon++;
      d.party.forEach(h=>h.power = Math.round(h.power*1.15));
      sfx.epic();
      toast("Autel oublié", "Vos cartes frappent 15 % plus fort", "ach");
    } else {
      const dmg = Math.round(d.maxhp*0.12);
      d.hp -= dmg;
      sfx.hurt();
      toast("Autel maudit", `${dmg} points de vie arrachés`, "lose");
      if(d.hp <= 0) return endDungeon(false, "L'autel a bu votre sang");
    }
  }

  // escalier
  if(x === d.exit.cx && y === d.exit.cy){
    if(!d.hasKey){
      toast("Escalier verrouillé", "Trouvez la clé de cet étage", "info");
    } else if(d.floor < FLOORS){
      d.gold += 8;
      sfx.trumpet();
      toast(`Étage ${d.floor} franchi`, `Descente vers l'étage ${d.floor+1}`, "win");
      loadFloor(d.floor + 1);
      return renderDungeon();
    } else {
      return endDungeon(true);
    }
  }

  sfx.tick();
  renderDungeon();
}

/* flèches du clavier */
document.addEventListener("keydown", e=>{
  if(state.view !== "duel" || !state.dj || state.dj.fight) return;
  const map = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0]};
  const m = map[e.key];
  if(!m) return;
  const d = state.dj;
  const x = d.pos.x + m[0], y = d.pos.y + m[1];
  if(x<0||y<0||x>=DJ_W||y>=DJ_H || !d.g[y][x]) return;
  e.preventDefault();
  step(x,y);
});

/* ---------- combat ---------- */
function startFight(spot){
  const d = state.dj;
  const foes = [spot.card];
  const extras = spot.elite ? 1 + rnd(2) : (Math.random() < 0.5 ? 1 : 0);
  for(let k=0;k<extras;k++){ const e = makeFoe(d.floor, false); if(e) foes.push(e); }
  d.fight = {spot, foes, turn:0, order:[], idx:0, log:[], shield:0};
  d.party.forEach(h=>h.skills.forEach(s=>s.ready = 0));
  buildOrder();
  sfx.cannon();
  renderFight();
}
function buildOrder(){
  const f = state.dj.fight;
  f.order = [
    ...state.dj.party.map((h,i)=>({side:"hero", i})),
    ...f.foes.map((x,i)=>({side:"foe", i}))
  ];
  f.idx = 0;
}
function currentActor(){
  const f = state.dj.fight;
  return f.order[f.idx % f.order.length];
}

function renderFight(){
  const d = state.dj, f = d.fight;
  const act = currentActor();
  const hero = act.side === "hero" ? d.party[act.i] : null;

  view.innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <h2 style="font-size:1.4rem">Combat</h2>
      <span class="sub">Tour ${f.turn+1} · ${f.foes.filter(x=>x.hp>0).length} gardien(s) debout</span>
    </div>
    <div class="hpwrap">
      <div class="row" style="justify-content:space-between">
        <span>Escouade ${[
          f.shield?`<span class="st shield">garde ${f.shield}</span>`:"",
          f.barrier?`<span class="st shield">barrière ${f.barrier}</span>`:"",
          f.regen&&f.regen.turns?`<span class="st heal">régénération ${f.regen.turns}</span>`:"",
          f.thorns?`<span class="st shield">épines ${f.thorns}</span>`:"",
          f.rally?`<span class="st vuln">ralliement</span>`:"",
          f.venom?`<span class="st dot">venin ${f.venom}</span>`:""
        ].filter(Boolean).join("")}</span>
        <b>${Math.max(0,d.hp)} / ${d.maxhp} HP</b></div>
      <div class="hpbar" id="hp-me"><i style="width:${Math.max(0,d.hp)/d.maxhp*100}%"></i><span class="embers"></span></div>
    </div>

    <div class="foes">
      ${f.foes.map((x,i)=>`<div class="foecard ${x.hp<=0?"down":""}" data-foe="${i}">
        <div class="fa" ${x.img?`style="background-image:url('${esc(x.img)}')"`:""}></div>
        <div class="fn">${esc(short2(x.title))}</div>
        <div class="fu">${esc((x.role&&x.role.name)||"")} · ${esc(x.univ||"")}</div>
        <div class="fbar"><i style="width:${Math.max(0,x.hp)/x.max*100}%"></i></div>
        <div class="fh">${Math.max(0,x.hp)} HP</div>
        <div class="fst">${[
          x.stun?`<span class="st stun">figé ${x.stun}</span>`:"",
          x.dot?`<span class="st dot">plaie</span>`:"",
          x.burn?`<span class="st burn">feu ${x.burn}</span>`:"",
          x.bleed?`<span class="st burn">saigne ${x.bleed}</span>`:"",
          x.vuln?`<span class="st vuln">vulnérable</span>`:"",
          x.blind?`<span class="st stun">aveuglé</span>`:"",
          x.mark?`<span class="st vuln">marqué</span>`:"",
          x.weak?`<span class="st weak">affaibli</span>`:"",
          x.broken?`<span class="st weak">sans armure</span>`:""
        ].filter(Boolean).join("")}</div>
      </div>`).join("")}
    </div>

    <div class="grid" style="grid-template-columns:repeat(5,1fr);max-width:520px;margin:.8rem auto 0">
      ${d.party.map((h,i)=>`<div class="hero ${act.side==="hero"&&act.i===i?"active":""}">
        <div class="ha" ${h.img?`style="background-image:url('${esc(h.img)}')"`:""}></div>
        <div class="hn">${esc(short2(h.title))}</div>
        <div class="hs">${h.power} ATQ</div>
      </div>`).join("")}
    </div>

    <div class="panel" style="margin-top:.8rem">
      ${hero ? `<div class="sub" style="margin-bottom:.4rem">Au tour de <b style="color:var(--brass)">${esc(short2(hero.title))}</b> — choisissez une action</div>
        <div class="skills">
          ${hero.skills.map((s,si)=>{
            const kind = s.heal?"heal":s.shield?"shield":s.aoe?"aoe":s.dot?"dot":s.stun?"stun"
              :s.drain?"drain":s.hits?"salve":s.pierce?"pierce":s.weaken?"weak":"dmg";
            const power = s.mult? Math.round(hero.power*s.mult)*(s.hits||1) : null;
            return `<button class="skill k-${kind}" data-sk="${si}" ${s.ready>0?"disabled":""}>
              <b>${esc(s.label)}</b>
              <small>${power?`<b class="v">${power} dégâts</b> · `:""}${esc(s.txt)}${s.ready>0?` · <b class="cd">prêt dans ${s.ready}</b>`:s.cd?` · repos ${s.cd} tours`:""}</small>
            </button>`;
          }).join("")}
        </div>`
      : `<div class="sub"><span class="spinner"></span> l'adversaire prépare son coup…</div>`}
      <div class="battlebar" id="bbar">${(state.profile.hotbar||[]).map((k,i)=>{
        const n = k ? countItem(k) : 0;
        const fam = k ? item(k).fam : null;
        const left = fam && fam !== "arm" ? d.potions[fam] : 0;
        const ok = k && n && left > 0;
        return `<div class="hslot ${ok?"full":"off"}" ${ok?`data-use="${k}"`:""}>${
          k&&n ? itemTile(k, n) : `<span class="num">${i+1}</span>`}</div>`;
      }).join("")}</div>
      <div class="row" style="margin-top:.5rem">
        <button class="btn ghost small" id="flee2">Tenter de fuir</button>
        <span class="sub" style="font-size:.78rem">La fuite coûte des points de vie et n'aboutit pas toujours.</span>
      </div>
      <div class="fightlog">${f.log.slice(-4).map(l=>`<div class="ll">${l}</div>`).join("")}</div>
    </div>`;

  view.querySelectorAll("[data-use]").forEach(el=>el.onclick=()=>useInBattle(el.dataset.use));
  view.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>pickSkill(+b.dataset.sk));
  const fl = view.querySelector("#flee2");
  if(fl) fl.onclick = ()=>tryFlee();
  paintHp();
  playFx();
  if(act.side === "foe") setTimeout(foeTurn, 780);
}

function pickSkill(si){
  const d = state.dj, f = d.fight;
  const act = currentActor();
  if(act.side !== "hero") return;
  const hero = d.party[act.i];
  const sk = hero.skills[si];
  if(sk.ready > 0) return;
  const alive = f.foes.map((x,i)=>({x,i})).filter(o=>o.x.hp > 0);
  if(!alive.length) return;
  if(sk.heal || sk.shield || sk.aoe || sk.rally || sk.regen || sk.barrier || sk.cleanse
     || sk.thorns || sk.chain || sk.siphon) return useSkill(hero, sk, null);
  if(alive.length === 1) return useSkill(hero, sk, alive[0].i);
  // choix de la cible
  f.pending = {hero, sk};
  view.querySelectorAll("[data-foe]").forEach(el=>{
    const i = +el.dataset.foe;
    if(f.foes[i].hp <= 0) return;
    el.classList.add("targetable");
    el.onclick = ()=>useSkill(hero, sk, i);
  });
  const p = view.querySelector(".panel .sub");
  if(p) p.innerHTML = `Choisissez la cible de <b style="color:var(--brass)">${esc(sk.label)}</b>`;
}

function useSkill(hero, sk, target){
  const d = state.dj, f = d.fight;
  f.pending = null;
  if(sk.cd) sk.ready = sk.cd;

  if(sk.heal){
    const gain = Math.round(hero.power * 2.2) + 20;
    d.hp = Math.min(d.maxhp, d.hp + gain);
    f.log.push(`<b class="who">${esc(short2(hero.title))}</b> lance <b class="sk">${esc(sk.label)}</b> — <b class="heal">+${gain} HP</b>`);
    fx(".hpwrap", gain, "heal");
    flashScreen("heal");
    sfx.ach();
  } else if(sk.shield){
    f.shield = Math.round(hero.guard*2) + 6;
    f.log.push(`<b class="who">${esc(short2(hero.title))}</b> dresse <b class="sk">${esc(sk.label)}</b> — <b class="shield">−${f.shield} aux coups reçus</b>`);
    flashScreen("shield");
    sfx.ach();
  } else if(sk.aoe){
    f.foes.forEach(x=>{ if(x.hp>0) hitFoe(x, Math.round(hero.power*sk.mult)); });
    f.log.push(`<b class="who">${esc(short2(hero.title))}</b> déchaîne <b class="sk">${esc(sk.label)}</b> — <b class="aoe">frappe tous les gardiens</b>`);
    flashScreen("aoe");
    sfx.cannon();
  } else if(sk.rally){
    f.rally = (f.rally||0) + 1;
    d.party.forEach(h=>h.power = Math.round(h.power*1.18));
    f.log.push(`<b class="who">${esc(short2(hero.title))}</b> lance <b class="sk">${esc(sk.label)}</b> — <b class="aoe">l'escouade frappe plus fort</b>`);
    flashScreen("aoe"); sfx.trumpet();
  } else if(sk.regen){
    f.regen = {turns:sk.regen, amount:Math.round(hero.power*0.9) + 12};
    f.log.push(`<b class="who">${esc(short2(hero.title))}</b> souffle <b class="sk">${esc(sk.label)}</b> — <b class="heal">régénération ${sk.regen} tours</b>`);
    flashScreen("heal"); sfx.ach();
  } else if(sk.barrier){
    f.barrier = (f.barrier||0) + Math.round(hero.guard*6) + 60;
    f.log.push(`<b class="who">${esc(short2(hero.title))}</b> dresse <b class="sk">${esc(sk.label)}</b> — <b class="shield">${f.barrier} points absorbés</b>`);
    flashScreen("shield"); sfx.ach();
  } else if(sk.cleanse){
    const gain = Math.round(hero.power*1.2) + 15;
    f.venom = 0;
    d.hp = Math.min(d.maxhp, d.hp + gain);
    fx(".hpwrap", gain, "heal");
    f.log.push(`<b class="who">${esc(short2(hero.title))}</b> — <b class="sk">${esc(sk.label)}</b> : <b class="heal">venin dissipé, +${gain} HP</b>`);
    flashScreen("heal"); sfx.ach();
  } else if(sk.thorns){
    f.thorns = sk.thorns + 1;
    f.log.push(`<b class="who">${esc(short2(hero.title))}</b> hérisse <b class="sk">${esc(sk.label)}</b> — <b class="shield">les coups seront renvoyés</b>`);
    flashScreen("shield"); sfx.ach();
  } else if(sk.chain){
    const alive = f.foes.filter(z=>z.hp > 0);
    let m = 1, tot = 0;
    alive.forEach(z=>{ tot += hitFoe(z, Math.round(hero.power*sk.mult*m)).real; m *= 0.65; });
    f.log.push(`<b class="who">${esc(short2(hero.title))}</b> — <b class="sk">${esc(sk.label)}</b> rebondit : <b class="dmg">${tot} dégâts</b>`);
    flashScreen("aoe"); sfx.cannon();
  } else if(sk.siphon){
    let tot = 0;
    f.foes.forEach(z=>{ if(z.hp > 0) tot += hitFoe(z, Math.round(hero.power*sk.mult)).real; });
    const back = Math.round(tot*0.25);
    d.hp = Math.min(d.maxhp, d.hp + back);
    fx(".hpwrap", back, "heal");
    f.log.push(`<b class="who">${esc(short2(hero.title))}</b> — <b class="sk">${esc(sk.label)}</b> : <b class="dmg">${tot} dégâts</b> et <b class="heal">+${back} HP</b>`);
    flashScreen("aoe"); sfx.cannon();
  } else if(sk.burn || sk.bleed || sk.freeze || sk.blind || sk.vuln || sk.mark || sk.execute || sk.stagger){
    const x = f.foes[target];
    let base = Math.round(hero.power * sk.mult);
    let note = "";
    if(sk.execute && x.hp < x.max*0.35){ base = Math.round(base*1.8); note = ` · <b class="crit">achèvement</b>`; }
    if(sk.stagger){ x.guard = 0; x.broken = true; note = ` · <b class="aoe">armure brisée</b>`; }
    const r = base > 0 ? hitFoe(x, base, {pierce:!!sk.burn}) : {real:0, crit:false};
    if(sk.burn){ x.burn = sk.burn; note += ` · <b class="dot">embrasée</b>`; }
    if(sk.bleed){ x.bleed = sk.bleed; note += ` · <b class="dot">hémorragie</b>`; }
    if(sk.freeze){ x.stun = Math.max(x.stun||0, sk.freeze); note += ` · <b class="stun">figée ${sk.freeze} tours</b>`; }
    if(sk.blind){ x.blind = sk.blind; note += ` · <b class="stun">aveuglée</b>`; }
    if(sk.vuln){ x.vuln = sk.vuln; note += ` · <b class="crit">vulnérable</b>`; }
    if(sk.mark){ x.mark = true; note += ` · <b class="crit">marquée</b>`; }
    f.log.push(`<b class="who">${esc(short2(hero.title))}</b> — <b class="sk">${esc(sk.label)}</b> : <b class="dmg">${r.real} dégâts</b>${note}`);
    sfx.cannon();
  } else if(sk.hits){
    const x = f.foes[target];
    let tot = 0;
    for(let k=0;k<sk.hits;k++){
      if(x.hp <= 0) break;
      tot += hitFoe(x, Math.round(hero.power*sk.mult)).real;
    }
    f.log.push(`<b class="who">${esc(short2(hero.title))}</b> enchaîne <b class="sk">${esc(sk.label)}</b> — <b class="dmg">${tot} dégâts</b> en ${sk.hits} coups`);
    sfx.cannon();
  } else if(sk.drain){
    const x = f.foes[target];
    const r = hitFoe(x, Math.round(hero.power*sk.mult));
    const back = Math.round(r.real/2);
    d.hp = Math.min(d.maxhp, d.hp + back);
    fx(".hpwrap", back, "heal");
    f.log.push(`<b class="who">${esc(short2(hero.title))}</b> — <b class="sk">${esc(sk.label)}</b> : <b class="dmg">${r.real} dégâts</b> et <b class="heal">+${back} HP</b>`);
    sfx.cannon();
  } else if(sk.weaken){
    const x = f.foes[target];
    const r = hitFoe(x, Math.round(hero.power*sk.mult));
    x.atk = Math.round(x.atk * 0.72);
    x.weak = true;
    f.log.push(`<b class="who">${esc(short2(hero.title))}</b> — <b class="sk">${esc(sk.label)}</b> : <b class="dmg">${r.real} dégâts</b> · <b class="stun">frappe affaiblie</b>`);
    sfx.cannon();
  } else {
    const x = f.foes[target];
    const base = Math.round(hero.power * sk.mult);
    const r = hitFoe(x, base, {pierce:!!sk.pierce});
    if(sk.stun) x.stun = 1;
    if(sk.dot) x.dot = 3;
    f.log.push(`${r.crit?`<b class="crit">Critique !</b> `:""}<b class="who">${esc(short2(hero.title))}</b> — <b class="sk">${esc(sk.label)}</b> : <b class="dmg">${r.real} dégâts</b>${sk.pierce?` · <b class="aoe">armure ignorée</b>`:""}${sk.stun?` · <b class="stun">étourdie</b>`:""}${sk.dot?` · <b class="dot">plaie</b>`:""}`);
    sfx.cannon();
  }
  nextTurn();
}
function hitFoe(x, dmg, opts){
  opts = opts || {};
  const crit = opts.crit !== false ? Math.random() < 0.12 : false;
  const armor = opts.pierce ? 0 : (x.guard||0);
  let mult = crit ? 1.7 : 1;
  if(x.vuln > 0) mult *= 1.3;
  if(x.mark){ mult *= 2; x.mark = false; }
  const real = Math.max(1, Math.round(dmg * mult) - armor);
  x.hp -= real;
  if(x.hp <= 0) x.hp = 0;
  const i = state.dj.fight.foes.indexOf(x);
  fx(`[data-foe="${i}"]`, real, crit ? "crit" : "dmg");
  if(crit) sfx.epic();
  return {real, crit};
}

/* les effets visuels attendent le prochain rendu pour ne pas être effacés */
function fx(sel, n, kind){
  const f = state.dj && state.dj.fight;
  if(!f) return;
  (f.fx = f.fx || []).push({sel, n, kind});
}
function playFx(){
  const f = state.dj && state.dj.fight;
  if(!f || !f.fx || !f.fx.length) return;
  const q = f.fx.slice();
  f.fx = [];
  q.forEach((e,i)=>setTimeout(()=>{
    popDamage(e.sel, e.n, e.kind);
    if(e.kind !== "heal") shake(e.sel);
  }, i*90));
}

/* chiffre qui jaillit au-dessus de la cible */
function popDamage(sel, n, kind){
  const el = view.querySelector(sel);
  if(!el) return;
  const p = document.createElement("span");
  p.className = "dmgpop " + (kind||"dmg");
  p.textContent = (kind === "heal" ? "+" : "−") + n + (kind === "crit" ? " !" : "");
  p.style.left = (18 + Math.random()*54) + "%";
  el.appendChild(p);
  setTimeout(()=>p.remove(), 950);
}
function shake(sel){
  const el = view.querySelector(sel);
  if(!el) return;
  el.classList.remove("hitshake"); void el.offsetWidth; el.classList.add("hitshake");
}
function flashScreen(kind){
  const f = document.createElement("div");
  f.className = "flash " + (kind||"");
  document.body.appendChild(f);
  setTimeout(()=>f.remove(), 420);
}

function foeStrike(x, mult, label){
  const d = state.dj, f = d.fight;
  if(x.blind > 0 && Math.random() < 0.5){
    f.log.push(`<b class="foe">${esc(short2(x.title))}</b> frappe dans le vide — <b class="stun">aveuglée</b>`);
    return;
  }
  const crit = Math.random() < 0.1;
  let dmg = Math.max(2, Math.round(x.atk * mult * (crit?1.6:1)) - f.shield);
  if(f.barrier > 0){
    const absorbed = Math.min(f.barrier, dmg);
    f.barrier -= absorbed;
    dmg -= absorbed;
    if(absorbed) f.log.push(`<b class="shield">Barrière</b> absorbe ${absorbed} points`);
    if(dmg <= 0) return;
  }
  if(f.thorns > 0){
    const back = Math.round(dmg*0.5);
    hitFoe(x, back, {crit:false});
    f.log.push(`<b class="shield">Épines</b> renvoient <b class="dmg">${back}</b> à ${esc(short2(x.title))}`);
  }
  d.hp -= dmg;
  f.log.push(`${crit?`<b class="crit">Écrasant !</b> `:""}<b class="foe">${esc(short2(x.title))}</b> — <span class="sk">${esc(label)}</span> : <b class="dmg">${dmg} dégâts</b>`);
  sfx.hurt();
  hitSpray("hp-me");
  fx(".hpwrap", dmg, "dmg");
  flashScreen("hurt");
}

function foeTurn(){
  const d = state.dj, f = d.fight;
  if(!f) return;
  const act = currentActor();
  if(act.side !== "foe") return;
  const x = f.foes[act.i];
  if(!x || x.hp <= 0) return nextTurn();
  if(x.stun > 0){
    x.stun--;
    f.log.push(`<b class="foe">${esc(short2(x.title))}</b> est <b class="stun">étourdi</b> et passe son tour`);
    return nextTurn();
  }

  // coup chargé annoncé au tour précédent
  if(x.wind > 0){
    x.wind = 0;
    foeStrike(x, 2.1, "coup chargé");
    return nextTurn();
  }

  const r = x.role || FOE_ROLES[0];
  const roll = Math.random();

  if(r.key === "brute" && roll < 0.3){
    x.wind = 1;
    f.log.push(`<b class="foe">${esc(short2(x.title))}</b> <b class="wind">prend son élan…</b>`);
  } else if(r.aoe && roll < 0.45){
    foeStrike(x, 1.15, "déferlante");
    f.party_hit = true;
  } else if(r.dot && roll < 0.4){
    foeStrike(x, 0.7, "crachat de venin");
    f.venom = (f.venom||0) + 2;
    f.log.push(`<b class="dot">Venin</b> — l'escouade est empoisonnée pour 2 tours`);
  } else if(r.twice){
    foeStrike(x, 0.62, "attaque rapide");
    if(d.hp > 0) foeStrike(x, 0.62, "seconde lame");
  } else {
    foeStrike(x, 1, "assaut");
  }
  nextTurn();
}

function nextTurn(){
  const d = state.dj, f = d.fight;
  // venin sur l'escouade
  if(f.venom > 0 && f.idx % f.order.length === f.order.length-1){
    f.venom--;
    const bleed = 14 + rnd(12) + d.floor*4;
    d.hp -= bleed;
    fx(".hpwrap", bleed, "dot");
    f.log.push(`<b class="dot">Venin</b> — l'escouade perd <b class="dmg">${bleed}</b> points`);
  }
  // plaies, brasiers, hémorragies
  f.foes.forEach(x=>{
    if(x.hp <= 0) return;
    const i = f.foes.indexOf(x);
    if(x.dot > 0){
      x.dot--;
      const n = 12 + rnd(10);
      x.hp = Math.max(0, x.hp - n);
      fx(`[data-foe="${i}"]`, n, "dot");
    }
    if(x.burn > 0){
      x.burn--;
      const n = 18 + rnd(14) + d.floor*3;
      x.hp = Math.max(0, x.hp - n);
      fx(`[data-foe="${i}"]`, n, "dot");
    }
    if(x.bleed > 0){
      x.bleed--;
      const n = Math.max(8, Math.round(x.max*0.05));
      x.hp = Math.max(0, x.hp - n);
      fx(`[data-foe="${i}"]`, n, "dot");
    }
    if(x.vuln > 0) x.vuln--;
    if(x.blind > 0) x.blind--;
  });
  if(f.regen && f.regen.turns > 0 && f.idx % f.order.length === f.order.length-1){
    f.regen.turns--;
    d.hp = Math.min(d.maxhp, d.hp + f.regen.amount);
    fx(".hpwrap", f.regen.amount, "heal");
  }
  if(f.thorns > 0 && f.idx % f.order.length === f.order.length-1) f.thorns--;
  if(d.hp <= 0) return endDungeon(false, "L'escouade est tombée");
  if(f.foes.every(x=>x.hp <= 0)) return winFight();

  f.idx++;
  let guard = 0;
  while(guard++ < 20){
    const a = currentActor();
    if(a.side === "foe" && f.foes[a.i].hp <= 0){ f.idx++; continue; }
    break;
  }
  if(f.idx % f.order.length === 0){
    f.turn++;
    d.party.forEach(h=>h.skills.forEach(s=>{ if(s.ready > 0) s.ready--; }));
    f.shield = Math.max(0, f.shield - 3);
  }
  renderFight();
}

function tryFlee(){
  const d = state.dj, f = d.fight;
  if(!f) return;
  const cost = Math.round(d.maxhp*0.08) + 10;
  d.hp -= cost;
  if(d.hp <= 0) return endDungeon(false, "Fuite fatale");
  if(Math.random() < 0.55){
    f.spot.dead = false;
    d.fight = null;
    // on recule d'une case
    const back = [[0,1],[0,-1],[1,0],[-1,0]].map(([dx,dy])=>({x:d.pos.x+dx, y:d.pos.y+dy}))
      .filter(p=>p.x>=0&&p.y>=0&&p.x<DJ_W&&p.y<DJ_H&&d.g[p.y][p.x]&&!d.foes.some(g=>!g.dead&&g.x===p.x&&g.y===p.y));
    if(back.length) d.pos = back[rnd(back.length)];
    sfx.tick();
    toast("Repli", `${cost} points de vie perdus`, "info");
    return renderDungeon();
  }
  f.log.push(`<b class="crit">Fuite ratée</b> — <b class="dmg">${cost}</b> points de vie perdus`);
  sfx.hurt();
  nextTurn();
}

function winFight(){
  const d = state.dj;
  d.fight.spot.dead = true;
  d.kills++;
  if(d.fight.spot.key && !d.hasKey){
    d.hasKey = true;
    toast("Clé arrachée", "L'escalier s'ouvre", "gold");
  }
  const gain = 2 + rnd(7) + (d.fight.spot.elite ? 10 : 0);
  d.gold += gain;
  d.fight = null;
  sfx.fanfare();
  toast("Gardien vaincu", `${gain} Fandominus ramassés`, "win");
  renderDungeon();
}

/* ---------- potions ---------- */
function useInBattle(key){
  const d = state.dj;
  if(!d || !d.fight) return;
  if(!countItem(key)) return;
  const def = item(key);
  if(def.fam === "arm") return toast("Armement", "Réservé aux campagnes", "info");
  if(d.potions[def.fam] <= 0){
    return toast("Plus de flacons", `${POTION_CAP[def.fam]} ${def.fam==="heal"?"soins":"fioles de dégâts"} par expédition`, "info");
  }
  d.potions[def.fam]--;
  useItem(key, 1);
  if(def.fam === "heal"){
    d.hp = Math.min(d.maxhp, d.hp + def.val);
    toast(`${def.name} · +${def.val} HP`, "", "ach");
    sfx.ach();
  } else {
    const alive = d.fight.foes.filter(x=>x.hp > 0);
    if(alive.length) hitFoe(alive[0], def.val);
    toast(`${def.name} · ${def.val} dégâts`, "", "ach");
    sfx.cannon();
  }
  sset("fm:profile", state.profile);
  if(d.fight.foes.every(x=>x.hp <= 0)) return winFight();
  renderFight();
}

/* ---------- barre de vie ---------- */
function paintHp(){
  const d = state.dj;
  if(!d) return;
  const bar = document.getElementById("hp-me");
  if(!bar) return;
  const pct = Math.max(0, d.hp)/d.maxhp*100;
  const fill = bar.querySelector("i");
  if(fill) fill.style.width = pct+"%";
  const low = pct > 0 && pct < 15;
  bar.classList.toggle("low", low);
  const em = bar.querySelector(".embers");
  if(em) em.innerHTML = low
    ? Array.from({length:7},(_,k)=>`<b style="left:${4+k*13}%;animation-duration:${1+((k*29)%9)/10}s;animation-delay:${(k*0.17).toFixed(2)}s"></b>`).join("")
    : "";
}
function hitSpray(id){
  const bar = document.getElementById(id);
  if(!bar) return;
  bar.classList.remove("shock"); void bar.offsetWidth; bar.classList.add("shock");
  const box = document.createElement("span");
  box.className = "spray";
  for(let k=0;k<12;k++){
    const p = document.createElement("b");
    const ang = (Math.random()*120 - 60) * Math.PI/180;
    p.style.left = (20 + Math.random()*60) + "%";
    p.style.setProperty("--dx", (Math.sin(ang)*46).toFixed(1)+"px");
    p.style.setProperty("--dy", (-24 - Math.random()*34).toFixed(1)+"px");
    p.style.animationDelay = (Math.random()*0.09).toFixed(2)+"s";
    box.appendChild(p);
  }
  bar.appendChild(box);
  setTimeout(()=>box.remove(), 850);
}

/* ---------- sortie ---------- */
async function endDungeon(won, why, abandon){
  const d = state.dj;
  if(!d) return;
  // on ne repart avec le butin qu'en sortant vivant, ou en étant tombé après le deuxième étage
  const deep = (d.deepest || d.floor) > 2;
  const keep = won || (!abandon && deep);
  const bonus = won ? EXIT_GOLD : 0;
  const total = keep ? d.gold + bonus : 0;
  const lost = keep ? 0 : d.gold;
  state.profile.coins += total;
  state.profile.duels = (state.profile.duels||0) + 1;
  if(won){
    state.profile.wins = (state.profile.wins||0) + 1;
    state.profile.streak = (state.profile.streak||0) + 1;
    state.profile.bestStreak = Math.max(state.profile.bestStreak||0, state.profile.streak);
    sfx.fanfare();
  } else {
    state.profile.streak = 0;
    sfx.hurt();
  }
  logEvent(won ? `Donjon achevé · +${total} ◆` : `Donjon abandonné · +${total} ◆`, won?"win":"lose");
  await saveAll();
  await checkAch();
  document.getElementById("coins").textContent = short(state.profile.coins);

  const stats = `${d.chestsOpen} coffre(s) · ${d.kills} gardien(s) · étage ${d.deepest||d.floor}`
    + (lost ? ` · ${lost} ◆ abandonnés sur place` : "")
    + (won ? ` · prime de sortie ${EXIT_GOLD} ◆` : "");
  state.dj = null;
  view.innerHTML = `
    <div class="inner arcade ${won?"win":"lose"}" style="max-width:520px;margin:1rem auto">
      <div class="verdict">${won?"SORTIE !":"DÉFAITE."}</div>
      <p class="sub" style="text-align:center;margin:.2rem 0 .8rem">${esc(why || (won?"Vous quittez le donjon vivant.":"Le donjon vous recrache."))}</p>
      <div class="lootlist"><div class="lootrow"><span class="i">◆</span><span>${total} Fandominus${
        keep?"":" — le butin reste dans le donjon"}</span></div></div>
      ${keep?"":`<p class="sub" style="text-align:center;margin:.4rem 0 0;font-size:.82rem">Il faut franchir le deuxième étage pour emporter quoi que ce soit, ou ressortir vivant.</p>`}
      <p class="sub" style="text-align:center;margin:.6rem 0 0">${esc(stats)}</p>
      <div class="row" style="justify-content:center;margin-top:.9rem">
        <button class="btn" id="again">Nouveau donjon</button>
        <button class="btn ghost" id="hub">Accueil</button>
      </div>
    </div>`;
  view.querySelector("#again").onclick = ()=>viewDuel();
  view.querySelector("#hub").onclick = ()=>go("hub");
}

function achGoal(a){ return a.dyn ? a.dyn() : a.goal; }

async function checkAch(){
  const owned = new Set(state.profile.ach||[]);
  const fresh = [];
  for(const a of ACHIEVEMENTS){
    if(owned.has(a.id)) continue;
    if(a.val() >= achGoal(a)){
      owned.add(a.id);
      state.profile.coins += a.reward;
      fresh.push(a);
    }
  }
  if(fresh.length){
    state.profile.ach = [...owned];
    await saveAll();
    document.getElementById("coins").textContent = short(state.profile.coins);
    fresh.forEach((a,i)=>setTimeout(()=>{
      toast(a.name, `Succès débloqué · +${a.reward} ◆`, "ach"); sfx.ach();
    }, i*1400));
  }
  return fresh;
}

function toast(title, sub, kind){
  let wrap = document.getElementById("toasts");
  if(!wrap){
    wrap = document.createElement("div");
    wrap.id = "toasts"; wrap.className = "toasts";
    document.body.appendChild(wrap);
  }
  const icons = {ach:"\u2726", gold:"\u25c6", relic:"\u25ce", item:"\u25a3", win:"\u2691", lose:"\u2716", info:"\u25b8"};
  const t = document.createElement("div");
  t.className = "steamtoast " + (kind||"info") + (sub? "" : " oneline");
  t.setAttribute("role","status");
  t.innerHTML = `<span class="ic">${icons[kind||"info"]||"\u25b8"}</span>
    <span class="tx"><b>${esc(title)}</b>${sub?`<small>${esc(sub)}</small>`:""}</span>`;
  wrap.appendChild(t);
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(), 340); }, 2600);
  while(wrap.children.length > 3) wrap.firstChild.remove();
}

function viewAch(){
  const owned = new Set(state.profile.ach||[]);
  const done = ACHIEVEMENTS.filter(a=>owned.has(a.id));
  const todo = ACHIEVEMENTS.filter(a=>!owned.has(a.id))
    .sort((a,b)=> (b.val()/achGoal(b)) - (a.val()/achGoal(a)));
  const row = a=>{
    const on = owned.has(a.id);
    const g = achGoal(a), v = Math.min(a.val(), g);
    return `<div class="ach ${on?"on":""}">
      <div class="badge">${on?"✦":"·"}</div>

        ${on?"":`<div class="bar"><i style="width:${Math.round(v/g*100)}%"></i></div>
        <div class="sub" style="font-size:.78rem">${v.toLocaleString("fr-FR")} / ${g.toLocaleString("fr-FR")}</div>`}
      </div>
      <div class="rw">${on?"obtenu":"+"+a.reward.toLocaleString("fr-FR")+" ◆"}</div>

    <h3 style="font-size:1.05rem;margin:1rem 0 .5rem">En cours</h3>

      <div class="in">${done.map(row).join("")}</div>

}

/* ---------- écritures gothiques ---------- */
const FRAK = {
  up:"\u{1D504}\u{1D505}\u212D\u{1D507}\u{1D508}\u{1D509}\u{1D50A}\u210C\u2111\u{1D50D}\u{1D50E}\u{1D50F}\u{1D510}\u{1D511}\u{1D512}\u{1D513}\u{1D514}\u211C\u{1D516}\u{1D517}\u{1D518}\u{1D519}\u{1D51A}\u{1D51B}\u{1D51C}\u2128",
  lo:"\u{1D51E}\u{1D51F}\u{1D520}\u{1D521}\u{1D522}\u{1D523}\u{1D524}\u{1D525}\u{1D526}\u{1D527}\u{1D528}\u{1D529}\u{1D52A}\u{1D52B}\u{1D52C}\u{1D52D}\u{1D52E}\u{1D52F}\u{1D530}\u{1D531}\u{1D532}\u{1D533}\u{1D534}\u{1D535}\u{1D536}\u{1D537}"
};
const BFRAK = {
  up:"\u{1D56C}\u{1D56D}\u{1D56E}\u{1D56F}\u{1D570}\u{1D571}\u{1D572}\u{1D573}\u{1D574}\u{1D575}\u{1D576}\u{1D577}\u{1D578}\u{1D579}\u{1D57A}\u{1D57B}\u{1D57C}\u{1D57D}\u{1D57E}\u{1D57F}\u{1D580}\u{1D581}\u{1D582}\u{1D583}\u{1D584}\u{1D585}",
  lo:"\u{1D586}\u{1D587}\u{1D588}\u{1D589}\u{1D58A}\u{1D58B}\u{1D58C}\u{1D58D}\u{1D58E}\u{1D58F}\u{1D590}\u{1D591}\u{1D592}\u{1D593}\u{1D594}\u{1D595}\u{1D596}\u{1D597}\u{1D598}\u{1D599}\u{1D59A}\u{1D59B}\u{1D59C}\u{1D59D}\u{1D59E}\u{1D59F}"
};
function plainName(t){
  // on repart toujours de l'alphabet latin pour pouvoir enchaîner les conversions
  const up = Array.from(FRAK.up), lo = Array.from(FRAK.lo);
  const bup = Array.from(BFRAK.up), blo = Array.from(BFRAK.lo);
  return Array.from(t||"").map(ch=>{
    let i = up.indexOf(ch); if(i>=0) return String.fromCharCode(65+i);
    i = lo.indexOf(ch);     if(i>=0) return String.fromCharCode(97+i);
    i = bup.indexOf(ch);    if(i>=0) return String.fromCharCode(65+i);
    i = blo.indexOf(ch);    if(i>=0) return String.fromCharCode(97+i);
    return ch;
  }).join("");
}
function toScript(t, set){
  const up = Array.from(set.up), lo = Array.from(set.lo);
  return Array.from(plainName(t)).map(ch=>{
    const c = ch.charCodeAt(0);
    if(c >= 65 && c <= 90) return up[c-65];
    if(c >= 97 && c <= 122) return lo[c-97];
    return ch;
  }).join("");
}

/* ---------- niveau ---------- */
function playerXP(){
  let xp = 0;
  state.collection.forEach(c=>{
    const i = RARITIES.indexOf(c.rarity);
    xp += [1, 2, 5, 12, 30, 90, 300][i] || 1;
    if(c.variant) xp += 60;
    if(c.stars) xp += c.stars * 25;
    xp += Math.max(0, (c.count||1) - 1);
  });
  return xp;
}
function levelFromXP(xp){
  let lvl = 1, need = 60, left = xp;
  while(left >= need && lvl < 200){ left -= need; lvl++; need = Math.round(need * 1.16); }
  return {lvl, left, need};
}

      </div>`:""}
      <div class="pickgrid" id="pg"></div>
    </div>`;
    const pg = m.querySelector("#pg");
    const paint = ()=>{
      const q = (m.querySelector("#pq").value||"").toLowerCase();
      pg.innerHTML = list.filter(c=>!q||(c.title+" "+c.univ).toLowerCase().includes(q))
        .slice(0,120)
        .map(c=>`<div class="pickwrap ${chosen.includes(c.id)?"on":""}" data-id="${esc(c.id)}">${cardHTML(c,{compact:true})}</div>`).join("");
      pg.querySelectorAll(".pickwrap").forEach(el=>el.onclick = ()=>{
        const c = state.collection.find(x=>x.id===el.dataset.id);
        if(!multi){ m.remove(); onPick(c); return; }
        const i = chosen.indexOf(c.id);
        if(i>=0) chosen.splice(i,1);
        else if(chosen.length < multi) chosen.push(c.id);
        draw();
      });
    };
    m.querySelector("#pq").oninput = paint;
    m.querySelector("#close").onclick = ()=>m.remove();
    const fuse = m.querySelector("#fuse");
    if(fuse) fuse.onclick = async ()=>{
      if(c.count < 5 || (c.stars||0) >= 3) return;
      c.count -= 4;
      c.stars = (c.stars||0) + 1;
      c.atk = Math.round(c.atk * 1.06);
      c.def = Math.round(c.def * 1.06);
      await sset("fm:col", state.collection);
      sfx.legendary();
      logEvent(`${c.title} fusionnée en ${"★".repeat(c.stars)}`, "gold");
      toast(`${c.title} · ${"★".repeat(c.stars)}`);
      m.remove();
      if(state.view === "album") viewAlbum(); else render();
    };
    const auto = m.querySelector("#auto");
    if(auto) auto.onclick = ()=>{
      [...list].sort((a,b)=>(b.atk+b.def)-(a.atk+a.def)).forEach(c=>{
        if(chosen.length < multi && !chosen.includes(c.id)) chosen.push(c.id);
      });
      sfx.tick();
      draw();
    };
    const clear = m.querySelector("#clear");
    if(clear) clear.onclick = ()=>{ chosen.length = 0; draw(); };
    const ok = m.querySelector("#ok");
    if(ok) ok.onclick = ()=>{ m.remove(); onPick(chosen.map(id=>state.collection.find(c=>c.id===id))); };
    paint();
  };
  draw();
  document.body.appendChild(m);
}

/* ---------- atelier : production de Mana ---------- */
const MANA_RATE = 50000;     // Mana nécessaires pour un Fandominus
const MANA_CAP = 50000000;   // réservoir maximum
const UPGRADES = [
  {id:"plume",     name:"Plume de contributeur", desc:"+1 Mana par clic",      base:120,    click:1,   max:30},
  {id:"clavier",   name:"Clavier mécanique",     desc:"+5 Mana par clic",      base:1500,   click:5,   max:30},
  {id:"macro",     name:"Macro d'édition",       desc:"+30 Mana par clic",     base:22000,  click:30,  max:30},
  {id:"redacteur", name:"Rédacteur bénévole",    desc:"+0,5 Mana par seconde", base:300,    cps:0.5,   max:30},
  {id:"moderateur",name:"Modérateur",            desc:"+4 Mana par seconde",   base:4000,   cps:4,     max:30},
  {id:"bot",       name:"Bot d'archivage",       desc:"+25 Mana par seconde",  base:45000,  cps:25,    max:15},
  {id:"ferme",     name:"Ferme de serveurs",     desc:"+150 Mana par seconde", base:400000, cps:150,   max:5}
];
function maxed(u){ return lv(u.id) >= u.max; }
function forgeLeft(){
  const t = (state.profile.forgeAt||[]).filter(x=>Date.now()-x < FORGE_WINDOW);
  state.profile.forgeAt = t;
  return FORGE_MAX - t.length;
}
function forgeIn(){
  const t = state.profile.forgeAt||[];
  if(t.length < FORGE_MAX) return 0;
  return Math.max(0, FORGE_WINDOW - (Date.now() - Math.min(...t)));
}
function hms(ms){
  const t = Math.ceil(ms/1000);
  return `${Math.floor(t/3600)} h ${String(Math.floor(t%3600/60)).padStart(2,"0")}`;
}
const CRAFT = [{key:"arm1", cost:200000},{key:"arm2", cost:400000},{key:"arm3", cost:550000}];
function lv(id){ return (state.profile.up||{})[id] || 0; }
function upCost(u){ return Math.round(u.base * Math.pow(1.15, lv(u.id))); }
function perClick(){ return UPGRADES.reduce((n,u)=>n + (u.click? u.click*lv(u.id):0), 1); }
function perSec(){ return UPGRADES.reduce((n,u)=>n + (u.cps? u.cps*lv(u.id):0), 0); }
function fmt(n){ return Math.floor(n).toLocaleString("fr-FR"); }

function short(n){
  n = Math.floor(n||0);
  if(n >= 1e9) return (n/1e9).toFixed(2).replace(".",",")+" Md";
  if(n >= 1e6) return (n/1e6).toFixed(2).replace(".",",")+" M";
  if(n >= 1e4) return (n/1e3).toFixed(1).replace(".",",")+" k";
  return n.toLocaleString("fr-FR");
}
function paintMana(){
  const m = document.getElementById("mana");
  if(m) m.textContent = short(state.profile.mana||0);
  if(state.view === "farm"){
    const big = document.getElementById("mana-now");
    if(big) big.textContent = fmt(state.profile.mana||0);
    const c = document.getElementById("conv-state");
    if(c) c.textContent = convLabel();
  }
}
function convLabel(){
  const n = Math.floor((state.profile.mana||0)/MANA_RATE);
  return n>0 ? `${n} Fandominus prêt${n>1?"s":""} à couler` : `${fmt(MANA_RATE-((state.profile.mana||0)%MANA_RATE))} Mana avant la prochaine pièce`;
}

function farmTick(){
  const p = state.profile;
  const cps = perSec();
  const now = Date.now();
  if(!cps){ p.farmAt = now; return; }
  const el = Math.min((now - (p.farmAt||now))/1000, 2*3600);   // 2 h de production hors ligne
  p.farmAt = now;
  p.mana = Math.min(MANA_CAP, (p.mana||0) + cps*el);
  paintMana();
}

  const fg = view.querySelector("#forges");
  if(fg) fg.ontoggle = ()=>{ state.forgesOpen = fg.open; };

    view.querySelectorAll("[data-u]").forEach(b=>{

    const max = Math.floor(p.mana/MANA_RATE);
    const k = Math.min(n, max);
    if(k < 1) return;
    p.mana -= k*MANA_RATE;
    p.coins += k;

    viewFarm();

    toast(`Booster mythique forgé — ${p.mythic} en réserve`);
    viewFarm();
    checkAch();
  };
  view.querySelector("#conv1").onclick = ()=>convert(1);
  view.querySelector("#convall").onclick = ()=>convert(Infinity);

  view.querySelectorAll("[data-u]").forEach(b=>b.onclick=async ()=>{
    const u = UPGRADES.find(x=>x.id===b.dataset.u);
    const c = upCost(u);
    if(p.mana < c || maxed(u)) return;
    p.mana -= c;
    p.up = p.up || {};
    p.up[u.id] = lv(u.id) + 1;
    sfx.ach();
    await sset("fm:profile", p);
    viewFarm();
  });
}

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function campSeason(){ return Math.floor(Date.now()/CAMP_WINDOW) + (state.profile.campSkip||0); }
function campSeasonEnd(){ return (Math.floor(Date.now()/CAMP_WINDOW)+1)*CAMP_WINDOW; }
function currentCampaigns(){
  const seed = campSeason();
  const done = state.profile.campDone || [];
  const fresh = done.filter(id=>String(id).startsWith(seed+"-"));
  if(fresh.length !== done.length){ state.profile.campDone = fresh; sset("fm:profile", state.profile); }
  const rnd = mulberry32(seed*2654435761 % 2147483647);
  const pool = CAMPAIGN_SITES.slice();
  const sites = [];
  while(sites.length < 5 && pool.length){
    const i = Math.floor(rnd()*pool.length);
    const s = pool.splice(i,1)[0];
    if(!sites.some(x=>x.univ===s.univ)) sites.push(s);     // cinq univers différents
  }
  const mins = CAMP_MINS.slice().sort(()=>rnd()-0.5);
  const out = sites.map((s,i)=>({
    id: seed+"-"+i,
    univ: s.univ, lieu: s.lieu, vilain: s.vilain,
    mins: mins[i],
    base: Math.max(12, Math.round(CAMP_BASE[mins[i]] + (rnd()*10 - 5)))
  }));
  // le sixième théâtre : l'Abîme, tiré dans un univers encore libre
  const rest = CAMPAIGN_SITES.filter(x=>!sites.some(y=>y.univ===x.univ));
  const a = rest.length ? rest[Math.floor(rnd()*rest.length)] : CAMPAIGN_SITES[0];
  out.push({
    id: seed+"-abyss", abyss:true,
    univ:a.univ, lieu:"L'Abîme de "+a.lieu, vilain:a.vilain+" déchaîné",
    mins: ABYSS_MINS, base: 10
  });
  return out;
}

function eligibleCards(){
  return state.collection.filter(c=>c.rarity==="Légendaire"||c.rarity==="Ultra rare"||c.rarity==="Relique");
}
function allMaxed(){ return UPGRADES.every(u=>lv(u.id) >= u.max); }
function campUnlocked(){
  return allMaxed() && (nRar("Légendaire") >= 5 || nRar("Ultra rare") >= 5);
}
function squadPower(cards){ return cards.reduce((n,c)=>n + c.atk + c.def, 0); }
function squadBonus(cards){
  return Math.max(0, Math.min(40, Math.round((squadPower(cards) - 40000)/60000*40)));
}
function campChance(camp, cards){ return Math.min(95, camp.base + squadBonus(cards)); }

const MAX_CAMPS = 2;
const REROLL_COST = 1000;
const REROLL_COOLDOWN = 48*3600*1000;
function rerollLeft(){
  const at = state.profile.rerollAt || 0;
  return Math.max(0, REROLL_COOLDOWN - (Date.now() - at));
}
function camps(){ return state.profile.camps || (state.profile.camps = []); }
function engagedIds(){ return new Set(camps().flatMap(c=>c.cardIds)); }
function freeEligible(){
  const busy = engagedIds();
  return eligibleCards().filter(c=>!busy.has(c.id));
}

  const p = state.profile;
  if(!campUnlocked()){
    const done = UPGRADES.filter(u=>lv(u.id)>=u.max).length;

      <h2 style="font-size:1.6rem">Campagnes</h2>

    ${info("Comment marchent les campagnes ?", "<p class='sub' style='margin:0'>Deux campagnes au maximum en parallèle, chacune avec son escouade de cinq Légendaires, Ultra rares ou Reliques. L'attaque et la défense de l'escouade font monter les chances jusqu'à 40 points, les armements y ajoutent le dixième de leurs dégâts. Une campagne gagnée rapporte des Fandominus, du Mana, parfois une carte, et plus rarement la carte du vilain lui-même.</p>")}

    ${running.length? `<h3 style="font-size:1.05rem;margin:1rem 0 .5rem">En cours</h3>
      ${running.map((c,k)=>campCardHTML(c, "run"+k, {squad:c, chance:c.chance,

                 <button class="btn ghost small" data-recall="${esc(c.id)}">Retour au camp</button>`})).join("")}` : ""}

    <h3 style="font-size:1.05rem;margin:1.2rem 0 .5rem">Théâtres disponibles</h3>
    ${camps().length >= MAX_CAMPS ? `<p class="sub" style="margin:0 0 .6rem">Vos deux escouades sont déjà parties.</p>` : ""}
    ${libres < 5 ? `<p class="sub" style="margin:0 0 .6rem">${libres} carte(s) Légendaire ou Ultra rare disponibles — il en faut cinq, celles déjà engagées ne comptent pas.</p>` : ""}
    ${list.map((c,i)=>{
      const busy = engaged.has(c.id), done = cleared.has(c.id);
      const can = !busy && !done && camps().length < MAX_CAMPS && libres >= 5;
      return campCardHTML(c, i, {locked:busy||done,

    ${ended.length? `<h3 style="font-size:1.05rem;margin:1.4rem 0 .5rem">Campagne${ended.length>1?"s":""} achevée${ended.length>1?"s":""}</h3>

  const rr = view.querySelector("#reroll");
  if(rr) rr.onclick = async ()=>{
    if(rerollLeft() > 0 || state.profile.coins < REROLL_COST) return;
    state.profile.coins -= REROLL_COST;
    state.profile.rerollAt = Date.now();
    state.profile.campSkip = (state.profile.campSkip||0) + 1;
    sfx.coin();

    document.getElementById("coins").textContent = short(state.profile.coins);

  running.forEach((c,k)=>paintCampArt(c, view.querySelector(`[data-camp="run${k}"]`)));
  ended.forEach((c,k)=>paintCampArt(c, view.querySelector(`[data-camp="end${k}"]`)));

    if(ready.length) return chooseSquad(camp, ready, busyIds);
    manualSquad(camp, busyIds);
  });

function chooseSquad(camp, ready, busyIds){
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="inner">
    <h3 style="font-size:1.15rem;margin-bottom:.2rem">Escouade pour ${esc(camp.lieu)}</h3>
    <p class="sub" style="margin:.2rem 0 .8rem">Envoyez un deck de campagne tout prêt, ou composez à la main.</p>
    ${ready.map(d=>deckHTML(d, {pick:true})).join("")}
    <div class="row" style="margin-top:.6rem">
      <button class="btn ghost" id="manual">Choisir à la main</button>
      <button class="btn ghost" id="close">Annuler</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.onclick = e=>{ if(e.target===m) m.remove(); };
  m.querySelector("#close").onclick = ()=>m.remove();
  m.querySelector("#manual").onclick = ()=>{ m.remove(); manualSquad(camp, busyIds); };
  m.querySelectorAll("[data-pick]").forEach(el=>el.onclick = ()=>{
    const d = decks().find(x=>x.id === el.dataset.pick);

}

function manualSquad(camp, busyIds){
  pickCard({
    title:`Escouade pour ${camp.lieu}`,
    filter:c=>(c.rarity==="Légendaire"||c.rarity==="Ultra rare"||c.rarity==="Relique") && !busyIds.has(c.id),
    multi:5,
    onPick:cards=>launchCamp(camp, cards)
  });
}

function armBonus(arms){
  return Object.values(arms||{}).reduce((n,k)=>n + item(k).val/10, 0);
}
function availableArms(used){
  const tally = {};
  Object.values(used||{}).forEach(k=>tally[k] = (tally[k]||0)+1);
  return ITEMS.filter(i=>i.fam==="arm").map(i=>({key:i.key, n:countItem(i.key) - (tally[i.key]||0)}))
              .filter(x=>x.n > 0);
}

function launchCamp(camp, cards){
  const arms = {};
  const has = ITEMS.some(i=>i.fam==="arm" && countItem(i.key) > 0);
  if(!has) return commitCamp(camp, cards, {});

  const m = document.createElement("div");
  m.className = "modal";
  const draw = ()=>{
    const bonus = armBonus(arms);
    const chance = Math.min(95, campChance(camp, cards) + bonus);
    m.innerHTML = `<div class="inner" style="max-width:620px">
      <h3 style="font-size:1.15rem;margin-bottom:.2rem">Armement de l'escouade</h3>
      <p class="sub" style="margin:.2rem 0 .7rem">Chaque arme gonfle les dégâts d'une carte. Elles sont consommées au retour, rendues si vous rappelez l'escouade.</p>
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:.6rem">
        <span class="odds">${chance} %</span>
        <span class="sub">${bonus?`+${bonus.toFixed(1)} point(s) d'armement`:"aucun armement posé"}</span>
      </div>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(112px,1fr))">
        ${cards.map(c=>`<div>
          ${cardHTML(c,{compact:true, arm:arms[c.id]})}
          <div class="row" style="gap:.25rem;margin-top:.3rem;justify-content:center">
            ${availableArms(arms).map(a=>`<button class="armpick" data-set="${esc(c.id)}|${a.key}">
               ${itemSVGMini(a.key)}<b>${esc(itemShort(a.key))}</b><small>+${item(a.key).val} · ${a.n}</small></button>`).join("")}
            ${arms[c.id]? `<button class="btn small ghost" style="padding:.2rem .45rem" data-clr="${esc(c.id)}">✕</button>`:""}
          </div>
        </div>`).join("")}
      </div>
      <div class="row" style="margin-top:1rem">
        <button class="btn" id="send">Envoyer l'escouade</button>
        <button class="btn ghost" id="cancel">Annuler</button>
      </div>
    </div>`;
    m.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{
      const [id, key] = b.dataset.set.split("|");
      arms[id] = key; draw();
    });
    m.querySelectorAll("[data-clr]").forEach(b=>b.onclick=()=>{ delete arms[b.dataset.clr]; draw(); });
    m.querySelector("#cancel").onclick = ()=>m.remove();
    m.querySelector("#send").onclick = ()=>{ m.remove(); commitCamp(camp, cards, arms); };
  };
  draw();
  document.body.appendChild(m);
}

async function commitCamp(camp, cards, arms){
  Object.values(arms).forEach(k=>useItem(k, 1));
  const chance = Math.min(95, campChance(camp, cards) + armBonus(arms));
  camps().push({
    id:camp.id, lieu:camp.lieu, univ:camp.univ, vilain:camp.vilain, mins:camp.mins,
    chance, cardIds:cards.map(c=>c.id), arms, endsAt: Date.now() + camp.mins*60000,
    win: Math.random()*100 < chance
  });
  await sset("fm:profile", state.profile);
  toast(`Escouade partie pour ${camp.lieu} — ${chance} % de réussite`);
  sfx.epic();
  viewCamp();
}

/* illustrations tirées du wiki de l'univers concerné, mises en cache */
async function imageFor(w, title){
  try{
    const d = await api({action:"query", generator:"search", gsrsearch:title, gsrlimit:"1",
                         prop:"pageimages", piprop:"thumbnail", pithumbsize:"800"}, w, 8000);
    const p = ((d.query && d.query.pages) || [])[0];
    return p && p.thumbnail ? p.thumbnail.source : null;
  }catch(e){ return null; }
}
async function campArt(c){
  const key = "fm:art:"+c.id;
  const hit = await sget(key);
  if(hit) return hit;
  const w = (state.pool||[]).find(x=>x.label === c.univ);
  const out = {bg:null, boss:null, lieu:null};
  if(w){
    out.bg = await imageFor(w, c.lieu);
    if(!out.bg){
      // pas d'illustration pour ce lieu : on en essaie d'autres du même univers
      const alts = CAMPAIGN_SITES.filter(x=>x.univ === c.univ && x.lieu !== c.lieu);
      for(const alt of shuffled(alts).slice(0,3)){
        const img = await imageFor(w, alt.lieu);
        if(img){ out.bg = img; out.lieu = alt.lieu; break; }
      }
    }
    out.boss = await imageFor(w, c.vilain);
  }
  await sset(key, out);
  return out;
}
async function paintCampArt(c, el){
  if(!el) return;
  try{
    const art = await campArt(c);
    if(!el.isConnected) return;
    if(art.bg) el.style.backgroundImage = `url("${art.bg}")`;
    if(art.lieu){
      c.lieu = art.lieu;                       // le théâtre suit l'illustration trouvée
      const h = el.querySelector("h3");
      if(h) h.textContent = "Campagne : " + art.lieu;
    }
    const boss = el.querySelector("[data-boss]");
    if(boss && art.boss){
      boss.style.backgroundImage = `url("${art.boss}")`;
      boss.classList.add("hasart");
      boss.innerHTML = `<span>${esc(c.vilain)}</span>`;
    }
  }catch(e){}
}

/* ---------- rapport de campagne ---------- */
async function collectCamp(id){
  const c = camps().find(x=>x.id === id);
  if(!c) return;
  const loot = CAMP_LOOT[c.mins];
  const won = !!c.win;

  const gains = [];
  let cardWanted = null, card2Wanted = null, bossWanted = false, relicWanted = false;
  if(won){
    if(Math.random() < 0.7) gains.push({type:"coins", n:loot.coins, label:`${loot.coins} Fandominus`});
    if(Math.random() < 0.6) gains.push({type:"mana",  n:loot.mana,  label:`${loot.mana.toLocaleString("fr-FR")} Mana`});
    if(loot.card) cardWanted = loot.card;        // 2 h, 4 h et Abîme : carte garantie
    if(loot.card2) card2Wanted = loot.card2;
    if(loot.relic && Math.random() < loot.relic) relicWanted = true;
    if(Math.random() < 0.08) bossWanted = true;          // la tête du vilain, rarement
    if(!gains.length && !cardWanted) gains.push({type:"coins", n:loot.coins, label:`${loot.coins} Fandominus`});
  }

  const m = document.createElement("div");
  m.className = "modal";
  const paint = (cardHtml, pending)=>{
    m.innerHTML = `<div class="inner arcade ${won?"win":"lose"}">
      <div class="verdict">${won?"VICTOIRE !":"DÉFAITE."}</div>
      <p class="sub" style="text-align:center;margin:.2rem 0 .9rem">
        ${won ? `${esc(c.vilain)} est tombé à ${esc(c.lieu)}.` : `${esc(c.vilain)} a repoussé votre escouade à ${esc(c.lieu)}.`}
      </p>
      ${won? `<div class="lootlist">
        ${gains.map(g=>`<div class="lootrow"><span class="i">${g.type==="coins"?"◆":g.type==="mana"?"★":"▣"}</span><span>${esc(g.label)}</span></div>`).join("")}
      </div>
      ${cardHtml || (pending? `<p class="sub" style="text-align:center;margin:.6rem 0 0"><span class="spinner"></span> une carte ${esc(cardWanted)} vous est rapportée…</p>` : "")}`
      : `<p class="sub" style="text-align:center;margin:0 0 .9rem">Vos cartes rentrent intactes, mais les mains vides.</p>`}
      <button class="btn" id="take" style="width:100%;margin-top:.9rem" ${pending?"disabled":""}>Récupérer</button>
    </div>`;
    const take = m.querySelector("#take");
    if(take && !pending) take.onclick = ()=>finishCollect(c, gains, m);
  };

  paint(null, !!cardWanted || bossWanted);
  document.body.appendChild(m);
  if(won) sfx.fanfare(); else sfx.hurt();

  if(bossWanted){
    let boss = null;
    try{
      await ensurePool();
      const w = (state.pool||[]).find(x=>x.label === c.univ);
      if(w){
        const p = await pageByTitle(w, c.vilain);
        if(p && !p.missing){
          const ranked = await mostLinked(w).catch(()=>[]);
          boss = makeCard(await enrich(p, w), w, bestRarity("Ultra rare", intrinsicRarity(p, ranked)));
        }
      }
    }catch(e){}
    if(boss){
      c.boss = boss;
      gains.push({type:"boss", label:`${boss.title} — carte ${boss.rarity}`});
      paint(`<div style="max-width:175px;margin:.7rem auto 0">${cardHTML(boss,{count:(owned(boss)||0)+1})}</div>`, !!cardWanted);
      sfxForRarity(boss.rarity);
    }
  }

  if(relicWanted){
    try{
      await ensurePool();
      const relic = await relicCard();
      if(relic){
        c.relicLoot = relic;
        gains.push({type:"relic", label:`Artefact — ${relic.title}`});
        paint(`<div style="max-width:175px;margin:.7rem auto 0">${cardHTML(relic)}</div>`, true);
        sfx.legendary();
      }
    }catch(e){}
  }

  if(card2Wanted){
    try{
      const pool = await ensurePool();
      const w = pool[Math.floor(Math.random()*pool.length)];
      const extra = await drawForRarity(w, card2Wanted);
      if(extra){
        c.loot2 = extra;
        gains.push({type:"card", label:`${extra.title} — ${extra.rarity}`});
      }
    }catch(e){}
  }

  if(cardWanted){
    let card = null;
    try{
      const pool = await ensurePool();
      const w = pool[Math.floor(Math.random()*pool.length)];
      card = await drawForRarity(w, cardWanted);
    }catch(e){}
    if(card){
      c.loot = card;                                   // remise effective au clic
      gains.push({type:"card", label:`Carte ${card.rarity} — ${card.title}`});
      paint(`<div style="max-width:175px;margin:.7rem auto 0">${cardHTML(card,{count:(owned(card)||0)+1})}</div>`, false);
      sfxForRarity(card.rarity);
    } else {
      paint(`<p class="sub" style="text-align:center;margin:.6rem 0 0">La carte promise s'est perdue en route.</p>`, false);
    }
  }
}

async function finishCollect(c, gains, m){
  const p = state.profile;
  gains.forEach(g=>{
    if(g.type==="coins") p.coins += g.n;
    if(g.type==="mana")  p.mana = Math.min(MANA_CAP, p.mana + g.n);
  });
  if(c.loot) addCard(c.loot);
  if(c.loot2) addCard(c.loot2);
  if(c.boss) addCard(c.boss);
  if(c.relicLoot) addCard(c.relicLoot);
  if(c.win && Math.random() < 0.05){
    p.fox = (p.fox||0) + 1;
    toast("Le marchand renard vous glisse un booster");
  }
  if(c.win){
    p.campWins = (p.campWins||0) + 1;
    p.campDone = (p.campDone||[]).concat(c.id);
  } else p.campLost = (p.campLost||0) + 1;
  logEvent(c.win? `Campagne réussie à ${c.lieu} — ${c.vilain} vaincu`
                : `Campagne perdue à ${c.lieu} face à ${c.vilain}`, c.win?"win":"lose");
  p.camps = camps().filter(x=>x.id !== c.id);
  await saveAll();
  document.getElementById("coins").textContent = short(p.coins);
  paintMana();
  checkAch();
  m.remove();
  if(state.view === "camp") viewCamp(); else render();
}

/* ---------- catalogue des cartes ---------- */
const RAR_HEX = {"Commun":"#A2968A","Peu commun":"#7FB88A","Rare":"#4FB3A5",
                 "Super rare":"#C77FA8","Ultra rare":"#E2754C","Légendaire":"#E8B44C"};

async function viewCatalog(){
  const w = state.catW;
  if(!w){
    view.innerHTML = `<div class="cat">
      <div class="head"><h2 style="font-size:1.5rem">Toutes les cartes</h2>
      <p class="sub" style="margin:.35rem 0 0">Choisissez un monde pour voir ce qu'il vous reste à décrocher.</p></div>
      ${state.pool.length? `
        <div class="filters" style="margin:.8rem 0 .2rem">
          <input id="uq" placeholder="Chercher un univers…" value="${esc(state.uq||"")}">
          <select id="ucat">
            ${["Tous",...CATS].map(c=>`<option value="${esc(c)}" ${c===(state.ucat||"Tous")?"selected":""}>${c==="Tous"?"Toutes les familles":esc(c)}</option>`).join("")}
          </select>
        </div>
        <div id="ulist"></div>
        ${state.pool.length < UNIVERSES.length ? `<p class="sub" style="margin-top:1rem"><span class="spinner"></span> ${state.pool.length} univers prêts sur ${UNIVERSES.length}…</p>` : ""}`
      : `<div class="panel"><span class="spinner"></span> repérage des univers…</div>`}
    </div>`;
    const uq = view.querySelector("#uq"), uc = view.querySelector("#ucat");
    if(uq) uq.oninput = ()=>{ state.uq = uq.value; renderUniverses(); };
    if(uc) uc.onchange = ()=>{ state.ucat = uc.value; renderUniverses(); };
    renderUniverses();
    if(!state.pool.length) ensurePool().then(()=>{ if(state.view==="cat") viewCatalog(); });
    return;
  }

  if(!state.catList){
    view.innerHTML = `<div class="cat"><div class="head"><h2 style="font-size:1.4rem">${esc(w.label)}</h2></div>
      <div class="panel"><span class="spinner"></span> lecture du palmarès du wiki…</div></div>`;
    try{ state.catList = await mostLinked(w); }
    catch(e){ state.catList = []; }
    if(state.view !== "cat") return;
  }

  const list = state.catList;
  view.innerHTML = `<div class="cat">
    <div class="head">
      <div class="row" style="justify-content:space-between">
        <h2 style="font-size:1.4rem">${esc(w.label)}</h2>
        <button class="btn small ghost" id="back">Changer d'univers</button>
      </div>
      <p class="sub" style="margin:.4rem 0 0">${list.length? `${Math.min(list.length,175)} emplacements répertoriés pour cet univers. Le wiki en compte des milliers d'autres : chaque carte tirée ailleurs vient s'ajouter en bas de page.` : "Ce wiki n'expose pas de palmarès exploitable ; seules vos cartes obtenues sont listées."}</p>
    </div>
    <input id="catq" placeholder="Rechercher dans cet univers…" value="${esc(state.catQ||"")}" style="margin-bottom:.8rem">
    <div id="catlist"></div>
  </div>`;

  view.querySelector("#back").onclick = ()=>{ state.catW=null; state.catList=null; state.catQ=""; viewCatalog(); };
  view.querySelector("#catq").oninput = ()=>renderCatList();
  renderCatList();
}

const CAT_LIMIT = 175;   // emplacements affichés par univers

const CAT_TINT = {"Jeux vidéo":["#4FB3A5","#1C2F2C"], "Films & séries":["#E2754C","#3A1E14"],
                  "Livres & mangas":["#C77FA8","#33202A"], "Autres":["#B9AC9E","#2E2721"]};

/* vignette représentative d'un univers, mise en cache */
async function univArt(w){
  const key = "fm:uart:"+w.host+(w.path||"");
  const hit = await sget(key);
  if(hit) return hit.src || null;
  let src = null;
  try{ src = await imageFor(w, w.label); }catch(e){}
  if(!src){ try{ src = await imageFor(w, "personnages"); }catch(e){} }
  await sset(key, {src});
  return src;
}
function paintUnivArt(){
  view.querySelectorAll("[data-uart]").forEach(async el=>{
    if(el.dataset.done) return;
    el.dataset.done = "1";
    const w = state.pool[+el.dataset.uart];
    if(!w) return;
    const src = await univArt(w);
    if(src && el.isConnected){
      el.style.backgroundImage = `url("${src}")`;
      el.classList.add("hasart");
    }
  });
}

function renderUniverses(){
  const box = view.querySelector("#ulist");
  if(!box) return;
  const q = (state.uq||"").trim().toLowerCase();
  const cat = state.ucat || "Tous";
  const ws = state.pool.map((u,i)=>({u,i}))
    .filter(x=>(cat==="Tous" || (x.u.cat||"Autres")===cat) && (!q || x.u.label.toLowerCase().includes(q)));

  const groups = (cat==="Tous" ? CATS : [cat]).map(c=>{
    const list = ws.filter(x=>(x.u.cat||"Autres")===c);
    if(!list.length) return "";
    const tint = CAT_TINT[c] || CAT_TINT["Autres"];
    return `<h3 style="font-size:1rem;margin:1rem 0 .5rem">${esc(c)} <span class="sub" style="font-weight:400;font-size:.84rem">· ${list.length}</span></h3>
      <div class="ugrid">${list.map(({u,i})=>{
        const mine = state.collection.filter(x=>x.univ===u.label);
        const pct = Math.min(100, Math.round(mine.length/175*100));
        const leg = mine.filter(x=>RARITIES.indexOf(x.rarity) >= 5).length;
        return `<button class="utile" data-i="${i}" style="--ua:${tint[0]};--ub:${tint[1]}">
          <span class="art" data-uart="${i}"></span>
          <span class="veil"></span>
          <span class="in">
            <span class="txt">
              <b>${esc(u.label)}</b>
              <small>${mine.length} carte${mine.length>1?"s":""}${leg?` · ${leg} légendaire${leg>1?"s":""}`:""}</small>
            </span>
          </span>
          <span class="ring"><i style="width:${pct}%"></i></span>
          <span class="pct">${pct} %</span>
        </button>`;
      }).join("")}</div>`;
  }).join("");

  box.innerHTML = groups || `<div class="panel">Aucun univers ne correspond.</div>`;
  box.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
    state.catW = state.pool[+b.dataset.i]; state.catList = null; viewCatalog();
  });
  paintUnivArt();
}

function renderCatList(){
  const box = view.querySelector("#catlist");
  if(!box || !state.catW) return;
  const input = view.querySelector("#catq");
  if(input) state.catQ = input.value;
  const full = state.catList || [];
  const list = full.slice(0, CAT_LIMIT);
  const tiers = list.length ? tierMap(list) : null;
  const q = (state.catQ||"").trim().toLowerCase();

  const mine = state.collection.filter(c=>c.univ===state.catW.label);
  const byTitle = new Map(mine.map(c=>[c.title, c]));
  const inList = new Set(list.map(e=>e.t));

  const slot = (title, card)=> card
    ? `<div class="cslot got" data-id="${esc(card.id)}">${cardHTML(card)}</div>`
    : `<div class="cslot"><span class="nm">${esc(title)}</span><span class="lock">à trouver</span></div>`;

  let html = "";
  if(tiers){
    RARITIES.slice().reverse().forEach(rar=>{
      const all = tiers[rar] || [];
      if(!all.length) return;
      const rows = q ? all.filter(t=>t.toLowerCase().includes(q)) : all;
      const got = all.filter(t=>byTitle.has(t)).length;
      html += `<div class="catsec">
        <h3><span class="pill" style="background:${RAR_HEX[rar]}">${esc(rar)}</span>
          <span class="prog">${got} / ${all.length} obtenues</span></h3>
        ${rows.length? `<div class="cgrid">${rows.map(t=>slot(t, byTitle.get(t))).join("")}</div>`
          : `<p class="sub" style="margin:.2rem 0 0;font-size:.85rem">Rien à ce palier pour cette recherche.</p>`}
      </div>`;
    });
  }

  // déclinaisons de l'icône de l'univers
  const icon = iconicOf(state.catW, full);
  if(icon){
    const owned = new Map(mine.filter(c=>c.variant).map(c=>[c.variant, c]));
    html += `<div class="catsec">
      <h3><span class="pill" style="background:linear-gradient(90deg,#FF5C93,#FFD36A,#7FD0C2);color:#1A1614">Spéciales</span>
        <span class="prog">${owned.size} / ${VARIANTS.length} obtenues</span></h3>
      <p class="sub" style="margin:0 0 .5rem;font-size:.82rem">${esc(icon)}, l'emblème de cet univers, décliné en six finitions. Elles remplacent la carte normale dès qu'elle sort.</p>
      <div class="cgrid">${VARIANTS.map(v=>{
        const c = owned.get(v.key);
        return c ? `<div class="cslot got" data-id="${esc(c.id)}">${cardHTML(c)}</div>`
                 : `<div class="cslot"><span class="nm">${esc(icon)}<br>${esc(v.name)}</span><span class="lock">à trouver</span></div>`;
      }).join("")}</div>
    </div>`;
  }

  const extra = mine.filter(c=>!inList.has(c.title) && !c.variant)
    .filter(c=>!q || c.title.toLowerCase().includes(q))
    .sort((a,b)=>RARITIES.indexOf(b.rarity)-RARITIES.indexOf(a.rarity)||a.title.localeCompare(b.title));
  if(extra.length){
    html += `<div class="catsec">
      <h3><span class="pill" style="background:#7FBFB4">Vos trouvailles</span>
        <span class="prog">${extra.length} carte${extra.length>1?"s":""}</span></h3>
      <p class="sub" style="margin:0 0 .5rem;font-size:.82rem">Tirées hors des ${CAT_LIMIT} emplacements répertoriés — elles s'ajoutent ici à mesure que vous les obtenez.</p>
      <div class="cgrid">${extra.map(c=>slot(c.title, c)).join("")}</div>
    </div>`;
  }

  box.innerHTML = html || `<div class="panel">Rien à afficher pour cette recherche.</div>`;
  box.querySelectorAll(".cslot.got").forEach(el=>{
    el.onclick = ()=>showCard(state.collection.find(c=>c.id===el.dataset.id));
  });
}

/* flèches gauche/droite pour feuilleter l'album */
document.addEventListener("keydown", e=>{
  if(state.view !== "album") return;
  if(document.querySelector(".modal")) return;
  const t = e.target;
  if(t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA")) return;
  if(e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const pages = Math.max(1, Math.ceil(albumMatches().length / PAGE_SIZE));
  const next = Math.min(pages, Math.max(1, (state.page||1) + (e.key === "ArrowRight" ? 1 : -1)));
  if(next === state.page) return;
  state.page = next;
  sfx.tick();
  renderAlbumGrid(false);
  e.preventDefault();
});

/* ---------- amorçage ---------- */
const SCRIM = document.getElementById("scrim");
const MENU = document.getElementById("menupanel");
const SECONDARY = ["cat","decks","inv","ach","profil","village","shop","market"];
function setMenu(open){
  MENU.classList.toggle("open", open);
  SCRIM.classList.toggle("open", open);
}
document.getElementById("more").onclick = ()=>{ sfx.tick(); setMenu(!MENU.classList.contains("open")); };
SCRIM.onclick = ()=>setMenu(false);
document.querySelectorAll("#nav button[data-view], #menupanel button[data-view]").forEach(b=>{
  b.onclick = ()=>{ setMenu(false); sfx.tick(); go(b.dataset.view); };
});
function paintNav(){
  document.querySelectorAll("#nav button[data-view], #menupanel button[data-view]")
    .forEach(b=>b.setAttribute("aria-current", String(b.dataset.view === state.view)));
  document.getElementById("more").setAttribute("aria-current", String(SECONDARY.includes(state.view)));
}

document.getElementById("home").onclick = ()=>go("hub");
document.getElementById("me").onclick = ()=>go("profil");
function paintMe(){
  const p = state.profile;
  const pic = document.getElementById("mepic"), nm = document.getElementById("mename");
  if(!pic || !nm) return;
  nm.textContent = p.pseudo || "";
  const c = p.avatar ? state.collection.find(x=>x.id===p.avatar) : null;
  pic.innerHTML = (c && c.img) ? `<img src="${esc(c.img)}" alt="">` : esc((p.pseudo||"?").slice(0,1).toUpperCase());
}
document.getElementById("wikitag").onclick = openSettings;
const soundBtn = document.getElementById("sound");
function paintSound(){ soundBtn.textContent = state.profile.mute ? "♪̸" : "♪"; }
soundBtn.onclick = async ()=>{
  state.profile.mute = !state.profile.mute;
  paintSound();
  if(!state.profile.mute) sfx.flip();
  await sset("fm:profile", state.profile);
};

function openSettings(){
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="inner">
    <h3 style="font-size:1.2rem;margin-bottom:.6rem">Réglages</h3>
    <p class="sub" style="margin-top:0">${state.pool.length? state.pool.length+" univers joignables sur "+UNIVERSES.length : "univers en cours de repérage…"}</p>
    <p class="sub" style="margin:.2rem 0 0">Le pseudo et la photo se changent dans l'onglet Profil.</p>

    <div class="row" style="margin-top:1rem">
      <button class="btn small ghost" id="s-recheck">Revérifier les univers</button>
    </div>
  </div>`;
  m.onclick = e=>{ if(e.target===m) m.remove(); };
  document.body.appendChild(m);
  m.querySelector("#s-recheck").onclick = async ()=>{
    await sset("fm:pool2", {t:0, pool:[]});
    poolPromise = null; state.pool = [];
    m.remove(); render(); ensurePool();
  };
}

(async function boot(){
  await migrateLegacy();
  const p = await sget("fm:profile"); if(p) Object.assign(state.profile, p);
  // les parties créées avant les Fandominus repartent avec la dotation complète
  if(!state.profile.v || state.profile.v < 3){
    state.profile.v = 3;
    state.profile.coins = START_COINS;      // nouvelle économie : 60 ◆ + boosters gratuits
    state.profile.free = FREE_MAX;
    state.profile.freeAt = Date.now();
    await sset("fm:profile", state.profile);
  }
  syncFree();
  state.profile.up = state.profile.up || {};
  state.profile.mana = state.profile.mana || 0;
  state.profile.mythic = state.profile.mythic || 0;
  state.profile.demon = state.profile.demon || 0;
  state.profile.slots = state.profile.slots || [];
  state.profile.camps = state.profile.camps || [];
  state.profile.inv = state.profile.inv || [];
  state.profile.hotbar = state.profile.hotbar || [null,null,null,null,null,null,null,null];
  state.profile.invUp = state.profile.invUp || 0;
  if(state.profile.camp){ state.profile.camps.push(state.profile.camp); state.profile.camp = null; }
  state.profile.camps.forEach(c=>{ if(c.win === undefined) c.win = Math.random()*100 < c.chance; });
  if(!state.profile.since){ state.profile.since = Date.now(); await sset("fm:profile", state.profile); }
  farmTick();
  state.collection = (await sget("fm:col")) || [];
  paintSound();
  render();
  tick();
  checkAch();
  setInterval(tick, 1000);
  setInterval(()=>sset("fm:profile", state.profile), 8000);
  if(state.profile.pseudo) ensurePool();
})();
</script>

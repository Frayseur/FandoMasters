<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#201B18">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg transform='rotate(-8 32 32)'%3E%3Crect x='20' y='12' width='24' height='38' rx='4' fill='url(%23g)' stroke='%23E8B44C' stroke-width='2'/%3E%3C/g%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FFE39A'/%3E%3Cstop offset='1' stop-color='%238A6A27'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x='32' y='40' font-family='sans-serif' font-size='22' font-weight='bold' fill='%230B1020' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<title>FandoMasters — tous les univers dans un seul jeu de cartes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Karla:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#201B18;
  --ink-2:#2D2724;
  --panel:#382F2B;
  --line:#574A42;
  --text:#F7F2EB;
  --muted:#C6B8A9;
  --brass:#E8B44C;
  --brass-dim:#9A7A33;
  --clay:#E2754C;
  --teal:#4FB3A5;
  --rose:#C77FA8;
  --green:#8FB98A;
  --red:#E2674C;
  --c-commun:#B9AC9E;
  --c-peucommun:#8FB98A;
  --c-rare:#4FB3A5;
  --c-superrare:#C77FA8;
  --c-ultrarare:#E2754C;
  --c-legendaire:#E8B44C;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
button,.card,.item,.utile,.deck,.hslot,.cslot,.flip,.bigclick{touch-action:manipulation;
  -webkit-tap-highlight-color:transparent}
body{
  background:radial-gradient(1200px 700px at 50% -10%, #3A2E22 0%, transparent 60%), var(--ink);
  color:var(--text); font-family:"Karla",system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:16px; line-height:1.55; min-height:100vh; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Bricolage Grotesque","Karla",sans-serif;font-weight:800;letter-spacing:-0.02em;line-height:1.05;margin:0}
a{color:var(--brass)}
button{font-family:inherit;font-size:1rem;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input,select{font-family:inherit;font-size:1rem;color:var(--text);background:var(--ink-2);
  border:1px solid var(--line);border-radius:10px;padding:.7rem .85rem;width:100%}
input::placeholder{color:#A89681}
code{background:var(--ink-2);padding:.05rem .3rem;border-radius:5px;font-size:.88em}

.wrap{max-width:1040px;margin:0 auto;padding:1.1rem 1.1rem 6.4rem}
.topbar{display:flex;align-items:center;gap:.45rem;padding:.55rem 0 1rem;flex-wrap:nowrap;min-width:0;width:100%}
.topbar .spacer{flex:1 1 auto;min-width:.2rem}
.logo span:not(.mark){white-space:nowrap}
@media (max-width:640px){
  .logo{font-size:0}
  .logo .mark{font-size:1rem}
  .wikitag span{display:none}
}
.logo{cursor:pointer;background:none;border:none;color:var(--text);padding:0;display:flex;align-items:center;gap:.55rem;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.15rem}
.logo .mark{width:26px;height:34px;border-radius:4px;
  background:linear-gradient(150deg,var(--brass) 0%,#7A5A17 55%,#D8A53F 100%);
  box-shadow:0 0 0 1px #000 inset, 3px 3px 0 0 rgba(0,0,0,.35);transform:rotate(-7deg)}
.spacer{flex:1}
.purse{flex:none;display:flex;align-items:center;gap:.3rem;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:.3rem .7rem;font-weight:600;white-space:nowrap}
@media (max-width:720px){.purse small{display:none}}
.purse b{color:var(--brass)}
.purse.mana b{color:#7FD0C2}
.purse small{color:var(--muted);font-size:.72rem}
.me{flex:0 1 auto;min-width:0;display:inline-flex;align-items:center;gap:.45rem;background:var(--ink-2);border:1px solid var(--line);
  color:var(--text);border-radius:999px;padding:.2rem .7rem .2rem .2rem;cursor:pointer;font-weight:600;font-size:.9rem;
  max-width:150px;overflow:hidden;white-space:nowrap}
.me #mename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .pic{width:26px;height:26px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;
  background:#41362C;color:var(--muted);font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:.8rem}
.me .pic img{width:100%;height:100%;object-fit:cover}
.wikitag{display:inline-flex;align-items:center;gap:.4rem;background:var(--ink-2);border:1px dashed var(--line);
  border-radius:999px;padding:.25rem .7rem;font-size:.85rem;color:var(--muted);cursor:pointer}

/* ---------- cartes ---------- */
.card{
  --g1:#B9AC9E; --g2:#6E6155; --glow:0 0 0 rgba(0,0,0,0);
  position:relative;border-radius:15px;padding:5px;display:flex;
  aspect-ratio:63/88;                       /* format d'une carte à jouer */
  overflow:hidden;
  background-image:linear-gradient(158deg,var(--g1) 0%,var(--g2) 52%,var(--g1) 100%);
  box-shadow:0 14px 26px -18px #000, var(--glow);
}
@keyframes sweep{0%{transform:translateX(-60%)}60%,100%{transform:translateX(60%)}}
.card::before{
  content:"";position:absolute;inset:-55% -25%;z-index:4;pointer-events:none;
  background:linear-gradient(100deg,transparent 43%,#ffffff2e 50%,transparent 57%);
  animation:sweep 4.6s ease-in-out infinite
}
.card[data-r="Super rare"]::before{background:linear-gradient(100deg,transparent 43%,#ffffff45 50%,transparent 57%);animation-duration:4s}
.card[data-r="Ultra rare"]::before{background:linear-gradient(100deg,transparent 43%,#ffffff52 50%,transparent 57%);animation-duration:3.6s}
.card[data-r="Légendaire"]::before{background:linear-gradient(100deg,transparent 41%,#FFF3C866 50%,transparent 59%);animation-duration:3.1s}
@media (prefers-reduced-motion:reduce){.card::before{animation:none;opacity:.25}}
.card .inner{border-radius:11px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-width:0;
  background:#221D1A}
.card .art{position:relative;background:#262120;overflow:hidden;flex:1;min-height:0}
.card .art img{width:100%;height:100%;object-fit:cover;display:block}
.card .noart{width:100%;height:100%;display:grid;place-items:center;font-size:2.6rem;
  font-family:"Bricolage Grotesque",sans-serif;color:var(--g2);opacity:.45;
  background:linear-gradient(160deg,#F2F3F6,#D9DBE3)}
.card .gem{
  position:absolute;top:7px;left:7px;z-index:3;min-width:26px;height:26px;padding:0 .32rem;
  border-radius:8px;display:grid;place-items:center;
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:.78rem;color:#FFFFFF;
  background:linear-gradient(150deg,var(--g1),var(--g2));
  box-shadow:0 3px 8px -3px #000A, inset 0 0 0 1.5px #FFFFFF88;
  text-shadow:0 1px 2px #0006
}
.card .dupe{
  position:absolute;top:7px;right:7px;z-index:3;height:26px;padding:0 .45rem;border-radius:8px;
  display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:.78rem;
  color:#14161A;background:#FFFFFFEE;box-shadow:0 3px 8px -3px #0009, inset 0 0 0 1.5px #00000018
}
.card .body{
  padding:.5rem .6rem .55rem;display:flex;flex-direction:column;gap:.1rem;flex:none;
  background:linear-gradient(180deg,var(--t1),var(--t2));
  backdrop-filter:blur(18px) saturate(1.2); -webkit-backdrop-filter:blur(18px) saturate(1.2);
  border-top:1px solid #ffffff26
}
.card .univ{font-size:.64rem;color:var(--g1);font-weight:700;text-shadow:0 1px 2px #0008}
.card .name{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:.95rem;line-height:1.12;
  color:#FFFFFF;text-shadow:0 1px 3px #000A}
.card .desc{font-size:.71rem;line-height:1.3;color:#FFFFFFD4;text-shadow:0 1px 3px #0009;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.card .band{
  display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  padding:.42rem .6rem;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:.92rem;
  color:#120F06;background:linear-gradient(110deg,var(--g1) 0%,var(--g2) 55%,var(--g1) 100%);
  flex:none;
  box-shadow:inset 0 1px 0 #FFFFFF55
}
.card .band span{display:inline-flex;align-items:center;gap:.28rem}
.card .band .i{font-size:.9em}
.card .band .atk .i{color:#B4241C}
.card .band .def .i{color:#1E5C58}

.card{--t1:rgba(74,84,106,.72);--t2:rgba(38,45,62,.82)}
.card[data-r="Commun"]      {--g1:#CFC3B4;--g2:#8C7F71;--t1:rgba(92,80,68,.70);--t2:rgba(38,32,27,.86)}
.card[data-r="Peu commun"]  {--g1:#A8DCC4;--g2:#3E7A52;--t1:rgba(44,96,62,.70);--t2:rgba(16,38,25,.88)}
.card[data-r="Rare"]        {--g1:#8FD8CB;--g2:#2F7A70;--glow:0 0 18px -10px #4FB3A5;--t1:rgba(28,92,84,.70);--t2:rgba(12,34,31,.88)}
.card[data-r="Super rare"]  {--g1:#EFB6CE;--g2:#8E4A6C;--glow:0 0 22px -9px #C77FA8;--t1:rgba(122,58,90,.72);--t2:rgba(46,20,34,.88)}
.card[data-r="Ultra rare"]  {--g1:#F5B48F;--g2:#B4552C;--glow:0 0 26px -9px #E2754C;--t1:rgba(146,64,30,.72);--t2:rgba(54,22,10,.88)}
.card[data-r="Légendaire"]  {--g1:#FFE39A;--g2:#B98514;--glow:0 0 34px -8px #E8B44C;--t1:rgba(150,106,14,.74);--t2:rgba(58,38,4,.88)}

/* pellicule holographique à partir de Super rare */
.card[data-r="Super rare"] .art::before,
.card[data-r="Ultra rare"] .art::before,
.card[data-r="Légendaire"] .art::before{
  content:"";position:absolute;inset:-40%;z-index:2;pointer-events:none;opacity:.3;
  background:repeating-linear-gradient(115deg,transparent 0 14px,#ffffff88 14px 18px,transparent 18px 34px);
  mix-blend-mode:overlay;animation:holo 6s linear infinite
}
.card[data-r="Légendaire"] .art::before{opacity:.42;animation-duration:4.2s}
@keyframes holo{0%{transform:translateX(-18%)}50%{transform:translateX(18%)}100%{transform:translateX(-18%)}}
.card[data-r="Légendaire"]{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 14px 26px -18px #000,0 0 26px -12px #E8B44C}
                   50%{box-shadow:0 14px 26px -18px #000,0 0 42px -6px #E8B44C}}
@media (prefers-reduced-motion:reduce){
  .card[data-r] .art::before{animation:none}
  .card[data-r="Légendaire"]{animation:none}
}

/* ---------- finitions spéciales ---------- */

/* Noir — pellicule argentique, contraste dur, cadre acier */
.card[data-v="noir"]{--g1:#DDE0E4;--g2:#17181B;--t1:rgba(16,16,19,.86);--t2:rgba(4,4,6,.94)}
.card[data-v="noir"] .art{background:#0A0A0C}
.card[data-v="noir"] .art img{filter:grayscale(1) contrast(1.4) brightness(.92)}
.card[data-v="noir"] .art::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(115deg,transparent 30%,#ffffff1f 44%,transparent 52%),
             radial-gradient(120% 80% at 50% 0%, transparent 45%, #000000B0 100%)}
.card[data-v="noir"] .body{backdrop-filter:none;border-top:1px solid #ffffff2e}
.card[data-v="noir"] .name{color:#F4F5F7;letter-spacing:.02em;text-shadow:0 1px 3px #000}
.card[data-v="noir"] .univ{color:#9EA3AA}
.card[data-v="noir"] .desc{color:#B9BEC6}
.card[data-v="noir"] .band{background:linear-gradient(110deg,#E6E8EC,#8B8E95 55%,#E6E8EC);color:#101114}
.card[data-v="noir"] .band .atk .i{color:#5A5C60}
.card[data-v="noir"] .band .def .i{color:#2E3034}
.card[data-v="noir"] .gem{background:linear-gradient(150deg,#EDEFF2,#4A4C52);color:#101114;text-shadow:none}

/* Vintage — papier jauni, encre brune, coins usés */
.card[data-v="vintage"]{--g1:#E8CF9A;--g2:#7A5A24}
.card[data-v="vintage"] .art{background:#D9C9A6}
.card[data-v="vintage"] .art img{filter:sepia(.85) saturate(1.15) contrast(.92) brightness(1.04)}
.card[data-v="vintage"] .art::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(0deg,#00000012 0 2px,transparent 2px 4px),
             radial-gradient(120% 90% at 50% 40%, transparent 42%, #6A4A1E66 100%);
  mix-blend-mode:multiply}
.card[data-v="vintage"] .body{background:linear-gradient(180deg,#F3E6C8,#E2D0A8);backdrop-filter:none;
  border-top:2px solid #B08E4E}
.card[data-v="vintage"] .name{color:#33240F;text-shadow:none}
.card[data-v="vintage"] .univ{color:#8A6620}
.card[data-v="vintage"] .desc{color:#6B5430;text-shadow:none}
.card[data-v="vintage"] .band{background:linear-gradient(110deg,#DCC48C,#A8883F 55%,#DCC48C);color:#2E2109;
  box-shadow:inset 0 1px 0 #FFF6D8}
.card[data-v="vintage"] .band .atk .i{color:#8A2A18}
.card[data-v="vintage"] .band .def .i{color:#3A4A2A}
.card[data-v="vintage"] .gem{background:linear-gradient(150deg,#F0DCA8,#8A6A2A);color:#2E2109;text-shadow:none}
.card[data-v="vintage"] .inner{box-shadow:inset 0 0 22px -6px #6A4A1E88}

/* Holographique — prisme mouvant sur l'illustration et le bandeau */
.card[data-v="holo"]{--g1:#B8F0E8;--g2:#8E4A6C;box-shadow:0 14px 26px -18px #000, 0 0 26px -8px #8FD8CB}
.card[data-v="holo"] .art::before{content:"";position:absolute;inset:-40%;z-index:2;pointer-events:none;opacity:.6;
  background:repeating-linear-gradient(115deg,transparent 0 8px,#7FD0C2AA 8px 12px,#E8A8C6AA 12px 16px,
             #F0CE86AA 16px 20px,transparent 20px 32px);
  mix-blend-mode:screen;animation:holo 3.6s linear infinite}
.card[data-v="holo"] .art::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.3;
  background:conic-gradient(from 0deg,#7FD0C2,#E8A8C6,#F0CE86,#8FD8CB,#7FD0C2);
  mix-blend-mode:color-dodge;animation:aura 9s linear infinite}
.card[data-v="holo"] .band{background:linear-gradient(110deg,#8FD8CB,#E8A8C6 40%,#F0CE86 70%,#8FD8CB);color:#171214}
.card[data-v="holo"] .gem{background:linear-gradient(150deg,#F6F0D0,#8E4A6C);box-shadow:0 0 12px 2px #E8A8C688}

/* Full Art — l'illustration occupe toute la carte, le texte flotte par-dessus */
.card[data-v="fullart"]{--g1:#FFE9B0;--g2:#7A5A18}
.card[data-v="fullart"] .inner{position:relative;justify-content:flex-end}
.card[data-v="fullart"] .art{position:absolute;inset:0;flex:none;z-index:0}
.card[data-v="fullart"] .art img{width:100%;height:100%;object-fit:cover}
.card[data-v="fullart"] .art::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 36%,#0B0806D9 76%,#0B0806F5 100%)}
.card[data-v="fullart"] .body{position:relative;z-index:2;background:transparent;backdrop-filter:none;
  border-top:none;padding-bottom:.12rem}
.card[data-v="fullart"] .name{font-size:1.05rem;text-shadow:0 2px 10px #000,0 1px 2px #000}
.card[data-v="fullart"] .desc{text-shadow:0 1px 6px #000}
.card[data-v="fullart"] .band{position:relative;z-index:2;background:transparent;color:#FFE9B0;
  box-shadow:none;border-top:1px solid #FFE9B04D;text-shadow:0 1px 6px #000}
.card[data-v="fullart"] .band .atk .i{color:#FF9A80}
.card[data-v="fullart"] .band .def .i{color:#8FD8CB}
.card[data-v="fullart"] .gem{z-index:4}

/* Secret — carte sombre, aura prismatique et poussière d'étoiles */
.card[data-v="secret"]{--g1:#FFF2C0;--g2:#2A1C48;--t1:rgba(28,16,44,.82);--t2:rgba(8,4,16,.94);
  box-shadow:0 14px 26px -18px #000, 0 0 40px -8px #C77FA8}
.card[data-v="secret"] .art{background:#0A0612}
.card[data-v="secret"] .art img{filter:saturate(.75) brightness(.72) contrast(1.15)}
.card[data-v="secret"] .art::before{content:"";position:absolute;inset:-40%;z-index:2;pointer-events:none;opacity:.5;
  background:conic-gradient(from 0deg,#C77FA8,#F0CE86,#7FD0C2,#9A5480,#C77FA8);
  mix-blend-mode:color-dodge;animation:aura 7s linear infinite}
.card[data-v="secret"] .art::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(circle at 22% 78%, #FFF2C0AA 0 1.5px, transparent 2px),
             radial-gradient(circle at 68% 62%, #F3CFE2AA 0 1.5px, transparent 2px),
             radial-gradient(circle at 44% 28%, #7FD0C2AA 0 1.5px, transparent 2px),
             radial-gradient(circle at 82% 34%, #FFF2C099 0 1.5px, transparent 2px);
  animation:twinkle 2.4s ease-in-out infinite}
.card[data-v="secret"] .name{color:#FFE9B0;text-shadow:0 0 12px #C77FA8,0 1px 3px #000}
.card[data-v="secret"] .univ{color:#E8A8C6}
.card[data-v="secret"] .band{background:linear-gradient(110deg,#FFF2C0,#9A5480 55%,#FFF2C0);color:#1B0F20}
.card[data-v="secret"] .gem{background:linear-gradient(150deg,#FFF2C0,#7A3A60);box-shadow:0 0 16px 3px #C77FA8}

/* étiquette de finition */
.vtag{position:absolute;left:6px;top:32px;z-index:5;font-size:.55rem;font-weight:800;letter-spacing:.05em;
  font-family:"Bricolage Grotesque",sans-serif;background:#120E0CD9;border:1px solid var(--g1);
  border-radius:5px;padding:.08rem .34rem;color:var(--g1);text-transform:uppercase;
  box-shadow:0 0 10px -3px var(--g1)}
.card[data-v="std"] .vtag{display:none}
.card[data-v="vintage"] .vtag{background:#F3E6C8;color:#5A4218;border-color:#A8883F;box-shadow:none}
.card[data-v="noir"] .vtag{background:#0C0C0E;color:#E6E8EC;border-color:#8B8E95}
.card.compact .vtag{top:26px;font-size:.48rem}

.card .stars{position:absolute;left:6px;bottom:6px;z-index:4;font-size:.72rem;color:#FFE39A;
  text-shadow:0 0 8px #FFD36A,0 1px 2px #000;letter-spacing:1px}
.card.st1{box-shadow:0 14px 26px -18px #000, 0 0 16px -8px #FFD36A}
.card.st2{box-shadow:0 14px 26px -18px #000, 0 0 26px -6px #FFD36A}
.card.st3{box-shadow:0 14px 26px -18px #000, 0 0 40px -4px #FFD36A;animation:starglow 2.6s ease-in-out infinite}
@keyframes starglow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
.card.st1 .art::after,.card.st2 .art::after,.card.st3 .art::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(circle at 20% 80%, #FFE39A55 0 2px, transparent 3px),
             radial-gradient(circle at 70% 60%, #FFE39A44 0 2px, transparent 3px),
             radial-gradient(circle at 45% 30%, #FFE39A33 0 2px, transparent 3px);
  animation:twinkle 3s ease-in-out infinite}
.card.st3 .art::after{background-size:120% 120%;opacity:.9;animation-duration:1.8s}
@keyframes twinkle{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:.7rem;align-items:start}
.card.compact{padding:4px;border-radius:12px}
.card.compact .inner{border-radius:9px}
.card.compact .body{padding:.32rem .4rem .34rem;gap:0}
.card.compact .univ{font-size:.58rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.compact .name{font-size:.74rem;line-height:1.1;-webkit-line-clamp:2;display:-webkit-box;
  -webkit-box-orient:vertical;overflow:hidden}
.card.compact .gem{width:19px;height:19px;min-width:19px;font-size:.6rem;border-radius:6px;top:4px;left:4px}
.card.compact .dupe{height:19px;font-size:.62rem;padding:0 .3rem;border-radius:6px;top:4px;right:4px}
.card.compact .band{font-size:.66rem;padding:.24rem .36rem;gap:.2rem}

.packstage{display:grid;place-items:center;gap:1.1rem;padding:1.2rem 0;position:relative}

  background:repeating-linear-gradient(0deg,#00000040 0 2px,transparent 2px 5px);opacity:.45}

.packart::after{content:"";position:absolute;inset:-60% -25%;
  background:linear-gradient(100deg,transparent 42%,#ffffff2e 50%,transparent 58%);
  animation:sweep 3.6s ease-in-out infinite;pointer-events:none}
.packart .seal{width:104px;height:104px;border-radius:50%;position:relative;z-index:2;
  background:radial-gradient(circle at 34% 28%,#FBE29B,#C3922A 55%,#6E4E0B);
  box-shadow:0 10px 22px -10px #000, inset 0 0 0 3px #ffffff3d, 0 0 34px -6px #E8B44C99;

}

.flip{perspective:1000px;aspect-ratio:63/88;cursor:pointer}

/* ---- Reliques : artefacts légendaires ---- */
.card[data-r="Relique"]{
  --g1:#FFF2B8;--g2:#C08E12;--t1:rgba(126,86,6,.68);--t2:rgba(42,26,0,.9);--aura:#FFD36A;--spark:#FFD36A;
  box-shadow:0 14px 26px -18px #000, 0 0 52px -6px var(--aura);
  animation:relic 3s ease-in-out infinite
}
@keyframes relic{
  0%,100%{box-shadow:0 14px 26px -18px #000, 0 0 38px -10px var(--aura)}
  50%{box-shadow:0 14px 26px -18px #000, 0 0 78px 2px var(--aura)}
}
.card[data-r="Relique"] .art::before{
  content:"";position:absolute;inset:-40%;z-index:2;pointer-events:none;opacity:.5;
  background:conic-gradient(from 0deg, transparent 0deg, var(--aura) 60deg, transparent 130deg,
             var(--spark) 210deg, transparent 280deg, var(--aura) 330deg, transparent 360deg);
  animation:aura 7s linear infinite;mix-blend-mode:screen
}
@keyframes aura{to{transform:rotate(360deg)}}
.card[data-r="Relique"]::before{
  background:linear-gradient(100deg,transparent 38%,#FFFFFF8C 50%,transparent 62%);animation-duration:2.4s}
.card[data-r="Relique"] .gem{box-shadow:0 0 14px 2px var(--aura), inset 0 0 0 1.5px #fff8}
.card[data-r="Relique"] .art{background:#07070A}
.card[data-r="Relique"] .name{text-shadow:0 0 14px var(--aura), 0 1px 3px #000C}

.sparks{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.sparks i{position:absolute;bottom:-10px;font-style:normal;font-size:.74rem;line-height:1;color:var(--spark);
  text-shadow:0 0 10px var(--aura), 0 0 3px #ffffff88;animation:floatUp linear infinite}
.sparks.fall i{bottom:auto;top:-10px;animation-name:floatDown;text-shadow:0 0 10px var(--aura)}
@keyframes floatUp{
  0%{transform:translateY(0) scale(.6) rotate(0);opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-170px) scale(1.15) rotate(25deg);opacity:0}
}
@keyframes floatDown{
  0%{transform:translateY(0) scale(.7) rotate(0);opacity:0}
  15%{opacity:.95}
  100%{transform:translateY(180px) scale(1.05) rotate(-20deg);opacity:0}
}
@media (prefers-reduced-motion:reduce){
  .card[data-r="Relique"],.card[data-r="Relique"] .art::before,.sparks i{animation:none}
  .sparks{display:none}
}

.burst{position:fixed;inset:0;pointer-events:none;z-index:70;display:grid;place-items:center}

@keyframes blow{from{transform:scale(.2);opacity:.75}to{transform:scale(1.15);opacity:0}}
.rarecall{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:71;pointer-events:none;

.catrow .got{color:#7FD0B4;font-weight:700;font-size:.82rem;white-space:nowrap}

.pill{font-size:.7rem;font-weight:800;padding:.1rem .4rem;border-radius:6px;color:#1A1614;font-family:"Bricolage Grotesque",sans-serif}
.catsec{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:.8rem 1rem;margin-bottom:.8rem}
.catsec h3{font-size:1rem;display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.catsec .prog{margin-left:auto;font-size:.85rem;color:var(--muted);font-weight:400;font-family:"Karla",sans-serif}

/* atelier (clicker) */
.forge{display:grid;place-items:center;gap:.5rem;padding:.6rem 0 1rem}
.bigclick{width:190px;height:190px;border-radius:50%;border:none;cursor:pointer;position:relative;
  background:radial-gradient(circle at 34% 26%,#FFE9A8,#F2A93B 46%,#C9671A 100%);
  box-shadow:0 20px 36px -20px #000, inset 0 0 0 4px #ffffff3d, inset 0 -16px 34px -12px #0009;
  font-size:4.6rem;line-height:1;color:#C0202A;text-shadow:0 2px 4px #0004;
  display:grid;place-items:center;transition:transform .08s ease}
.bigclick:active{transform:scale(.94)}
.float{position:absolute;pointer-events:none;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  color:var(--brass);text-shadow:0 2px 6px #000;animation:rise .9s ease-out forwards;z-index:50}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-60px) scale(1.25)}}
.machine{background:linear-gradient(140deg,#32281F,#221D1A);border:1px solid #5C4A36;border-radius:var(--radius);
  padding:1rem;margin:0 0 1rem;position:relative;overflow:hidden}
.machine::before{content:"";position:absolute;inset:-50% -20%;
  background:linear-gradient(100deg,transparent 44%,#8FD8CB22 50%,transparent 56%);animation:sweep 5s ease-in-out infinite;pointer-events:none}
.machine h3{font-size:1.05rem}
.machine .dial{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 35% 30%,#6FA89C,#2E3A36);color:#DFF3EE;
  box-shadow:inset 0 0 0 2px #ffffff22;animation:spin 6s linear infinite}
@media (prefers-reduced-motion:reduce){.machine::before,.machine .dial{animation:none}}
.up{display:flex;align-items:center;gap:.7rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
.up:last-child{border-bottom:none}
.up .n{font-weight:700}
.up .d{font-size:.82rem;color:var(--muted)}
.up .lv{margin-left:auto;text-align:right;white-space:nowrap}

/* profil */
.lvlbadge{display:inline-block;padding:.12rem .55rem;border-radius:999px;font-size:.8rem;font-weight:800;
  font-family:"Bricolage Grotesque",sans-serif;color:#221806;background:linear-gradient(120deg,#F0CE86,#C08F2A)}
.lvlbar{height:6px;border-radius:4px;background:var(--ink-2);border:1px solid var(--line);margin-top:.35rem;overflow:hidden;max-width:280px}
.lvlbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),#F0CE86)}
.titletag{display:inline-block;margin-top:.25rem;padding:.1rem .55rem;border-radius:999px;font-size:.8rem;
  font-weight:700;color:#1A1305;background:linear-gradient(120deg,var(--brass),#C08F2A)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.9rem}
@media (max-width:520px){.statgrid{grid-template-columns:repeat(2,1fr)}}
.statgrid .st{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:.5rem .6rem;text-align:center}
.statgrid .st b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.25rem;color:var(--brass)}
.statgrid .st span{font-size:.74rem;color:var(--muted)}
/* fond de profil pleine largeur, à la manière de Steam :
   l'illustration s'étale d'un bord à l'autre de l'écran, en miroir à droite */
.pstage{position:absolute;left:50%;transform:translateX(-50%);width:100vw;max-width:100vw;height:330px;
  margin-top:-1.1rem;pointer-events:none;z-index:0;overflow:hidden}
.pstage .pb{position:absolute;top:0;bottom:0;width:50vw;background-position:center 22%;
  background-size:cover;background-repeat:no-repeat;filter:saturate(1.05)}
.pstage .pb.l{left:0}
.pstage .pb.r{left:50vw;transform:scaleX(-1)}
.pstage .pveil{position:absolute;inset:0;
  background:linear-gradient(90deg,#201B1800 0%,#201B1866 26%,#201B18E6 50%,#201B1866 74%,#201B1800 100%),
             linear-gradient(180deg,#201B1899 0%,#201B1833 38%,#201B18F2 100%)}
#view{position:relative}
.profilehead{position:relative;z-index:2;min-height:150px}
.profilehead.hasbanner{background:#2F2926CC;backdrop-filter:blur(10px);border-color:#ffffff26}
.avatar.halo1{box-shadow:0 0 14px -2px #E8B44C66}
.avatar.halo2{box-shadow:0 0 22px 0 #E8B44C99, 0 0 0 1px #E8B44C55}
.avatar.halo3{box-shadow:0 0 30px 2px #E8B44CCC, 0 0 0 2px #E8B44C88;animation:halopulse 3.2s ease-in-out infinite}
@keyframes halopulse{0%,100%{box-shadow:0 0 26px 0 #E8B44CAA, 0 0 0 2px #E8B44C77}
                     50%{box-shadow:0 0 40px 4px #E8B44CE6, 0 0 0 2px #E8B44CAA}}
@media (prefers-reduced-motion:reduce){.avatar.halo3{animation:none}}
.avatar{position:relative;z-index:2;width:92px;height:92px;border-radius:50%;flex:none;overflow:hidden;background:var(--ink-2);
  border:3px solid var(--brass);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800;font-size:2rem;color:var(--muted)}
.avatar img{width:100%;height:100%;object-fit:cover}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
@media (max-width:560px){.slots{grid-template-columns:repeat(3,1fr)}}
.slot{aspect-ratio:63/88;border-radius:14px;border:2px dashed var(--line);background:#2F2926;
  display:grid;place-items:center;color:#8F7F6C;font-size:1.6rem;cursor:pointer;position:relative;overflow:hidden}
.slot.full{display:block;border:none;padding:0;background:none}
.slot.full .card{width:100%;height:100%}
.slot .x{position:absolute;top:4px;right:4px;z-index:6;width:22px;height:22px;border-radius:50%;
  background:#1A1614CC;color:#fff;display:grid;place-items:center;font-size:.8rem;border:1px solid #ffffff33}

/* village */
.vfound{text-align:center;background:linear-gradient(140deg,#332A22,#241E1A);border:1px dashed #7A6244;
  border-radius:var(--radius);padding:1.2rem 1rem}
.vscene{position:relative;height:118px;margin:0 auto .8rem;max-width:320px}
.vscene .hut{position:absolute;bottom:14px;width:0;height:0;border-left:34px solid transparent;
  border-right:34px solid transparent;border-bottom:40px solid #6A5238}
.vscene .hut::after{content:"";position:absolute;left:-22px;top:40px;width:44px;height:30px;background:#4A3A28;
  box-shadow:inset 0 0 0 1px #2A2018}
.vscene .h1{left:22px}
.vscene .h2{left:118px;transform:scale(1.25)}
.vscene .h3{right:22px;transform:scale(.85)}
.vscene .smoke{position:absolute;left:150px;top:6px;width:8px;height:8px;border-radius:50%;
  background:#C6B7A855;box-shadow:0 -14px 0 -1px #C6B7A844, 0 -26px 0 -2px #C6B7A833;
  animation:smoke 4s ease-in-out infinite}
@keyframes smoke{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-8px);opacity:.35}}

.vhead{position:relative;border-radius:var(--radius);overflow:hidden;margin-bottom:1rem;
  border:1px solid var(--line)}
.vbanner{height:96px;background:
  linear-gradient(180deg,#00000000,#1A1614EE),
  repeating-linear-gradient(90deg,#4A3A28 0 28px,#3E3022 28px 56px),
  linear-gradient(#5A4630,#2E2418)}
.vtitle{padding:.7rem 1rem 1rem;margin-top:-2.4rem;position:relative}
.vtitle h2{font-size:1.5rem;text-shadow:0 2px 10px #000}

.shop{--sa:#E8B44C;--sb:#5A4418;position:relative;margin-bottom:.9rem;border-radius:var(--radius);
  border:1px solid color-mix(in srgb,var(--sa) 40%,#000);overflow:hidden;
  background:linear-gradient(140deg,color-mix(in srgb,var(--sa) 14%,#241E1A),var(--sb))}
.shop::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,#00000022 0 18px,transparent 18px 36px);opacity:.35}
.shead{position:relative;display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem .3rem}
.sface{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;
  background:linear-gradient(150deg,var(--sa),color-mix(in srgb,var(--sa) 45%,#000));color:#1A1206;
  box-shadow:inset 0 0 0 2px #ffffff33, 0 6px 14px -8px #000}
.sname{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.02rem}
.strade{font-size:.78rem;color:#E8DCC8;opacity:.75}
.sline{position:relative;margin:.2rem 1rem .6rem;font-style:italic;color:#EFE3D2;opacity:.85;font-size:.86rem}
.slist{position:relative;padding:0 .7rem .8rem}
.srow{display:flex;align-items:center;gap:.6rem;padding:.42rem .3rem;border-top:1px solid #ffffff14}
.sicon{width:28px;height:28px;flex:none;display:grid;place-items:center;font-size:1rem}
.stxt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.stxt b{font-size:.88rem}
.stxt small{color:#E8DCC8;opacity:.7;font-size:.74rem}
@media (max-width:700px){
  .shead{padding:.7rem .7rem .2rem}
  .sline{margin:.2rem .7rem .5rem;font-size:.82rem}
  .slist{padding:0 .45rem .7rem}
  .srow{gap:.45rem;padding:.4rem .2rem}
  .stxt b{font-size:.82rem}
  .stxt small{font-size:.7rem}
  .sface{width:40px;height:40px;font-size:1.2rem}
  .vbanner{height:76px}
}

/* chantier */
.worksite{background:linear-gradient(140deg,#352C26,#221D1A);border:1px dashed #E8B44C66;border-radius:var(--radius);
  padding:1.2rem;text-align:center;position:relative;overflow:hidden}
.worksite::before{content:"";position:absolute;inset:0;opacity:.14;
  background:repeating-linear-gradient(45deg,#E8B44C 0 18px,transparent 18px 36px);pointer-events:none}
.siteclip{width:min(360px,92%);border-radius:14px;position:relative;z-index:2;display:block;margin:0 auto .4rem;
  box-shadow:0 14px 28px -18px #000}
.siteclip + .crane{display:none}
.crane{width:min(340px,86%);height:auto;position:relative;z-index:2}
.crane .swing{transform-origin:101px 30px;animation:craneswing 5s ease-in-out infinite}
.crane .load{animation:craneload 5s ease-in-out infinite}
@keyframes craneswing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes craneload{0%,100%{transform:translateY(0)}50%{transform:translateY(16px)}}
.crane .sparks2 circle{animation:sp 1.4s ease-out infinite}
.crane .sparks2 circle:nth-child(2){animation-delay:.45s}
.crane .sparks2 circle:nth-child(3){animation-delay:.9s}
@keyframes sp{0%{opacity:0;transform:translate(0,0) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-22px) scale(1)}}
.soonlist{display:grid;gap:.4rem;max-width:420px;margin:0 auto;position:relative;z-index:2}
@media (prefers-reduced-motion:reduce){.crane .swing,.crane .load,.crane .sparks2 circle{animation:none}}

/* objets */
.item{--ia:#D8CFC2;--ib:#2E2721;--rk:#B9AC9E;position:relative;width:100%;aspect-ratio:1/1;
  clip-path:polygon(14% 0,86% 0,100% 14%,100% 86%,86% 100%,14% 100%,0 86%,0 14%);
  background:linear-gradient(160deg,color-mix(in srgb,var(--ia) 20%,#221D1A),#191512 62%);
  display:grid;place-items:center;overflow:hidden;
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rk) 55%,transparent), 0 8px 16px -12px #000}
.item::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 118%, color-mix(in srgb,var(--rk) 40%, transparent), transparent 60%);pointer-events:none}
.item .grid4{position:absolute;inset:0;opacity:.35;
  background:repeating-linear-gradient(0deg,#ffffff0d 0 1px,transparent 1px 7px),
             repeating-linear-gradient(90deg,#ffffff0d 0 1px,transparent 1px 7px)}
.item .pic{position:relative;z-index:2;width:64%;height:64%;display:grid;place-items:center}
.isvg{width:100%;height:100%;filter:drop-shadow(0 2px 5px #000b)}
.item .n{position:absolute;right:6px;bottom:4px;z-index:3;font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800;font-size:.8rem;color:#fff;text-shadow:0 1px 3px #000,0 0 8px #000}
.item .rk{position:absolute;left:6px;top:6px;z-index:3;display:flex;gap:2px}
.item .rk i{width:5px;height:5px;border-radius:1px;transform:rotate(45deg);background:var(--rk);
  box-shadow:0 0 6px color-mix(in srgb,var(--rk) 70%,transparent)}
.item.r4::after{content:"";position:absolute;inset:-40%;
  background:conic-gradient(from 0deg,transparent 0deg,color-mix(in srgb,var(--rk) 60%,transparent) 70deg,transparent 150deg);
  animation:aura 6s linear infinite;mix-blend-mode:screen;opacity:.5}
.item.sel{box-shadow:inset 0 0 0 2px var(--brass), 0 0 18px -4px var(--brass)}
.item.ghost{background:#1A1614;box-shadow:inset 0 0 0 2px #3A302A88;opacity:.5}
.isvgmini{width:26px;height:26px;flex:none;display:inline-grid;place-items:center}
.armpick{display:flex;align-items:center;gap:.5rem;background:var(--ink-2);border:1px solid var(--line);
  color:var(--text);border-radius:11px;padding:.45rem .6rem;text-align:left;cursor:pointer;font-size:.86rem}
.armpick b{font-weight:700}
.armpick small{color:var(--muted);margin-left:auto;white-space:nowrap}
.armpick:disabled{opacity:.45;cursor:not-allowed}
.itemline{display:inline-flex;align-items:center;gap:.4rem;background:var(--ink-2);border:1px solid var(--line);
  border-radius:10px;padding:.3rem .55rem;font-size:.82rem}
.itemline small{color:var(--muted)}
.invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:.6rem}
.istack{cursor:pointer;display:flex;flex-direction:column;gap:.25rem}
.istack.empty{cursor:default}
.istack .lb{font-size:.68rem;color:var(--muted);line-height:1.15;text-align:center;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hotbar{display:grid;grid-template-columns:repeat(8,1fr);gap:.35rem}
@media (max-width:520px){.hotbar{grid-template-columns:repeat(4,1fr)}}
.hslot{aspect-ratio:1/1;border-radius:12px;border:2px dashed #51453C;background:#2C2624;
  display:grid;place-items:center;color:#8F7F6C;font-weight:800;cursor:pointer;position:relative}
.hslot.full{border:none;background:none;padding:0}
.hslot .num{font-family:"Bricolage Grotesque",sans-serif;font-size:.9rem}
.battlebar{display:grid;grid-template-columns:repeat(8,1fr);gap:.35rem;margin-top:.6rem}
@media (max-width:520px){.battlebar{grid-template-columns:repeat(4,1fr)}}
.battlebar .hslot{cursor:pointer}
.battlebar .hslot.off{opacity:.3;pointer-events:none}
.armtag{position:absolute;right:6px;bottom:38px;z-index:5;width:28px;height:28px;border-radius:9px;
  display:grid;place-items:center;background:#1A1614CC;border:1px solid #8FD8A8;
  box-shadow:0 0 12px -2px #6FB394;animation:armpulse 1.4s ease-in-out infinite}
.armtag .isvgmini{width:20px;height:20px}

/* decks *//* decks */
.deck{--a:#E8B44C;--b:#8A6A27;position:relative;overflow:hidden;border-radius:var(--radius);
  border:1px solid color-mix(in srgb, var(--a) 42%, #000);margin-bottom:.75rem;
  background:linear-gradient(135deg, color-mix(in srgb, var(--a) 26%, #1A1614), color-mix(in srgb, var(--b) 42%, #1A1614))}
.deck::before{content:"";position:absolute;inset:-50% -20%;
  background:linear-gradient(100deg,transparent 44%,#ffffff1c 50%,transparent 56%);animation:sweep 5s ease-in-out infinite;pointer-events:none}
.deck .in{position:relative;z-index:2;padding:.85rem 1rem;display:flex;gap:.9rem;align-items:center}
.deck .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.12rem}
.deck .thumbs{display:flex;gap:.2rem;margin-top:.35rem}
.deck .thumbs span{width:20px;height:28px;border-radius:4px;background:#262120 center/cover;border:1px solid #ffffff22;display:block}
.deck.sel{outline:3px solid var(--brass);outline-offset:2px}
.deck[data-pick]{cursor:pointer}

/* la boîte façon deck de jeu de cartes */
.deck .box{position:relative;width:80px;height:108px;flex:none;border-radius:11px;
  background:linear-gradient(150deg,var(--a),var(--b));
  box-shadow:0 10px 20px -12px #000, inset 0 0 0 2px #ffffff33;transform:rotate(-3deg)}
.deck .box .fan{position:absolute;inset:6px -8px 10px 6px;border-radius:9px;z-index:0;
  background:#E9E6DE;box-shadow:6px 0 0 -2px #C9C4B8, 12px 0 0 -4px #A9A498;transform:rotate(5deg)}
.deck .box .cover{position:absolute;inset:5px;border-radius:8px;z-index:1;overflow:hidden;
  background:#262120 center/cover;box-shadow:inset 0 0 0 1px #00000055}
.deck .box .sheen{position:absolute;inset:5px;border-radius:8px;z-index:2;pointer-events:none;
  background:linear-gradient(160deg,#ffffff3d 0 28%,transparent 52%),
             linear-gradient(0deg,color-mix(in srgb, var(--b) 70%, transparent) 0 22%,transparent 55%)}
.deck .box .em{position:absolute;left:-8px;bottom:-8px;z-index:3;width:34px;height:34px;border-radius:11px;
  display:grid;place-items:center;font-size:1.1rem;background:#1A1614;border:2px solid var(--a);
  box-shadow:0 4px 10px -4px #000}
.deck .box .cnt{position:absolute;right:-6px;top:-8px;z-index:3;font-size:.7rem;font-weight:800;
  font-family:"Bricolage Grotesque",sans-serif;background:#1A1614;border:2px solid var(--a);color:var(--a);
  border-radius:999px;padding:.08rem .38rem}
.swatch{width:34px;height:34px;border-radius:9px;border:2px solid transparent;cursor:pointer}
.swatch[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px #000}
.embtn{width:42px;height:42px;border-radius:11px;background:var(--ink-2);border:1px solid var(--line);
  color:var(--text);font-size:1.25rem;cursor:pointer;line-height:1}
.embtn[aria-pressed="true"]{background:var(--brass);border-color:var(--brass)}
@media (prefers-reduced-motion:reduce){.deck::before{animation:none}}

/* campagnes */
.wave{display:flex;align-items:center;gap:.6rem;background:linear-gradient(120deg,#41362C,#241E1A);
  border:1px solid var(--line);border-radius:12px;padding:.55rem .8rem;margin:.6rem 0 .3rem}
.wave .lbl{color:var(--muted);font-size:.9rem}
.wave b{margin-left:auto;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.25rem;color:var(--brass)}
.reroll{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-content:space-between;
  margin-top:1.4rem;padding-top:.8rem;border-top:1px dashed var(--line);opacity:.75}
.camp{border:1px solid #6A4630;border-radius:var(--radius);margin-bottom:.9rem;position:relative;overflow:hidden;
  background:linear-gradient(140deg,#2A1B16,#161018 60%,#31211A);background-size:cover;background-position:center}
.camp.abyss{border-color:#A32A20;
  background:linear-gradient(140deg,#2A0C10,#12060C 58%,#3A0F16);
  box-shadow:0 0 42px -12px #A32A20, inset 0 0 60px -20px #FF5C4066}
.camp.abyss .veil{background:linear-gradient(95deg,#12060CF7 0%,#12060CDE 45%,#2A0C1070 100%)}
.camp.abyss h3{color:#FFB0A0}
.camp.abyss .boss{border-color:#FF5C40;box-shadow:0 0 22px -6px #FF5C40}
.camp.abyss .odds{color:#FF9A80}
.camp.abyss::after{content:"";position:absolute;inset:-40%;pointer-events:none;z-index:1;
  background:conic-gradient(from 0deg,transparent 0deg,#FF3C2044 60deg,transparent 140deg,#FF6A4033 240deg,transparent 320deg);
  animation:aura 9s linear infinite;mix-blend-mode:screen;opacity:.55}
.camp .veil{position:absolute;inset:0;background:linear-gradient(95deg,#1A1614F5 0%,#1A1614D9 45%,#1A161470 100%)}
.camp .content{position:relative;z-index:2;padding:1rem;display:flex;gap:.9rem;align-items:flex-start}
.camp .boss{width:88px;height:110px;border-radius:12px;overflow:hidden;flex:none;border:2px solid #FF9C7A;
  background:#1C1218 center/cover no-repeat;display:grid;place-items:center;color:#6B4B44;font-size:1.6rem;position:relative}
.camp .boss.hasart{color:transparent;box-shadow:0 0 18px -8px #FF9C7A}
.camp .boss img{width:100%;height:100%;object-fit:cover}
.camp .boss span{position:absolute;bottom:0;left:0;right:0;background:#1A1614CC;color:#FFB59C;
  font-size:.62rem;text-align:center;padding:.1rem .2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camp h3{font-size:1.15rem;color:#FFD9AE}
.camp.locked{opacity:.55}
.camp .villain{color:#FF9C7A;font-weight:700}
.camp .meta{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0 .2rem}
.lootline{margin:.5rem 0 .1rem;font-size:.9rem;line-height:1.45;color:#E7DCCF;

/* ---------- donjon : carte vue du dessus, dessinée à plat ---------- */

/* sol des salles : pierre claire, jointoiement à peine marqué */
.dc.room{
  background-color:#A3907A;
  background-image:linear-gradient(#00000010 1px, transparent 1px),
                   linear-gradient(90deg,#00000010 1px, transparent 1px);
  background-size:100% 100%, 100% 100%}
.dc.room.v1{background-color:#AC9880}
.dc.room.v2{background-color:#9C8974}

/* couloirs : même pierre, un ton plus sourd, sans trame */
.dc.cor{background-color:#8E7C66;background-image:none}
.dc.cor.v1{background-color:#93816A}
.dc.cor.v2{background-color:#89785F}
.dc.cor.v3{background-color:#907E68}

/* seuils de porte : pierre claire soulignée d'un liseré chaud */
.dc.door{background-color:#B9A484;
  box-shadow:inset 0 0 0 2px #7A6038}

/* murs : masse sombre et unie, franchement détachée du sol */
.dc.wall{background-color:#2A211A;background-image:none;
  box-shadow:inset 0 0 0 1px #1A140F}
.dc.wall.face{background-color:#332921}

/* quadrillage très léger, juste de quoi lire les cases */
.dc.room::before,.dc.cor::before,.dc.door::before{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 1px #00000016}

/* zones non explorées : brouillard opaque */
.dc.dark{background:#15100C;background-image:none}
.dc.dark::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(circle at 30% 30%, #ffffff06 0 2px, transparent 3px),
                   radial-gradient(circle at 70% 60%, #ffffff05 0 2px, transparent 3px)}
.dc.dark .m{display:none}

/* case accessible */
.dc.near{cursor:pointer}
.dc.near::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 2px #E8B44Ccc}
.dc.near:hover{filter:brightness(1.18)}

/* jetons posés à plat, façon pion de plateau */
.dc .m{width:78%;height:78%;display:block;position:relative;z-index:2}
.dc .m.you{filter:none}
.dc .m.foe,.dc .m.foe.elite,.dc .m.chest,.dc .m.exit,.dc .m.lock,.dc .m.trap,
.dc .m.fire,.dc .m.shrine{filter:none}

  background:#00000033;box-shadow:inset 0 0 0 2px #00000055}
.dc.tok-you::before{background:#E8B44C33;box-shadow:inset 0 0 0 2px #E8B44C}
.dc.tok-foe::before{background:#C4553A33;box-shadow:inset 0 0 0 2px #C4553A}
.dc.tok-elite::before{background:#E8B44C2e;box-shadow:inset 0 0 0 2px #E8B44C, 0 0 0 1px #C4553A}
.dc.tok-chest::before{background:#8A6A2A2e;box-shadow:inset 0 0 0 2px #B08A3A}
.dc.tok-exit::before{background:#4FB3A52e;box-shadow:inset 0 0 0 2px #4FB3A5}

/* dalle piégée : tressaillement à peine perceptible */
.dc.rigged{animation:rig 7s ease-in-out infinite}
.dc.rigged:nth-child(3n){animation-delay:2.3s;animation-duration:8.5s}

  ["Super rare",  0.150],

];

/* Filet de sécurité : une Rare ou mieux garantie si aucune depuis PITY paquets. */
function rollRarity(kind){
  const table = kind === "mythic" ? ODDS_MYTHIC : kind === "demon" ? ODDS_DEMON : ODDS;
  let r = Math.random(), acc = 0;
  for(const [name,p] of table){ acc += p; if(r <= acc) return name; }
  return table[0][0];
}
function rollRarityMin(min){
  const i = RARITIES.indexOf(min);
  const sub = ODDS.filter(([n])=>RARITIES.indexOf(n) >= i);
  const tot = sub.reduce((s,[,p])=>s+p,0);
  let r = Math.random()*tot, acc = 0;
  for(const [name,p] of sub){ acc += p; if(r <= acc) return name; }
  return min;
}

/* ---------- stockage ---------- */
/* espace de sauvegarde unique */
function acct(){ return "invite"; }

const HAS_WS = typeof window.storage === "object" && window.storage && typeof window.storage.get === "function";
const SANDBOX = HAS_WS;            // artefact Claude : réseau externe bloqué
const memStore = {};
function lsKey(k,s){ return s ? ("fm-shared:"+k) : ("fm-local:"+acct()+":"+k); }
function wsKey(k,s){ return s ? k : (acct()+"/"+k); }
async function sget(key, shared=false){
  try{
    if(HAS_WS){ const r = await window.storage.get(wsKey(key,shared), shared); return r ? JSON.parse(r.value) : null; }
    const v = window.localStorage.getItem(lsKey(key,shared));
    return v ? JSON.parse(v) : (memStore[lsKey(key,shared)] || null);
  }catch(e){ return memStore[lsKey(key,shared)] || null; }
}
async function sset(key, val, shared=false){
  try{
    if(HAS_WS){ await window.storage.set(wsKey(key,shared), JSON.stringify(val), shared); return; }
    window.localStorage.setItem(lsKey(key,shared), JSON.stringify(val));
  }catch(e){ memStore[lsKey(key,shared)] = val; }
}
async function slist(prefix, shared=false){
  try{
    if(HAS_WS){ const r = await window.storage.list(wsKey(prefix,shared), shared); return (r && r.keys) || []; }
    const out=[], p=lsKey(prefix,shared), base=lsKey("",shared).length;
    for(let i=0;i<window.localStorage.length;i++){
      const k = window.localStorage.key(i);
      if(k && k.indexOf(p)===0) out.push(k.slice(base));
    }
    return out;
  }catch(e){ return []; }
}
/* les parties créées avant les comptes sont reprises dans l'espace « invité » */
async function migrateLegacy(){
  const keys = ["fm:profile","fm:col","fm:pool2"];
  for(const k of keys){
    try{
      if(HAS_WS){
        const cur = await window.storage.get(wsKey(k,false), false).catch(()=>null);
        if(cur) continue;
        const old = await window.storage.get(k, false).catch(()=>null);
        if(old) await window.storage.set(wsKey(k,false), old.value, false);
      } else {
        if(window.localStorage.getItem(lsKey(k,false))) continue;
        const old = window.localStorage.getItem("fm-local:"+k);
        if(old) window.localStorage.setItem(lsKey(k,false), old);
      }
    }catch(e){}
  }
}

/* ---------- boosters gratuits ---------- */
function syncFree(){
  const p = state.profile;
  if(typeof p.free !== "number"){ p.free = FREE_MAX; p.freeAt = Date.now(); }
  if(p.free >= FREE_MAX){ p.free = FREE_MAX; p.freeAt = Date.now(); return; }
  if(!p.freeAt) p.freeAt = Date.now();
  const gained = Math.floor((Date.now()-p.freeAt)/FREE_MS);
  if(gained > 0){
    p.free = Math.min(FREE_MAX, p.free + gained);
    p.freeAt = p.free >= FREE_MAX ? Date.now() : p.freeAt + gained*FREE_MS;
  }
}
function freeIn(){
  if(state.profile.free >= FREE_MAX) return 0;
  return Math.max(0, FREE_MS - (Date.now() - state.profile.freeAt));
}
function mmss(ms){
  const t = Math.ceil(ms/1000);
  return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
}
function tick(){
  const before = state.profile.free;
  syncFree();
  const n = document.getElementById("freen"), t = document.getElementById("freet");
  if(n) n.textContent = state.profile.free;
  if(t) t.textContent = state.profile.free >= FREE_MAX ? "plein" : mmss(freeIn());
  if(state.profile.free !== before){
    sset("fm:profile", state.profile);
    if(state.view === "pack" && !state.busy && !state.reveal) viewPack();
  }
  if(state.view === "pack" && !state.busy && !state.reveal) refreshPackUI();
  const cs = state.profile.camps || [];
  if(cs.length && (state.view === "camp" || state.view === "hub")){
    let ended = false;
    cs.forEach(c=>{
      const left = Math.max(0, c.endsAt - Date.now());
      const t = document.querySelector(`[data-left="${c.id}"]`);
      if(t) t.textContent = "Retour dans " + hms(left);
      const h = document.querySelector(`[data-hleft="${c.id}"]`);
      if(h && left > 0) h.textContent = hms(left);
      if(left <= 0 && (t || (h && h.classList.contains("run")))) ended = true;
    });
    if(ended){ state.view === "camp" ? viewCamp() : viewHub(); }
  }
  farmTick();
  state.achTick = (state.achTick||0) + 1;
  if(state.achTick % 4 === 0) checkAch();
}

/* ---------- API Fandom ---------- */
function base(w){ return "https://"+w.host+(w.path||""); }
async function api(params, w, ms=12000){
  const p = new URLSearchParams(Object.assign({format:"json", formatversion:"2", origin:"*"}, params));
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms);
  try{
    const res = await fetch(base(w)+"/api.php?"+p.toString(), {signal:ctrl.signal});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    if(data.error) throw new Error(data.error.info || "erreur API");
    return data;
  } finally { clearTimeout(t); }
}

async function probe(u){
  for(const path of ["/fr",""]){
    const w = {label:u.label, host:u.host, path, cat:u.cat};
    try{
      const d = await api({action:"query", meta:"siteinfo", siprop:"statistics"}, w, 9000);
      const n = d.query && d.query.statistics ? d.query.statistics.articles : 0;
      if(n && n > 150) return Object.assign(w, {articles:n});
    }catch(e){ /* univers suivant */ }
  }
  return null;
}

/* Saisons, épisodes, tomes, chapitres, listes : très liés dans les wikis, donc surclassés à tort.
   Ils restent désormais des cartes ordinaires. */
const FILLER_RE = new RegExp(
  "(^|\\s|\\()(saison|season|épisode|episode|tome|volume|chapitre|chapter|arc|partie|part|liste|list of|série|series)\\s*\\d*(\\)|$|\\s)"
  + "|^(liste|list)\\b|^(19|20)\\d\\d$", "i");
function isFiller(title){
  const t = (title||"").trim();
  return /^\d+$/.test(t) || FILLER_RE.test(t);
}
function capFiller(page, rarity){
  if(!isFiller(page.title)) return rarity;
  return RARITIES.indexOf(rarity) > 1 ? "Peu commun" : rarity;
}

function isRelic(title){
  const t = (title||"").trim().toLowerCase().replace(/\s+/g," ");
  return RELIC_TITLES.has(t);
}

function stripHtml(html){
  const d = document.createElement("div");
  d.innerHTML = html;
  d.querySelectorAll("table,.infobox,.portable-infobox,style,script,sup,.navbox,.toc,figure,aside").forEach(n=>n.remove());
  const p = [...d.querySelectorAll("p")].map(n=>n.textContent.trim()).filter(t=>t.length>40);
  return (p[0]||d.textContent||"").replace(/\s+/g," ").trim();
}

async function drawPages(n, w){
  const data = await api({
    action:"query",
    generator:"random", grnnamespace:"0", grnlimit:String(n),
    prop:"info|categories|images|pageimages|linkshere|extracts",
    inprop:"url", cllimit:"20", imlimit:"20",
    piprop:"thumbnail", pithumbsize:"500",
    lhnamespace:"0", lhlimit:"500",
    exintro:"1", explaintext:"1"
  }, w);
  const pages = (data.query && data.query.pages) || [];
  return pages.filter(p=>!p.missing && !isRelic(p.title) && (p.length||0) > 400);
}

async function enrich(page, w){
  if(page.extract && page.thumbnail) return page;
  try{
    const d = await api({action:"parse", pageid:String(page.pageid), prop:"text", disabletoc:"1"}, w);
    const raw = d.parse && d.parse.text;
    const html = typeof raw === "string" ? raw : (raw && raw["*"]) || "";
    if(html){
      if(!page.extract) page.extract = stripHtml(html);
      if(!page.thumbnail){
        const d2 = document.createElement("div"); d2.innerHTML = html;
        const img = [...d2.querySelectorAll("img")].map(i=>i.getAttribute("data-src")||i.getAttribute("src"))
          .filter(Boolean).find(s=>/\.(jpe?g|png|gif|webp)/i.test(s));
        if(img) page.thumbnail = {source: img.split("/revision/")[0]};
      }
    }
  }catch(e){}
  return page;
}

/* Notoriété : à quel point l'article est central dans son univers.
   Le nombre de pages du wiki qui pointent vers lui est le meilleur signal
   disponible — un héros principal est cité partout, un figurant nulle part. */
function notoriety(page){
  const len = page.length || 0;
  const links = (page.linkshere||[]).length;
  const imgs = (page.images||[]).length;
  const cats = (page.categories||[]).length;
  return links + cats*0.6 + imgs*0.4 + Math.min(len,40000)/8000;
}
/* Seuils calés sur une mesure des liens entrants plafonnée à 500.
   Ils ne servent que de repli quand l'article n'est pas au palmarès du wiki,
   et restent volontairement sévères pour ne pas inonder les tirages de Légendaires. */
function rarityFromNotoriety(n){
  if(n >= 430) return "Légendaire";
  if(n >= 280) return "Ultra rare";
  if(n >= 160) return "Super rare";
  if(n >= 80)  return "Rare";
  if(n >= 26)  return "Peu commun";
  return "Commun";
}

/* un article sans texte ne fait pas une carte */
function hasBody(page){
  const t = (page && page.extract || "").replace(/\s+/g," ").trim();
  return t.length >= 90;
}

function makeCard(page, w, forced){
  const len = page.length || 0;
  const links = (page.linkshere||[]).length;
  const imgs = (page.images||[]).length;
  const cats = (page.categories||[]).length;

  const note = notoriety(page);
  const r = forced || rarityFromNotoriety(note);

  const BANDS_ATK = {
    "Commun":[900,2800], "Peu commun":[2400,4200], "Rare":[4000,5800],
    "Super rare":[5600,7000], "Ultra rare":[6900,8300], "Légendaire":[8400,9700], "Relique":[9999,9999]
  };
  const [lo, hi] = BANDS_ATK[r] || BANDS_ATK["Commun"];
  const t = Math.min(1, Math.log10(Math.max(len,200))/Math.log10(120000));
  const q = Math.min(1, (imgs*0.07 + cats*0.05 + Math.min(links,300)*0.002 + Math.min(len,50000)/50000*0.45));
  const atk = Math.round(lo + t*(hi-lo));
  const def = Math.round(lo + q*(hi-lo));
  const desc = (page.extract||"").split(/(?<=\.)\s/)[0] || (page.extract||"");

  return {
    id: w.host+":"+page.pageid,
    univ: w.label,
    title: page.title,
    url: page.fullurl || (base(w)+"/wiki/"+encodeURIComponent(page.title)),
    desc: desc.slice(0,160),
    text: (page.extract||"").slice(0,2500),
    img: page.thumbnail ? page.thumbnail.source : null,
    rarity:r, atk, def, count:1, note: Math.round(note)
  };
}

let AC = null;
function ac(){
  if(state.profile.mute) return null;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    return AC;
  }catch(e){ return null; }
}
function tone(freq, at, dur, {type="sine", gain=0.14, to=null}={}){
  const a = ac(); if(!a) return;
  const t = a.currentTime + at;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(to) o.frequency.exponentialRampToValueAtTime(to, t+dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}
function noise(at, dur, {gain=0.12, freq=1800, q=0.7, sweep=null}={}){
  const a = ac(); if(!a) return;
  const t = a.currentTime + at;
  const len = Math.max(1, Math.floor(a.sampleRate*dur));
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if(sweep) f.frequency.exponentialRampToValueAtTime(sweep, t+dur);
  const g = a.createGain(); g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t); src.stop(t+dur+0.05);
}

function sfxForRarity(r){
  const i = RARITIES.indexOf(r);

function parseWiki(raw){
  try{
    let s = raw.trim();
    if(!s) return null;
    if(!/^https?:\/\//i.test(s)){
      if(/^[a-z0-9-]+$/i.test(s)) return {label:s, host:s+".fandom.com"};
      s = "https://"+s;
    }
    const u = new URL(s);
    if(!/fandom\.com$|wikia\.org$/i.test(u.hostname)) return null;
    return {label:u.hostname.split(".")[0], host:u.hostname};
  }catch(e){ return null; }
}

/* ---------- réserve d'univers ---------- */
let poolPromise = null;
function ensurePool(){ if(!poolPromise) poolPromise = buildPool(); return poolPromise; }
async function buildPool(){
  const cached = await sget("fm:pool2");
  if(cached && cached.pool && cached.pool.length && (Date.now()-cached.t) < 7*864e5){
    state.pool = cached.pool;
    if(state.view==="hub"||state.view==="pack") render();
    return state.pool;
  }
  // par paquets de huit pour ne pas ouvrir soixante connexions d'un coup
  const res = [];
  for(let i=0;i<UNIVERSES.length;i+=8){
    const batch = await Promise.all(UNIVERSES.slice(i,i+8).map(probe));
    res.push(...batch);
    state.pool = res.filter(Boolean);
    if(state.view === "cat" && !state.catW) viewCatalog();
  }
  state.pool = res.filter(Boolean);
  if(state.pool.length) await sset("fm:pool2", {t:Date.now(), pool:state.pool});
  if(state.view==="hub"||state.view==="pack") render();
  return state.pool;
}

/* ---------- paquets ---------- */
function shuffled(arr){ return [...arr].sort(()=>Math.random()-0.5); }

/* Palmarès des articles les plus cités d'un wiki = les piliers de son lore.
   Mis en cache une semaine par univers. */
async function mostLinked(w){
  const key = "fm:ml2:"+w.host+(w.path||"");
  const c = await sget(key);
  if(c && c.list && c.list.length && (Date.now()-c.t) < 7*864e5) return c.list;
  let list = [];
  for(const page of ["Mostlinked","Mostrevisions"]){
    try{
      const d = await api({action:"query", list:"querypage", qppage:page, qplimit:"500"}, w);
      const rows = (d.query && d.query.querypage && d.query.querypage.results) || [];
      list = rows.filter(r=>r.ns===0 && r.title && !isRelic(r.title) && !isFiller(r.title)
                          && !/\(homonymie\)|disambiguation/i.test(r.title))
                 .map(r=>({t:r.title, v:Number(r.value)||0}));
      if(list.length >= 20) break;
    }catch(e){}
  }
  if(list.length) await sset(key, {t:Date.now(), list});
  return list;
}

/* Rareté d'un article : son poids réel dans l'univers, mesuré en part des liens
   entrants de la page la plus centrale du wiki. Goku ou l'Anneau unique frôlent
   ce sommet et sont donc Légendaires ; un figurant cité trois fois reste Commun. */
const TIER_CUTS = [
  ["Légendaire", 0.34],
  ["Ultra rare", 0.17],
  ["Super rare", 0.085],
  ["Rare",       0.035],
  ["Peu commun", 0.012]
];
/* Un article doit être à la fois proportionnellement central ET réellement très cité :
   sans ce second garde-fou, un figurant d'un petit wiki passait Légendaire. */
const TIER_MIN = {"Légendaire":150, "Ultra rare":80, "Super rare":40, "Rare":15, "Peu commun":5};
function tierOf(v, top){
  if(!top) return "Commun";
  const f = v/top;
  // les petits wikis comptent moins de liens : on adoucit le seuil absolu à leur échelle
  const k = Math.max(0.22, Math.min(1, top/400));
  for(const [rar,cut] of TIER_CUTS) if(f >= cut && v >= TIER_MIN[rar]*k) return rar;
  return "Commun";
}
function tierMap(list){
  const top = list.length ? list[0].v : 0;
  const m = {};
  RARITIES.forEach(r=>m[r] = []);
  list.forEach(e=>m[tierOf(e.v, top)].push(e.t));
  return m;
}

async function pageByTitle(w, title){
  const d = await api({
    action:"query", titles:title,
    prop:"info|categories|images|pageimages|linkshere|extracts",
    inprop:"url", cllimit:"20", imlimit:"20",
    piprop:"thumbnail", pithumbsize:"500",
    lhnamespace:"0", lhlimit:"500",
    exintro:"1", explaintext:"1"
  }, w);
  const p = ((d.query && d.query.pages) || [])[0];
  return (p && !p.missing) ? p : null;
}

/* Tire une carte d'un univers pour une rareté imposée par la table de drop. */
/* Rareté intrinsèque : rang de l'article au palmarès du wiki, sinon sa notoriété brute.
   L'Anneau unique reste Légendaire même s'il sort sur un tirage Commun. */
function intrinsicRarity(page, list){
  if(list && list.length >= 20){
    const top = list[0].v;
    const e = list.find(x=>x.t === page.title);
    if(e) return tierOf(e.v, top);
  }
  // article absent du palmarès : repli prudent, plafonné à Super rare
  const r = rarityFromNotoriety(notoriety(page));
  return RARITIES.indexOf(r) > 3 ? "Super rare" : r;
}
function bestRarity(a, b){ return RARITIES.indexOf(a) >= RARITIES.indexOf(b) ? a : b; }

/* ---------- cartes spéciales : l'icône de chaque univers, déclinée ---------- */
const VARIANTS = [
  {key:"std",     name:"Standard",       w:58},
  {key:"noir",    name:"Noir",           w:20},
  {key:"vintage", name:"Vintage",        w:11},
  {key:"holo",    name:"Holographique",  w:7},
  {key:"fullart", name:"Full Art",       w:3},
  {key:"secret",  name:"Secret",         w:1}
];
const ICONIC = {
  "Zelda":"Link", "Harry Potter":"Harry Potter", "Star Wars":"Dark Vador", "Marvel":"Iron Man",
  "DC":"Batman", "Le Seigneur des Anneaux":"Gandalf", "The Witcher":"Geralt de Riv",
  "The Elder Scrolls":"Dovahkiin", "Minecraft":"Steve", "World of Warcraft":"Arthas Menethil",
  "Game of Thrones":"Daenerys Targaryen", "One Piece":"Monkey D. Luffy", "Naruto":"Naruto Uzumaki",
  "Dragon Ball":"Son Goku", "L'Attaque des Titans":"Eren Jäger", "Death Note":"Light Yagami",
  "My Hero Academia":"All Might", "Demon Slayer":"Tanjiro Kamado", "Jujutsu Kaisen":"Yuji Itadori",
  "Fullmetal Alchemist":"Edward Elric", "Bleach":"Ichigo Kurosaki", "Hunter × Hunter":"Gon Freecss",
  "Berserk":"Guts", "Akira":"Tetsuo Shima", "Pokémon":"Pikachu", "Fallout":"Vault Boy",
  "Mass Effect":"Shepard", "Halo":"Master Chief", "Doom":"Doom Slayer", "Sonic":"Sonic",
  "Super Mario":"Mario", "Metroid":"Samus Aran", "Resident Evil":"Leon S. Kennedy",
  "Dark Souls":"Chevalier Artorias", "Elden Ring":"Malenia", "Cyberpunk 2077":"Johnny Silverhand",
  "Assassin's Creed":"Ezio Auditore", "Final Fantasy":"Cloud Strife", "Sea of Thieves":"Capitaine Flameheart",
  "A Plague Tale":"Amicia de Rune", "Red Dead":"Arthur Morgan", "The Last of Us":"Joel",
  "Astérix":"Astérix", "Tintin":"Tintin", "Evangelion":"Shinji Ikari", "Saint Seiya":"Seiya",
  "Sailor Moon":"Sailor Moon", "One Punch Man":"Saitama", "Tokyo Ghoul":"Ken Kaneki",
  "Chainsaw Man":"Denji", "Fairy Tail":"Natsu Dragnir", "SCP Foundation":"SCP-173",
  "Terminator":"T-800", "Mad Max":"Max Rockatansky", "Arcane":"Jinx", "Avatar TLA":"Aang",
  "Stranger Things":"Eleven", "Breaking Bad":"Walter White", "Doctor Who":"Le Docteur",
  "Star Trek":"Spock", "Matrix":"Neo", "Jurassic Park":"Tyrannosaurus rex", "Disney":"Mickey Mouse"
};
function iconicOf(w, list){
  if(w && ICONIC[w.label]) return ICONIC[w.label];
  return (list && list.length) ? list[0].t : null;
}
function rollVariant(){
  const tot = VARIANTS.reduce((n,v)=>n+v.w,0);
  let r = Math.random()*tot;
  for(const v of VARIANTS){ r -= v.w; if(r <= 0) return v; }
  return VARIANTS[0];
}
function makeSpecial(card, variant){
  const c = Object.assign({}, card);
  c.variant = variant.key;
  c.id = "spec:" + card.id + ":" + variant.key;
  c.title = card.title + " — " + variant.name;
  c.count = 1;
  if(variant.key !== "std"){
    const mult = {noir:1.04, vintage:1.06, holo:1.10, fullart:1.14, secret:1.20}[variant.key] || 1;
    c.atk = Math.min(9999, Math.round(c.atk*mult));
    c.def = Math.min(9999, Math.round(c.def*mult));
  }
  return c;
}

/* l'icône d'un univers sort toujours sous l'une de ses six déclinaisons */
function maybeSpecial(card, w, list){
  if(!card || card.rarity === "Relique" || card.variant) return card;
  const icon = iconicOf(w, list);
  if(!icon || card.title.toLowerCase() !== String(icon).toLowerCase()) return card;
  return makeSpecial(card, rollVariant());
}

async function drawForRarity(w, rarity){
  const list = await mostLinked(w).catch(()=>[]);
  const tiers = list.length >= 20 ? tierMap(list) : null;

  if(RARITIES.indexOf(rarity) >= 2){          // Rare et au-dessus : on vise le palier
    if(tiers){
      // si le wiki n'a personne à ce rang, on descend d'un cran
      let i = RARITIES.indexOf(rarity), pick = null;
      while(i >= 2 && !pick){
        const bucket = tiers[RARITIES[i]];
        if(bucket && bucket.length) pick = shuffled(bucket).slice(0,3);
        else i--;
      }
      if(pick){
        for(const title of pick){
          const p = await pageByTitle(w, title);
          if(p && (p.length||0) > 300){
            const rich = await enrich(p, w);
            if(!hasBody(rich)) continue;
            // la table de drop a promis ce rang : on l'honore, quitte à puiser un cran plus bas
            const built = makeCard(rich, w,
              capFiller(p, bestRarity(rarity, intrinsicRarity(p, list))));
            return maybeSpecial(built, w, list);
          }
        }
      }
    }
    const pages = await drawPages(8, w);
    if(!pages.length) return null;
    pages.sort((x,y)=>notoriety(y)-notoriety(x));
    for(const pg of pages.slice(0,4)){
      const rich = await enrich(pg, w);
      if(!hasBody(rich)) continue;
      return maybeSpecial(makeCard(rich, w,
        capFiller(pg, bestRarity(rarity, intrinsicRarity(pg, list)))), w, list);
    }
    return null;
  }

  // Commun / Peu commun : le tout-venant du wiki. Un article notable peut monter,
  // mais jamais au-delà de Rare — les hauts rangs restent l'affaire de la table de drop.
  const pages = await drawPages(6, w);
  if(!pages.length) return null;
  const sorted = pages.sort((x,y)=>notoriety(y)-notoriety(x));
  const order = rarity === "Peu commun" ? sorted : sorted.slice().reverse();
  for(const pick of order){
    const rich = await enrich(pick, w);
    if(!hasBody(rich)) continue;
    const up = bestRarity(rarity, intrinsicRarity(pick, list));
    const capped = RARITIES.indexOf(up) > 2 ? "Rare" : up;
    return maybeSpecial(makeCard(rich, w, capFiller(pick, capped)), w, list);
  }
  return null;
}

function pctLabel(p){
  const v = p*100;
  const txt = v >= 1 ? v.toFixed(1) : v >= 0.1 ? v.toFixed(2) : v >= 0.01 ? v.toFixed(3) : v.toFixed(4);
  return `${txt} %<small style="color:var(--muted);font-weight:400"> · 1 sur ${Math.round(1/p).toLocaleString("fr-FR")}</small>`;
}

  const free = Math.min(state.profile.free||0, n);
  return {free, coins:(n-free)*PACK_PRICE};
}

  const c = costFor(n);
  return state.profile.coins >= c.coins;

  n = n || 1;
  if(state.busy) return false;

  if(kind === "demon")  return (state.profile.demon||0) >= n;
  if(kind === "fox")    return (state.profile.fox||0) >= n;
  return canAfford(n);
}
